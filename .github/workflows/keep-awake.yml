# Keeps the live demo awake on Render's free plan, which sleeps after about 15 minutes without visitors.
# It only reads /api/health, which never calls the language model, so it uses none of the model quota.
name: Keep awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -sf --max-time 90 https://muhawir.onrender.com/api/health || true
