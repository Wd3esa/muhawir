# Render blueprint for the live demo (https://render.com/docs/blueprint-spec).
# Free plan: the service sleeps after about 15 minutes without visitors and wakes on the next visit
# (about a minute). Building the database peaks at about 300 MB of the 512 MB.
# The database is built from the source dumps at deploy time and never stored in the repository.
# Secrets (API keys) are entered in Render's dashboard when the blueprint is created, never committed here.
services:
  - type: web
    name: muhawir
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt && python -m muhawir.build_data --download
    startCommand: uvicorn muhawir.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: LLM_PROVIDER
        value: model
      # Open model through Ollama's cloud API (https://docs.ollama.com/cloud), OpenAI-compatible format
      - key: OPENAI_COMPAT_BASE_URL
        value: https://ollama.com/v1
      - key: OPENAI_COMPAT_MODEL
        value: gpt-oss:120b
      - key: OPENAI_COMPAT_API_KEY
        sync: false          # the Ollama API key; Render asks for it when the blueprint is created
