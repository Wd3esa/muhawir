<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مُحاور</title>
<style>

  :root {
  color-scheme:light;
  --bg:#F7F5FE;
  --panel:#fff;
  --sidebar:#F2F4FF;
  --ink:#0E153F;
  --muted:#4A5590;
  --muted-soft:#8E99CC;
  --line:#D8DCEC;
  --accent:#6150EA;
  --accent-ink:#fff;
  --accent-soft:#E0D9FB;
  --mint:#2EF2C2;
  --deep:#12183F;
  --indigo:#2D3775;
  --warn-bg:#E0D9FB;
  --warn-ink:#2D3775;
  --card:#F2F4FF;
  --mine:#E0D9FB;
  --shadow:0 10px 34px rgba(18,24,63,.09);
  --focus:#6150EA
}

  @media(prefers-color-scheme:dark) {
  :root {
    color-scheme:dark;
    --bg:#0E153F;
    --panel:#12183F;
    --sidebar:#12183F;
    --ink:#F7F5FE;
    --muted:#8E99CC;
    --muted-soft:#4A5590;
    --line:#2D3775;
    --accent:#2EF2C2;
    --accent-ink:#0E153F;
    --accent-soft:#2D3775;
    --mint:#2EF2C2;
    --deep:#0E153F;
    --indigo:#4A5590;
    --warn-bg:#2D3775;
    --warn-ink:#F7F5FE;
    --card:#12183F;
    --mine:#2D3775;
    --shadow:0 10px 34px rgba(0,0,0,.22);
    --focus:#2EF2C2
  }
}

  * {
  box-sizing:border-box
}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.75 "Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",sans-serif
}
button,textarea,select {
  font:inherit
}
button {
  color:inherit
}
button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible {
  outline:3px solid var(--focus);
  outline-offset:2px
}

  .app-shell {
  min-height:100dvh;
  display:grid;
  grid-template-columns:286px minmax(0,1fr)
}
.sidebar {
  min-width:0;
  height:100dvh;
  position:sticky;
  top:0;
  display:flex;
  flex-direction:column;
  padding:22px 16px 14px;
  background:var(--sidebar);
  border-inline-end:1px solid var(--line);
  z-index:5
}
.sidebar-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:11px;
  padding:0 6px 22px
}
.brand-lockup {
  min-width:0;
  display:flex;
  align-items:center;
  gap:11px
}
.brand-mark {
  width:42px;
  height:42px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:var(--accent);
  background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 13%,transparent);
  border-radius:15px
}
.brand-mark svg {
  width:24px;
  height:24px
}
.brand-name {
  margin:0;
  font-family:Tahoma,"Segoe UI",sans-serif;
  font-size:21px;
  line-height:1.25;
  font-weight:700;
  letter-spacing:normal
}
.brand-caption {
  margin:3px 0 0;
  color:var(--muted);
  font-size:12px;
  line-height:1.4
}
.icon-button {
  width:40px;
  height:40px;
  display:inline-grid;
  place-items:center;
  flex:0 0 auto;
  border:1px solid transparent;
  border-radius:13px;
  background:transparent;
  cursor:pointer;
  color:var(--muted)
}
.icon-button:hover {
  color:var(--ink);
  background:color-mix(in srgb,var(--accent) 8%,transparent)
}
.icon-button svg {
  width:20px;
  height:20px
}
.sidebar-close {
  display:none
}
.history-toggle {
  display:inline-grid
}
@media(min-width:861px) {
  .app-shell { transition:grid-template-columns .22s ease }
  .app-shell.sidebar-collapsed { grid-template-columns:0 minmax(0,1fr) }
  .app-shell.sidebar-collapsed .sidebar { display:none }
  .app-shell.sidebar-collapsed .workspace { grid-column:2 }
}

  .new-chat {
  width:100%;
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  border:0;
  border-radius:15px;
  background:var(--accent);
  color:var(--accent-ink);
  font-weight:650;
  cursor:pointer;
  box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 18%,transparent);
  transition:transform .16s ease,box-shadow .16s ease
}
.new-chat:hover {
  transform:translateY(-1px);
  box-shadow:0 7px 16px color-mix(in srgb,var(--accent) 21%,transparent)
}
.new-chat svg {
  width:19px;
  height:19px
}
.history-heading {
  margin:28px 8px 10px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em
}
.history-search {
  height:42px;
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--line);
  border-radius:13px;
  padding:0 11px;
  color:var(--muted);
  background:color-mix(in srgb,var(--panel) 70%,transparent)
}
.history-search svg {
  width:17px;
  height:17px;
  flex:0 0 auto
}
.history-search input {
  min-width:0;
  width:100%;
  border:0;
  outline:0;
  color:var(--ink);
  background:transparent;
  font-size:13px
}
.history-search input::placeholder {
  color:var(--muted);
  opacity:.9
}
.history-list {
  display:flex;
  flex-direction:column;
  gap:4px;
  overflow:auto;
  margin-top:12px
}
.history-item {
  display:flex;
  align-items:center;
  gap:9px;
  min-height:43px;
  width:100%;
  padding:7px 10px;
  border:1px solid transparent;
  border-radius:12px;
  background:transparent;
  text-align:start;
  cursor:pointer;
  color:var(--muted);
  font-size:13px
}
.history-item:hover {
  background:color-mix(in srgb,var(--panel) 72%,transparent);
  color:var(--ink)
}
.history-item[aria-current="true"] {
  color:var(--ink);
  background:color-mix(in srgb,var(--panel) 90%,transparent);
  border-color:var(--line);
  box-shadow:0 2px 8px rgba(35,60,48,.035)
}
.history-item svg {
  width:17px;
  height:17px;
  flex:0 0 auto;
  opacity:.72
}
.history-item span {
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}
.history-empty {
  margin:12px 7px;
  color:var(--muted);
  font-size:12px;
  line-height:1.7
}
.sidebar-spacer {
  flex:1;
  min-height:20px
}
.sidebar-note {
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:12px 10px 4px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
  line-height:1.65
}
.sidebar-note svg {
  width:17px;
  height:17px;
  flex:0 0 auto;
  margin-top:2px;
  color:var(--accent)
}

  .workspace {
  position:relative;
  isolation:isolate;
  min-width:0;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--bg)
}
.ambient {
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:radial-gradient(ellipse 54% 43% at 87% 1%,rgba(46,242,194,.2),transparent 75%),radial-gradient(ellipse 47% 42% at 13% 12%,rgba(224,217,251,.72),transparent 78%),radial-gradient(ellipse 51% 38% at 69% 100%,rgba(97,80,234,.12),transparent 76%),linear-gradient(145deg,rgba(247,245,254,.58),transparent 43%)
}
.topbar {
  flex:0 0 auto;
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:0 clamp(18px,3.4vw,48px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 68%,transparent);
  background:color-mix(in srgb,var(--bg) 67%,transparent);
  backdrop-filter:blur(18px)
}
.topbar-start,.topbar-tools {
  min-width:0;
  display:flex;
  align-items:center;
  gap:12px
}
.topbar h1 {
  max-width:min(52vw,570px);
  margin:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:16px;
  line-height:1.4;
  font-weight:650
}
.trust-pill {
  display:inline-flex;
  align-items:center;
  gap:7px;
  white-space:nowrap;
  border:1px solid color-mix(in srgb,var(--accent) 14%,transparent);
  border-radius:100px;
  padding:6px 10px;
  color:var(--accent);
  background:color-mix(in srgb,var(--panel) 58%,transparent);
  font-size:11px;
  font-weight:650
}
.trust-pill svg {
  width:15px;
  height:15px
}
.lang-wrap {
  display:flex;
  align-items:center
}
.sr-only {
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap
}
.topbar select {
  max-width:100%;
  color:var(--ink);
  background:color-mix(in srgb,var(--panel) 70%,transparent);
  border:1px solid var(--line);
  border-radius:11px;
  padding:7px 9px;
  font-size:12px
}
.synthetic {
  flex:0 0 auto;
  margin:12px auto 0;
  width:min(850px,calc(100% - 40px));
  padding:8px 12px;
  border:1px solid color-mix(in srgb,#6150EA 20%,transparent);
  border-radius:12px;
  background:color-mix(in srgb,var(--warn-bg) 83%,transparent);
  color:var(--warn-ink);
  font-size:12px;
  line-height:1.5
}

  .conversation-frame {
  position:relative;
  z-index:1;
  width:100%;
  max-width:1000px;
  min-height:0;
  flex:1;
  display:flex;
  flex-direction:column;
  align-self:center;
  padding:0 clamp(18px,4vw,58px)
}
#thread {
  min-height:0;
  flex:1;
  display:flex;
  flex-direction:column;
  gap:18px;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:24px 2px 22px;
  scroll-behavior:smooth
}
.empty-state {
  width:100%;
  margin:auto;
  padding:36px 0 48px;
  text-align:center;
  animation:arrive .55s ease both
}
.welcome-orbit {
  width:74px;
  height:74px;
  display:grid;
  place-items:center;
  position:relative;
  margin:0 auto 22px;
  border:1px solid color-mix(in srgb,var(--accent) 16%,transparent);
  border-radius:27px;
  color:var(--accent);
  background:linear-gradient(145deg,color-mix(in srgb,var(--panel) 75%,transparent),color-mix(in srgb,var(--accent-soft) 73%,transparent));
  box-shadow:0 9px 24px rgba(42,68,57,.06);
  transform:rotate(-4deg)
}
.welcome-orbit:before,.welcome-orbit:after {
  content:"";
  position:absolute;
  border:1px solid color-mix(in srgb,var(--accent) 10%,transparent);
  border-radius:50%
}
.welcome-orbit:before {
  width:92px;
  height:92px
}
.welcome-orbit:after {
  width:110px;
  height:110px;
  border-style:dashed;
  opacity:.55
}
.welcome-orbit svg {
  width:33px;
  height:33px
}
.welcome-kicker {
  margin:0 0 7px;
  color:var(--accent);
  font-size:12px;
  font-weight:700;
  letter-spacing:.03em
}
.empty-state h2 {
  margin:0;
  font-size:clamp(26px,3vw,36px);
  letter-spacing:-.035em;
  line-height:1.35;
  font-weight:650
}
.welcome-copy {
  max-width:530px;
  margin:10px auto 26px;
  color:var(--muted);
  font-size:14px;
  line-height:1.85
}
.prompt-grid {
  max-width:720px;
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:11px;
  text-align:start
}
.suggestion {
  min-height:98px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  padding:13px 15px;
  border:1px solid color-mix(in srgb,var(--line) 85%,transparent);
  border-radius:16px;
  background:color-mix(in srgb,var(--panel) 68%,transparent);
  box-shadow:0 4px 16px rgba(45,70,58,.025);
  cursor:pointer;
  text-align:start;
  transition:border-color .16s ease,transform .16s ease,background .16s ease
}
.suggestion:hover {
  transform:translateY(-2px);
  border-color:color-mix(in srgb,var(--accent) 31%,var(--line));
  background:color-mix(in srgb,var(--panel) 90%,transparent)
}
.suggestion-topic {
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--accent);
  font-size:11px;
  font-weight:700
}
.suggestion-topic:before {
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--accent);
  opacity:.7
}
.suggestion-text {
  color:var(--ink);
  font-size:12px;
  line-height:1.7
}

  .turn-user {
  align-self:flex-start;
  max-width:min(78%,690px);
  border:1px solid color-mix(in srgb,var(--accent) 8%,transparent);
  border-radius:18px 18px 5px 18px;
  padding:11px 17px;
  white-space:pre-line;
  background:color-mix(in srgb,var(--mine) 91%,transparent);
  color:var(--ink);
  box-shadow:0 3px 12px rgba(44,67,56,.035);
  animation:arrive .25s ease both
}
.msg {
  align-self:stretch;
  padding:20px 22px;
  border:1px solid color-mix(in srgb,var(--line) 78%,transparent);
  border-radius:18px;
  background:color-mix(in srgb,var(--panel) 91%,transparent);
  color:var(--ink);
  box-shadow:0 8px 28px rgba(38,60,49,.055);
  white-space:pre-line;
  animation:arrive .35s ease both
}
.msg.pending {
  width:max-content;
  min-width:98px;
  color:var(--muted)
}
.answer-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
  padding-bottom:10px;
  border-bottom:1px solid color-mix(in srgb,var(--line) 77%,transparent)
}
.answer-brand {
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:12px;
  font-weight:700
}
.answer-brand .brand-mark {
  width:27px;
  height:27px;
  border-radius:10px
}
.answer-brand .brand-mark svg {
  width:16px;
  height:16px
}
.status {
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:var(--accent);
  font-size:11px
}
.status:before {
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:currentColor
}
.answer {
  margin:0;
  line-height:1.95
}
.answer-section {
  margin:14px 0 4px;
  font-size:16px;
  color:var(--accent)
}
.follow-up {
  display:block;
  margin-top:12px;
  font:inherit;
  font-size:15px;
  text-align:start;
  cursor:pointer;
  background:none;
  border:1px solid var(--accent);
  color:var(--accent);
  border-radius:999px;
  padding:6px 14px
}
.answer-list {
  margin:7px 0 0;
  padding-inline-start:22px
}
.answer-list li {
  margin:4px 0;
  padding-inline-start:3px
}
.cite {
  font-size:12px;
  vertical-align:super;
  line-height:0;
  margin-inline-start:2px
}
.cite a {
  color:var(--accent);
  text-decoration:none;
  font-weight:700
}
.sources-title {
  color:var(--muted);
  font-size:12px;
  margin:16px 0 0;
  font-weight:700
}
.card .num {
  color:var(--accent);
  margin-inline-end:6px
}
.card {
  background:color-mix(in srgb,var(--card) 85%,transparent);
  border:1px solid var(--line);
  border-radius:13px;
  padding:11px 14px;
  margin-top:9px
}
.card summary,.views summary {
  cursor:pointer;
  font-weight:650;
  font-size:13px
}
.card[open] summary,.views[open] summary {
  margin-bottom:7px
}
.card .about {
  color:var(--muted);
  font-size:12px;
  margin:2px 0 8px
}
.card blockquote {
  margin:0;
  padding-inline-start:12px;
  border-inline-start:3px solid var(--accent)
}
.example-tag {
  display:inline-block;
  font-size:11px;
  color:var(--muted);
  border:1px solid var(--line, currentColor);
  border-radius:6px;
  padding:0 6px;
  margin-inline-end:4px
}
.card blockquote.translation {
  margin-top:8px;
  font-style:italic
}
.card .meta {
  color:var(--muted);
  font-size:11px;
  margin-top:9px
}
.note {
  color:var(--muted);
  font-size:13px;
  margin-top:10px
}
.referral {
  border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));
  background:color-mix(in srgb,var(--accent) 6%,transparent);
  border-radius:12px;
  padding:10px 14px;
  margin-top:12px
}
.referral h3 {
  margin:0 0 4px;
  font-size:14px;
  color:var(--accent)
}
.referral p {
  margin:0 0 6px;
  font-size:13px
}
.referral ul {
  margin:0;
  padding-inline-start:18px;
  font-size:13px;
  line-height:1.8
}
.referral .where {
  color:var(--muted)
}
.views {
  border:1px dashed var(--line);
  border-radius:12px;
  padding:10px 14px;
  margin-top:10px
}
.view {
  margin:6px 0
}
.tools {
  margin-top:12px;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:4px
}
.action-btn {
  min-height:34px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 8px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  font:inherit;
  font-size:12px;
  cursor:pointer
}
.action-btn:hover,.action-btn[aria-expanded="true"],.action-btn[aria-pressed="true"] {
  color:var(--ink);
  background:color-mix(in srgb,var(--accent) 9%,transparent)
}
.action-btn:disabled { opacity:.5; cursor:wait }
.action-icon,.action-icon svg {
  width:17px;
  height:17px;
  flex:0 0 auto
}
.action-label { white-space:nowrap }
.action-status {
  min-height:20px;
  color:var(--muted);
  font-size:11px
}
.more-actions { position:relative }
.more-actions > summary { list-style:none; cursor:pointer }
.more-actions > summary::-webkit-details-marker { display:none }
.more-menu {
  position:absolute;
  z-index:7;
  inset-block-start:calc(100% + 5px);
  inset-inline-end:0;
  min-width:210px;
  padding:5px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel);
  box-shadow:var(--shadow)
}
.more-item {
  width:100%;
  display:block;
  border:0;
  border-radius:8px;
  padding:8px 10px;
  background:transparent;
  color:var(--ink);
  text-align:start;
  font:inherit;
  font-size:12px;
  cursor:pointer
}
.more-item:hover { background:color-mix(in srgb,var(--accent) 9%,transparent) }
.no-voice {
  font-size:12px;
  color:var(--muted);
  margin-top:4px
}
@media(max-width:620px) {
  .tools { gap:2px }
  .action-btn { width:36px; min-width:36px; justify-content:center; padding:0 }
  .action-label { display:none }
}

  #ask {
  flex:0 0 auto;
  padding:9px;
  border:1px solid color-mix(in srgb,var(--line) 89%,transparent);
  border-radius:21px;
  background:color-mix(in srgb,var(--panel) 94%,transparent);
  box-shadow:var(--shadow);
  backdrop-filter:blur(18px)
}
.composer-field {
  display:flex;
  align-items:flex-end;
  gap:9px;
  padding:3px 4px 5px
}
textarea {
  display:block;
  min-width:0;
  width:100%;
  min-height:49px;
  max-height:180px;
  resize:vertical;
  border:0;
  outline:0;
  border-radius:13px;
  padding:9px 11px;
  font:inherit;
  font-size:14px;
  line-height:1.7;
  color:var(--ink);
  background:transparent
}
textarea:focus-visible {
  outline:0
}
textarea::placeholder {
  color:var(--muted);
  opacity:.9
}
.composer-row {
  display:flex;
  min-height:43px;
  align-items:center;
  gap:8px;
  padding:3px 5px 2px;
  border-top:1px solid color-mix(in srgb,var(--line) 65%,transparent)
}
.style-wrap {
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:11px
}
.style-wrap select {
  border:0;
  padding:5px 8px;
  background:transparent;
  font-size:11px
}
.send {
  width:39px;
  height:39px;
  display:inline-grid;
  place-items:center;
  margin-inline-start:auto;
  border:0;
  border-radius:13px;
  background:var(--accent);
  color:var(--accent-ink);
  cursor:pointer;
  transition:transform .15s ease,opacity .15s ease
}
.send:hover {
  transform:translateY(-1px)
}
.send svg {
  width:19px;
  height:19px
}
.send span {
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap
}
.send:disabled {
  opacity:.58;
  cursor:wait
}
.mic {
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 9px;
  border:1px solid var(--line);
  border-radius:11px;
  background:transparent;
  color:var(--muted);
  font-size:11px;
  cursor:pointer
}
.mic svg {
  width:14px;
  height:14px;
  flex:0 0 auto
}
.mic:hover {
  color:var(--accent);
  border-color:var(--accent)
}
.mic[aria-pressed="true"] {
  border-color:var(--accent);
  color:var(--accent);
  font-weight:650;
  background:var(--accent-soft)
}
.voice-note {
  padding:0 11px 7px;
  color:var(--muted);
  font-size:10px
}
.disclaimer {
  flex:0 0 auto;
  margin:9px 0 10px;
  text-align:center;
  color:var(--muted);
  font-size:10px;
  line-height:1.5
}
.sidebar-scrim {
  display:none
}
a {
  color:var(--accent)
}
@keyframes blink {
  0%,80%,100% {
    opacity:.25
  }
  40% {
    opacity:1
  }
}
@keyframes arrive {
  from {
    opacity:0;
    transform:translateY(5px)
  }
  to {
    opacity:1;
    transform:translateY(0)
  }
}
.typing span {
  display:inline-block;
  width:7px;
  height:7px;
  margin:0 2px;
  border-radius:50%;
  background:var(--muted);
  animation:blink 1.2s infinite ease-in-out
}
.typing span:nth-child(2) {
  animation-delay:.2s
}
.typing span:nth-child(3) {
  animation-delay:.4s
}

  @media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    transition-duration:.01ms!important
  }
}

  @media(prefers-color-scheme:dark) {
  .ambient {
    background:radial-gradient(ellipse 54% 43% at 87% 1%,rgba(46,242,194,.12),transparent 75%),radial-gradient(ellipse 47% 42% at 13% 12%,rgba(97,80,234,.14),transparent 78%),radial-gradient(ellipse 51% 38% at 69% 100%,rgba(45,55,117,.2),transparent 76%),linear-gradient(145deg,rgba(255,255,255,.025),transparent 43%)
  }

    box-shadow:0 9px 24px rgba(0,0,0,.14)
  }
}

  align-items:center;

.rider-status-copy {
  flex:0 1 auto;
  min-width:0;
  max-width:155px;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
  text-align:start
}
@keyframes rider-patrol {
  0%,100% { left:0; transform:scaleX(1) }
  45% { left:calc(100% - var(--rider-size)); transform:scaleX(1) }
  50% { left:calc(100% - var(--rider-size)); transform:scaleX(-1) }
  95% { left:0; transform:scaleX(-1) }
}
@keyframes rider-bounce {
  from { transform:translateY(0) }
  to { transform:translateY(-2px) }
}
@keyframes rider-rear {
  0% { opacity:0; transform:translateY(5px) rotate(-5deg) scale(.94) }
  70% { opacity:1; transform:translateY(-2px) rotate(3deg) scale(1.05) }
  100% { opacity:1; transform:none }
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}


const RIDER_ART = '<span class="rider-silhouette rider-pose-gallop"></span><span class="rider-silhouette rider-pose-rear"></span>';

let riderPhraseCounter = 0;
function createRiderStatus(locale) {
  const t = UI[locale] || UI.en;
  const phrase = t.thinking[riderPhraseCounter % t.thinking.length];
  riderPhraseCounter += 1;
  const pending = el("div", "msg pending rider-status is-searching");
  pending.setAttribute("role", "status");
  pending.setAttribute("aria-label", phrase);
  pending.dir = locale === "ar" ? "rtl" : "ltr";
  const track = el("span", "rider-track");
  track.setAttribute("aria-hidden", "true");
  const runner = el("span", "rider-runner");
  runner.innerHTML = RIDER_ART;
  track.append(runner);
  pending.append(track, el("span", "rider-status-copy", phrase));
  return pending;
}

async function completeRiderStatus(pending, response, locale) {
  const t = UI[locale] || UI.en;
  const found = response.status === "answered" && Array.isArray(response.sources) && response.sources.length > 0;
  pending.classList.remove("is-searching");
  pending.classList.add(found ? "is-found" : "is-settled");
  const label = pending.querySelector(".rider-status-copy");
  const phrase = found ? t.found : t.settled;
  if (label) label.textContent = phrase;
  pending.setAttribute("aria-label", phrase);
  if (!found || !pending.isConnected || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  await new Promise((resolve) => setTimeout(resolve, 480));
}

function renderHistory() {
  const list = $("historyList");
  list.replaceChildren();
  const query = $("historySearch").value.trim().toLocaleLowerCase();
  const matches = conversations.filter((conversation) => conversation.messages.length && conversation.title.toLocaleLowerCase().includes(query))
    .sort((a, b) => b.updatedAt - a.updatedAt);
  for (const conversation of matches) {
    const item = el("button", "history-item");
    item.type = "button";
    item.setAttribute("aria-current", String(conversation === activeConversation));
    item.title = conversation.title;
    item.append(el("span", "history-glyph", "◷"), el("span", "", conversation.title));
    item.addEventListener("click", () => selectConversation(conversation));
    list.append(item);
  }
  $("historyEmpty").hidden = matches.length > 0;
  $("historyEmpty").textContent = query && !matches.length ? UI[lang].noMatches : UI[lang].historyEmpty;
}

function updateConversationTitle() {
  $("conversationTitle").textContent = activeConversation.title;
}

function renderConversation(conversation) {
  $("thread").replaceChildren();
  if (conversation.messages.length) $("thread").append(...conversation.messages);
  else {
    const empty = emptyTemplate.cloneNode(true);
    empty.querySelectorAll("[data-t]").forEach((node) => { node.textContent = UI[lang][node.dataset.t]; });
    $("thread").append(empty);
  }
  updateConversationTitle();
  renderHistory();
  syncRegenerateButtons();
  if (conversation.messages.length) $("thread").scrollTop = $("thread").scrollHeight;
}

function selectConversation(conversation) {
  activeConversation = conversation;
  $("q").value = "";
  renderConversation(conversation);
  closeHistory();
}

function startNewConversation() {
  if (!activeConversation.messages.length) {
    $("q").value = "";
    closeHistory();
    $("q").focus();
    return;
  }
  activeConversation = { id: nextConversationId++, title: UI[lang].newChat, messages: [], turns: [], updatedAt: Date.now() };
  conversations.push(activeConversation);
  $("q").value = "";
  renderConversation(activeConversation);
  closeHistory();
  if (window.matchMedia("(min-width: 861px)").matches) $("q").focus();
}

function isMobileLayout() {
  return !window.matchMedia("(min-width: 861px)").matches;
}

function updateHistoryToggle() {
  const mobile = isMobileLayout();
  const open = mobile
    ? $("appShell").classList.contains("drawer-open")
    : !$("appShell").classList.contains("sidebar-collapsed");
  const label = mobile ? (open ? UI[lang].closeHistory : UI[lang].openHistory)
    : (open ? UI[lang].hideHistory : UI[lang].showHistory);
  $("openHistory").setAttribute("aria-expanded", String(open));
  $("openHistory").setAttribute("aria-label", label);
  $("openHistory").title = label;
}

function openHistory() {
  if (isMobileLayout()) {
    $("appShell").classList.add("drawer-open");
    $("closeHistory").focus();
  } else {
    $("appShell").classList.remove("sidebar-collapsed");
  }
  updateHistoryToggle();
}

function closeHistory() {
  if (!isMobileLayout()) return;
  $("appShell").classList.remove("drawer-open");
  updateHistoryToggle();
  $("openHistory").focus();
}

function toggleHistory() {
  if (isMobileLayout()) {
    if ($("appShell").classList.contains("drawer-open")) closeHistory();
    else openHistory();
    return;
  }
  $("appShell").classList.toggle("sidebar-collapsed");
  updateHistoryToggle();
}

function applyLang() {
  const t = UI[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach((n) => { n.textContent = t[n.dataset.t]; });

  $("q").setAttribute("aria-label", t.qlabel);
  $("mic").lastElementChild.textContent = recognizing ? t.micStop : t.mic;
  $("lang").setAttribute("aria-label", t.lang);
  $("historySearch").placeholder = t.historySearch;
  $("historySearch").setAttribute("aria-label", t.historySearch);
  $("closeHistory").setAttribute("aria-label", t.closeHistory);
  updateHistoryToggle();
  $("sidebar").setAttribute("aria-label", t.historyLabel);
  $("historyList").setAttribute("aria-label", t.recent);
  $("brandName").textContent = t.assistant;
  if (!activeConversation.messages.length) activeConversation.title = t.newChat;
  $("thread").setAttribute("aria-label", t.assistant);
  $("send").setAttribute("aria-label", t.send);
  $("conversationTitle").textContent = activeConversation.title;
  $("synthetic").textContent = t.synthetic;
  conversations.forEach((conversation) => conversation.messages.forEach((message) => {
    if (message?.responseActions) applyActionTranslations(message);
  }));
  renderHistory();
}

// Muhawir's own words only: quoted ayahs, tafsir and hadith are never read by a computer voice.
function spokenText(res) {
  const parts = [];
  if (res.message) parts.push(res.message);
  let heading = "";
  for (const c of res.claims || []) {
    if (c.text.startsWith("«")) continue;
    if (c.section && c.section !== heading) { heading = c.section; parts.push(heading + "."); }
    parts.push((c.label ? c.label + ": " : "") + c.text);
  }
  if (res.follow_up) parts.push(res.follow_up);
  for (const v of res.views || []) parts.push(`${v.school}: ${v.text}`);
  return parts.join("\n");
}

// Browsers load their voices late (Chrome on first use), so wait for them briefly.
function voicesReady() {
  const now = speechSynthesis.getVoices();
  if (now.length) return Promise.resolve(now);
  return new Promise((resolve) => {
    const done = () => resolve(speechSynthesis.getVoices());
    speechSynthesis.addEventListener("voiceschanged", done, { once: true });
    setTimeout(done, 1500);
  });
}

function pickVoice(voices, speakLang) {
  const tag = speakLang === "ar" ? "ar-sa" : "en-us";
  const ofLang = voices.filter((v) => v.lang.toLowerCase().replace("_", "-").startsWith(speakLang));
  return ofLang.find((v) => v.lang.toLowerCase().replace("_", "-") === tag) || ofLang[0] || null;
}

// Short pieces, one after another: Chrome stops long utterances after about 15 seconds.
function pieces(text) {
  return text.split(/(?<=[.!?؟。\n])\s*/).map((x) => x.trim()).filter(Boolean);
}

  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.5-4.5M8.2 13.2l7.5 4.5"/></svg>',
  listen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6l-5 4H4Z"/><path d="M17 9a5 5 0 0 1 0 6m2.5-9a9 9 0 0 1 0 12"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  regenerate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4.7 9A7.5 7.5 0 0 1 18 6l2 6M4 17v-5h5m10.3 3A7.5 7.5 0 0 1 6 18l-2-6"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>',
  sources: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h14v15H5zM8 8h8M8 12h8M8 16h5"/></svg>'
};

function actionIcon(name) {
  const icon = el("span", "action-icon");
  icon.setAttribute("aria-hidden", "true");
  icon.innerHTML = ACTION_ICONS[name];
  return icon;
}

function makeActionButton(label, iconName, className = "", labelKey = iconName) {
  const button = el("button", `action-btn${className ? ` ${className}` : ""}`);
  button.type = "button";
  button.dataset.labelKey = labelKey;
  button.setAttribute("aria-label", label);
  button.title = label;
  button.append(actionIcon(iconName), el("span", "action-label", label));
  return button;
}

function setActionStatus(status, key) {
  status.dataset.statusKey = key;
  status.textContent = UI[lang][key] || "";
}

function applyActionTranslations(message) {
  const t = UI[lang];
  message.responseActions.querySelectorAll("[data-label-key]").forEach((control) => {
    const key = control.dataset.labelKey;
    const label = key === "sources"
      ? (control.getAttribute("aria-expanded") === "true" ? t.hideSources : t.showSources)
      : t[key];
    if (!label) return;
    const text = control.querySelector(".action-label");
    if (text) text.textContent = label;
    control.setAttribute("aria-label", label);
    control.title = label;
  });
  message.responseActions.querySelectorAll("[data-item-key]").forEach((item) => {
    item.textContent = t[item.dataset.itemKey];
  });
  const statusKey = message.actionStatus.dataset.statusKey;
  if (statusKey) message.actionStatus.textContent = t[statusKey] || "";
}

function listenButton(res, status) {
  const text = spokenText(res);
  if (!("speechSynthesis" in window) || !text) return null;
  const speakLang = /[\u0600-\u06FF]/.test(text) ? "ar" : "en";  // use the reply's language, e.g. English on request
  const btn = makeActionButton(UI[lang].listen, "listen");
  const label = btn.querySelector(".action-label");
  const icon = btn.querySelector(".action-icon");
  const reset = () => {
    delete btn.dataset.playing;
    btn.setAttribute("aria-pressed", "false");
    btn.dataset.labelKey = "listen";
    label.textContent = UI[lang].listen;
    btn.setAttribute("aria-label", UI[lang].listen);
    btn.title = UI[lang].listen;
    icon.innerHTML = ACTION_ICONS.listen;
  };
  btn.play = async () => {
    speechSynthesis.cancel();
    const voice = pickVoice(await voicesReady(), speakLang);
    if (!voice) { status.textContent = UI[speakLang].noVoice; delete status.dataset.statusKey; return; }
    status.textContent = "";
    delete status.dataset.statusKey;
    btn.dataset.playing = "1";
    btn.setAttribute("aria-pressed", "true");
    btn.dataset.labelKey = "stop";
    label.textContent = UI[lang].stop;
    btn.setAttribute("aria-label", UI[lang].stop);
    btn.title = UI[lang].stop;
    icon.innerHTML = ACTION_ICONS.stop;
    const parts = pieces(text);
    parts.forEach((part, i) => {
      const u = new SpeechSynthesisUtterance(part);
      u.lang = voice.lang;
      try { u.voice = voice; } catch { /* the language tag alone still picks it */ }
      if (i === parts.length - 1) u.onend = reset;
      u.onerror = reset;
      speechSynthesis.speak(u);
    });
  };
  btn.addEventListener("click", () => {
    if (btn.dataset.playing) { speechSynthesis.cancel(); reset(); return; }
    btn.play();
  });
  return btn;
}

function answerText(res, includeSourcePassages = false) {
  const lines = [];
  if (res.message) lines.push(res.message);
  const sourceNumbers = new Map((res.sources || []).map((source, i) => [source.passage_id, i + 1]));
  for (const claim of res.claims || []) {
    const text = `${claim.label ? `${claim.label}: ` : ""}${claim.text}`;
    const refs = [...new Set(claim.passage_ids || [])].map((id) => sourceNumbers.get(id)).filter(Boolean);
    lines.push(`${claim.section ? `${claim.section}: ` : ""}${text}${refs.length ? ` [${refs.join(", ")}]` : ""}`);
  }
  for (const view of res.views || []) {
    const refs = [...new Set(view.passage_ids || [])].map((id) => sourceNumbers.get(id)).filter(Boolean);
    lines.push(`${view.school}: ${view.text}${refs.length ? ` [${refs.join(", ")}]` : ""}`);
  }
  if (res.note) lines.push(res.note);
  if (res.referral && res.referral.title) {
    lines.push("", res.referral.title, res.referral.intro);
    for (const link of res.referral.links || []) lines.push(`- ${link.label}${link.where ? ` (${link.where})` : ""}: ${link.url}`);
  }
  if (res.follow_up) lines.push(res.follow_up);
  if ((res.sources || []).length) {
    lines.push("", UI[lang].sources + ":");
    for (const [i, source] of res.sources.entries()) {
      lines.push(`[${i + 1}] ${source.source_name || source.location}${source.location ? ` · ${source.location}` : ""}`);
      if (includeSourcePassages && source.quote) lines.push(source.quote);
    }
  }
  return lines.join("\n").trim();
}

async function writeClipboard(text) {
  if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); return; }
  const field = el("textarea");
  field.value = text;
  field.setAttribute("readonly", "");
  field.style.position = "fixed";
  field.style.opacity = "0";
  document.body.append(field);
  field.select();
  const copied = document.execCommand("copy");
  field.remove();
  if (!copied) throw new Error("Clipboard unavailable");
}

function rememberable(res) {
  return !["invalid", "declined", "abstained", "unavailable"].includes(res.status);
}

function renderAnswer(res, style, context) {
  const open = style === "extended";
  const t = UI[lang];
  const msg = el("div", "msg");
  const heading = el("div", "answer-heading");
  const identity = el("div", "answer-brand");
  const mark = el("span", "brand-mark");
  mark.setAttribute("aria-hidden", "true");
  mark.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 14.3 9.7 20.5 12l-6.2 2.3L12 20.5l-2.3-6.2L3.5 12l6.2-2.3L12 3.5Z"/></svg>';
  identity.append(mark, el("span", "", t.assistant));
  heading.append(identity);
  const statusText = t.status[res.status];
  if (statusText) heading.append(el("span", "status", statusText));
  msg.append(heading);
  if (res.message) { const m = el("div", "", res.message); m.dir = "auto"; msg.append(m); }
  // Sources are numbered; each sentence of the answer carries the numbers of the sources it rests on.
  const number = new Map((res.sources || []).map((s, i) => [s.passage_id, i + 1]));
  const cardFor = new Map();
  const sourceCards = [];
  const quoted = new Set((res.sources || []).map((s) => `«${s.quote}»`));
  // A claim that only repeats a passage word for word is already shown in its source card.
  const shown = new Set();  // passages whose text is itself the answer stay open
  const cite = (c) => {  // the numbers of the sources a sentence rests on, each opening its card
    const sup = el("span", "cite");
    for (const id of new Set(c.passage_ids)) {
      const n = number.get(id);
      if (!n) continue;
      const a = el("a", "", `[${n}]`);
      a.href = "#"; a.title = t.source;
      a.addEventListener("click", (e) => {
        e.preventDefault();
        const card = cardFor.get(id);
        if (card) { card.open = true; card.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
      });
      sup.append(a);
    }
    return sup;
  };
  const sentences = (res.claims || []).filter((c) => {
    if (!quoted.has(c.text)) return true;
    c.passage_ids.forEach((id) => shown.add(id));
    return false;
  });
  // one sentence: an optional bold label («المقدار:»), the text, then its source numbers
  const fill = (node, c) => {
    if (c.label) node.append(el("strong", "", c.label + ": "));
    // an everyday example is Muhawir's own illustration, not the source's words: it says so
    if (c.example) node.append(el("span", "example-tag", t.exampleTag), " ");
    node.append(c.text);
    const sup = cite(c);
    if (sup.childNodes.length) node.append(sup);
  };
  const paragraph = () => { const p = el("p", "answer"); p.dir = "auto"; return p; };
  const list = () => { const u = el("ul", "answer-list"); u.dir = "auto"; return u; };
  if (sentences.some((c) => c.section)) {
    // a short definition, then each part under its own heading, as a list
    let block = null, current = null, outro = null;
    const intro = paragraph();
    for (const c of sentences) {
      if (!c.section) {  // before the first heading: the definition; after the parts: a closing line
        const p = block ? (outro || (outro = paragraph())) : intro;
        if (p.childNodes.length) p.append(" ");
        fill(p, c);
        continue;
      }
      if (c.section !== current) {
        if (intro.childNodes.length && !intro.parentNode) msg.append(intro);
        current = c.section;
        const h = el("h4", "answer-section", current); h.dir = "auto";
        block = list();
        msg.append(h, block);
      }
      const li = el("li"); fill(li, c); block.append(li);
    }
    if (intro.childNodes.length && !intro.parentNode) msg.append(intro);
    if (outro) msg.append(outro);
  } else {
    const answer = paragraph();
    // types, kinds, conditions or steps: a short lead sentence, then one item per line
    const items = res.as_list && sentences.length > 1 ? list() : null;
    // the first sentence leads the list only when it introduces it (ends with a colon)
    const lead = items && /[:：]\s*$/.test(sentences[0].text);
    sentences.forEach((c, i) => {
      if (items && (i > 0 || !lead)) { const li = el("li"); fill(li, c); items.append(li); return; }
      if (answer.childNodes.length) answer.append(" ");
      fill(answer, c);
    });
    if (answer.childNodes.length) msg.append(answer);
    if (items) msg.append(items);
  }
  if (res.note) msg.append(el("p", "note", res.note));
  if ((res.views || []).length) {
    // the usual order: Hanafi, Maliki, Shafi'i, Hanbali, then others
    const ORDER = [/حنيف|حنف|احناف|أحناف/, /مالك/, /شافع/, /أحمد|احمد|حنبل/];
    const rank = (name) => { const i = ORDER.findIndex((re) => re.test(name)); return i < 0 ? ORDER.length : i; };
    const panel = el("details", "views");
    panel.open = true;  // the scholars' views are the answer to a ruling question: shown, not hidden
    panel.append(el("summary", "", t.views));
    for (const v of [...res.views].sort((a, b) => rank(a.school) - rank(b.school))) {
      const row = el("p", "view");
      row.dir = "auto";
      row.append(el("strong", "", v.school + ": "), document.createTextNode(v.text));
      const sup = cite(v);
      if (sup.childNodes.length) row.append(sup);
      panel.append(row);
    }
    msg.append(panel);
  }
  if (res.follow_up) {  // Muhawir's suggestion to continue the dialogue: a tap asks it
    const next = el("button", "follow-up", res.follow_up);
    next.type = "button"; next.dir = "auto";
    next.addEventListener("click", () => { $("q").value = res.follow_up; $("ask").requestSubmit(); });
    msg.append(next);
  }
  if (res.referral && res.referral.title) {  // who to ask when Muhawir refers on: official bodies, opened in a new tab
    const box = el("section", "referral");
    box.dir = "auto";
    box.append(el("h3", "", res.referral.title), el("p", "", res.referral.intro));
    if ((res.referral.links || []).length) {
      const list = el("ul");
      for (const link of res.referral.links) {
        const item = el("li");
        const a = el("a", "", link.label);
        a.href = link.url; a.target = "_blank"; a.rel = "noopener noreferrer";
        item.append(a);
        if (link.where) item.append(el("span", "where", ` · ${link.where}`));
        list.append(item);
      }
      box.append(list);
    }
    msg.append(box);
  }
  if ((res.sources || []).length) msg.append(el("div", "sources-title", t.sources));
  for (const s of res.sources || []) {
    const card = el("details", "card");
    card.open = open || shown.has(s.passage_id);
    cardFor.set(s.passage_id, card);
    // a hadith shows its grading in the folded line, so it is never seen without it
    const summary = el("summary");
    const label = s.kind !== "hadith" ? `${s.source_name} · ${s.location}`
      : s.grade ? `${t.hadith} (${t.grade}: ${s.grade}) · ${s.source_name}`
      : s.location;  // e.g. «صحيح البخاري، رقم 1»
    summary.append(el("span", "num", `[${number.get(s.passage_id)}]`), label);
    card.append(summary);
    card.append(el("div", "about", s.source_about));
    card.append(el("blockquote", "", s.quote));
    if (s.translation) {  // the approved English translation of the verse's meaning (King Fahd Complex)
      const tr = el("blockquote", "translation", s.translation);
      tr.dir = "ltr"; tr.lang = "en";
      card.append(tr);
      if (s.translation_name) card.append(el("div", "meta", s.translation_name));
    }
    if (s.topics) card.append(el("div", "meta", `${t.topics}: ${s.topics}`));
    const meta = el("div", "meta", `${t.location}: ${s.location}` + (s.grade ? ` · ${t.grade}: ${s.grade}` : ""));
    if (s.source_url) {
      const a = el("a", "", t.open);
      a.href = s.source_url; a.target = "_blank"; a.rel = "noopener";
      meta.append(" · ", a);
    }
    if (s.kind === "hadith") {  // check this hadith on dorar.net, as dorar's own search box for site owners does
      const a = el("a", "", t.verify);
      a.href = "https://dorar.net/hadith/search?q=" + encodeURIComponent(searchPhrase(s.quote));
      a.target = "_blank"; a.rel = "noopener";
      meta.append(" · ", a);
    }
    card.append(meta);
    msg.append(card);
    sourceCards.push(card);
  }
  const actions = el("div", "tools");
  actions.setAttribute("role", "group");
  actions.setAttribute("aria-label", t.responseActions);
  const status = el("span", "action-status");
  status.setAttribute("role", "status");
  status.setAttribute("aria-live", "polite");

  const copy = makeActionButton(t.copyAnswer, "copy", "", "copyAnswer");
  copy.addEventListener("click", async () => {
    try { await writeClipboard(answerText(res)); setActionStatus(status, "copied"); }
    catch { setActionStatus(status, "copyFailed"); }
  });
  actions.append(copy);

  const share = makeActionButton(t.shareAnswer, "share", "", "shareAnswer");
  share.addEventListener("click", async () => {
    const text = answerText(res);
    try {
      if (navigator.share) await navigator.share({ title: t.assistant, text });
      else { await writeClipboard(text); setActionStatus(status, "shareFallback"); }
    } catch (error) {
      if (error?.name !== "AbortError") setActionStatus(status, "shareFailed");
    }
  });
  actions.append(share);

  const listen = listenButton(res, status);
  if (listen) { actions.append(listen); msg.listen = listen; }

  const regenerate = makeActionButton(t.regenerate, "regenerate", "", "regenerate");
  regenerate.disabled = !context;
  regenerate.addEventListener("click", () => regenerateAnswer(msg));
  actions.append(regenerate);

  const more = el("details", "more-actions");
  const moreSummary = el("summary", "action-btn");
  moreSummary.dataset.labelKey = "more";
  moreSummary.setAttribute("aria-expanded", "false");
  moreSummary.setAttribute("aria-label", t.more);
  moreSummary.title = t.more;
  moreSummary.append(actionIcon("more"), el("span", "action-label", t.more));
  more.append(moreSummary);
  const menu = el("div", "more-menu");
  const copySources = el("button", "more-item", t.copyWithSources);
  copySources.type = "button";
  copySources.dataset.itemKey = "copyWithSources";
  copySources.addEventListener("click", async () => {
    try { await writeClipboard(answerText(res, true)); setActionStatus(status, "copied"); }
    catch { setActionStatus(status, "copyFailed"); }
    more.open = false;
  });
  const simplify = el("button", "more-item", t.simplifyAnswer);
  simplify.type = "button";
  simplify.dataset.itemKey = "simplifyAnswer";
  simplify.addEventListener("click", () => {
    more.open = false;
    $("q").value = UI[lang].simplifyPrompt;
    $("q").focus();
    $("ask").requestSubmit();
  });
  menu.append(copySources, simplify);
  more.append(menu);
  more.addEventListener("toggle", () => moreSummary.setAttribute("aria-expanded", String(more.open)));
  actions.append(more);

  if (sourceCards.length) {
    const sourcesButton = makeActionButton(sourceCards.every((card) => card.open) ? t.hideSources : t.showSources, "sources", "", "sources");
    const label = sourcesButton.querySelector(".action-label");
    const setSourceLabel = (expanded) => {
      const current = UI[lang];
      const text = expanded ? current.hideSources : current.showSources;
      label.textContent = text;
      sourcesButton.setAttribute("aria-label", text);
      sourcesButton.title = text;
      sourcesButton.setAttribute("aria-expanded", String(expanded));
    };
    setSourceLabel(sourceCards.every((card) => card.open));
    sourcesButton.addEventListener("click", () => {
      const expanded = !sourceCards.every((card) => card.open);
      sourceCards.forEach((card) => { card.open = expanded; });
      setSourceLabel(expanded);
    });
    actions.append(sourcesButton);
  }

  actions.append(status);
  msg.append(actions);
  msg.actionStatus = status;
  msg.regenerateButton = regenerate;
  msg.responseActions = actions;
  msg.responseData = res;
  msg.requestContext = context;
  return msg;
}

function syncRegenerateButtons(conversation) {
  const targets = conversation ? [conversation] : conversations;
  for (const item of targets) {
    const latest = item.messages.at(-1);
    for (const message of item.messages) {
      if (message?.regenerateButton) message.regenerateButton.disabled = message !== latest || $("send").disabled;
    }
  }
}

async function regenerateAnswer(message) {
  const context = message.requestContext;
  const conversation = context?.conversation;
  if (!context || !conversation || conversation.messages.at(-1) !== message || $("send").disabled) return;
  const messageIndex = conversation.messages.indexOf(message);
  if (messageIndex < 0) return;
  const send = $("send");
  send.disabled = true;
  syncRegenerateButtons();
  message.regenerateButton.disabled = true;
  setActionStatus(message.actionStatus, "regenerating");
  const pending = createRiderStatus(context.lang || lang);
  conversation.messages.push(pending);
  if (activeConversation === conversation) { $("thread").append(pending); scrollDown(); }
  try {
    const response = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: context.question, style: context.style, lang: context.lang, history: context.history }) });
    if (!response.ok) throw new Error(response.status);
    const res = await response.json();
    await completeRiderStatus(pending, res, context.lang || lang);
    const replacement = renderAnswer(res, context.style, context);
    conversation.messages[messageIndex] = replacement;
    conversation.messages = conversation.messages.filter((entry) => entry !== pending);
    if (activeConversation === conversation) {
      message.replaceWith(replacement);
      pending.remove();
    }
    conversation.turns = context.history.slice();
    if (rememberable(res)) {
      remember(conversation, "user", res.understood || context.question);
      remember(conversation, "assistant", [res.message, ...(res.claims || []).map((claim) => claim.text)].filter(Boolean).join(" "));
    }
    conversation.updatedAt = Date.now();
    if (activeConversation === conversation) scrollDown();
  } catch {
    conversation.messages = conversation.messages.filter((entry) => entry !== pending);
    if (activeConversation === conversation) pending.remove();
    setActionStatus(message.actionStatus, "error");
  } finally {
    send.disabled = false;
    syncRegenerateButtons();
    renderHistory();
  }
}

// A short distinctive phrase of a hadith for dorar's search: the Prophet's words when quoted, else the last words.
function searchPhrase(text) {
  const plain = text.replace(/[\u064B-\u0652\u0670\u0640]/g, "");
  const quoted = plain.match(/"([^"]{15,})"/) || plain.match(/«([^»]{15,})»/);
  const words = (quoted ? quoted[1] : plain).replace(/[^\p{L}\s]/gu, " ").split(/\s+/).filter(Boolean);
  return (quoted ? words.slice(0, 7) : words.slice(-7)).join(" ");
}

function remember(conversation, role, text) {
  if (!text) return;
  conversation.turns.push({ role, text: text.slice(0, 600) });
  while (conversation.turns.length > MAX_HISTORY) conversation.turns.shift();
}

function scrollDown() { $("thread").scrollTo({ top: $("thread").scrollHeight, behavior: "smooth" }); }

$("lang").addEventListener("change", (e) => { lang = e.target.value; applyLang(); });
$("newChat").addEventListener("click", startNewConversation);
$("openHistory").addEventListener("click", toggleHistory);
$("closeHistory").addEventListener("click", closeHistory);
$("sidebarScrim").addEventListener("click", closeHistory);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("appShell").classList.contains("drawer-open")) closeHistory();
});
$("historySearch").addEventListener("input", renderHistory);
window.addEventListener("resize", () => {
  if (!isMobileLayout()) $("appShell").classList.remove("drawer-open");
  updateHistoryToggle();
}, { passive: true });
$("thread").addEventListener("click", (e) => {
  const suggestion = e.target.closest(".suggestion");
  if (!suggestion) return;
  $("q").value = suggestion.querySelector(".suggestion-text").textContent;
  $("q").focus();
});

$("ask").addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = $("q").value.trim();
  if (!question || $("send").disabled) return;  // one question at a time: Enter must not send a second
  const askedBySpeech = spokenTurn;
  spokenTurn = false;
  stopListening();
  const conversation = activeConversation;
  const style = $("style").value;
  const requestLang = lang;
  const requestHistory = conversation.turns.slice();
  const context = { conversation, question, style, lang: requestLang, history: requestHistory };
  const send = $("send");
  send.disabled = true;
  syncRegenerateButtons();
  $("empty")?.remove();
  const userMessage = el("div", "turn-user", question);
  userMessage.dir = "auto";
  conversation.messages.push(userMessage);
  conversation.updatedAt = Date.now();
  if (conversation.messages.length === 1) {
    const title = question.replace(/\s+/g, " ").trim();
    conversation.title = title.length > 42 ? `${title.slice(0, 41).trimEnd()}…` : title;
    updateConversationTitle();
    renderHistory();
  }
  $("thread").append(userMessage);
  const pending = createRiderStatus(requestLang);
  conversation.messages.push(pending);
  syncRegenerateButtons();
  conversation.updatedAt = Date.now();
  $("thread").append(pending);
  $("q").value = "";
  scrollDown();
  try {
    const r = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, style, lang: requestLang, history: requestHistory }) });
    if (!r.ok) throw new Error(r.status);
    const res = await r.json();
    await completeRiderStatus(pending, res, requestLang);
    const msg = renderAnswer(res, style, context);
    const pendingIndex = conversation.messages.indexOf(pending);
    if (pendingIndex >= 0) conversation.messages[pendingIndex] = msg;
    pending.replaceWith(msg);
    if (askedBySpeech && msg.listen) msg.listen.play();  // spoken question: spoken reply
    // answers and Muhawir's offers (e.g. "shall I explain it more simply?") are remembered, so a follow-up
    // or a "yes" is understood; refusals, errors and "not found" are not answers to explain again
    if (rememberable(res)) {
      remember(conversation, "user", res.understood || question);
      remember(conversation, "assistant", [res.message, ...(res.claims || []).map((c) => c.text)].filter(Boolean).join(" "));
    }
    syncRegenerateButtons();
  } catch {
    const errorMessage = el("div", "msg", UI[lang].error);
    const pendingIndex = conversation.messages.indexOf(pending);
    if (pendingIndex >= 0) conversation.messages[pendingIndex] = errorMessage;
    pending.replaceWith(errorMessage);
    syncRegenerateButtons();
  } finally {
    send.disabled = false;
    syncRegenerateButtons();
    conversation.updatedAt = Date.now();
    renderHistory();
    if (activeConversation === conversation) {
      scrollDown();
      if (window.matchMedia("(min-width: 861px)").matches) $("q").focus();
    }
  }
});

$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("ask").requestSubmit(); }
});

// Voice input: the browser's own speech recognition (Chrome, Edge, Safari). Hidden where unavailable.
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
function stopListening() { if (recognizer && recognizing) recognizer.stop(); }
if (Recognition) {
  $("mic").hidden = false;
  $("voiceNote").hidden = false;
  $("mic").addEventListener("click", () => {
    if (recognizing) { stopListening(); return; }
    recognizer = new Recognition();
    recognizer.lang = lang === "ar" ? "ar-SA" : "en-US";
    recognizer.interimResults = true;
    recognizer.continuous = false;
    window.speechSynthesis?.cancel();  // stop reading the last reply while the user speaks
    const before = $("q").value.trim();
    let heard = false;
    recognizer.onresult = (ev) => {
      const said = Array.from(ev.results).map((r) => r[0].transcript).join(" ");
      $("q").value = (before ? before + " " : "") + said;
      heard = Boolean(said.trim());
    };
    let failed = false;
    recognizer.onerror = () => { failed = true; };
    recognizer.onend = () => {
      recognizing = false;
      $("mic").setAttribute("aria-pressed", "false");
      $("mic").lastElementChild.textContent = UI[lang].mic;
      // the user talked: send what was heard and answer by voice, like a conversation
      if (heard && !failed && $("q").value.trim()) { spokenTurn = true; $("ask").requestSubmit(); }
    };
    recognizing = true;
    $("mic").setAttribute("aria-pressed", "true");
    $("mic").lastElementChild.textContent = UI[lang].micStop;
    recognizer.start();
  });
}

fetch("/api/health").then((r) => r.json()).then((h) => { $("synthetic").hidden = !h.synthetic; }).catch(() => {});
renderHistory();
applyLang();
</script>
</body>
</html>
