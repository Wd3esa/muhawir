<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>مُحاور</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem("muhawir-theme") === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
<style>
@font-face {
  font-family:"Muhawir Arabic";
  src:url("/fonts/NotoSansArabic-Regular.ttf") format("truetype");
  font-style:normal;
  font-weight:400;
  font-display:swap
}
@font-face {
  font-family:"Muhawir Arabic";
  src:url("/fonts/NotoSansArabic-Bold.ttf") format("truetype");
  font-style:normal;
  font-weight:700;
  font-display:swap
}

  :root {
  color-scheme:light;
  --bg:#F7F5FE;
  --panel:#FFFFFF;
  --sidebar:#F2F4FF;
  --ink:#0E153F;
  --muted:#4A5590;
  --muted-soft:#6676A5;
  --line:#7583AA;
  --accent:#6150EA;
  --accent-ink:#FFFFFF;
  --accent-soft:#E0D9FB;
  --mint:#2EF2C2;
  --deep:#12183F;
  --indigo:#2D3775;
  --warn-bg:#E0D9FB;
  --warn-ink:#2D3775;
  --card:#FFFFFF;
  --mine:#E0D9FB;
  --shadow:0 10px 34px rgba(18,24,63,.09);
  --focus:#6150EA;
  --glow-mint:rgba(46,242,194,.36);
  --glow-violet:rgba(97,80,234,.29)
}

:root[data-theme="dark"] {
    color-scheme:dark;
    --bg:#171D36;
    --panel:#222A49;
    --sidebar:#1D2544;
    --ink:#F7F8FF;
    --muted:#D9E0F4;
    --muted-soft:#BAC6E7;
    --line:#8E9CC7;
    --accent:#C5BAFF;
    --accent-ink:#171D36;
    --accent-soft:#343B6B;
    --mint:#77DECA;
    --deep:#171D36;
    --indigo:#D9E0F4;
    --warn-bg:#39365F;
    --warn-ink:#F7F8FF;
    --card:#222A49;
    --mine:#343B6B;
    --shadow:0 10px 34px rgba(0,0,0,.25);
    --focus:#C5BAFF;
    --glow-mint:rgba(119,222,202,.24);
    --glow-violet:rgba(160,139,255,.30)
}

  * {
  box-sizing:border-box
}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.75 "Muhawir Arabic",system-ui,Tahoma,sans-serif
}
button,textarea,select {
  font:inherit
}
button {
  color:inherit
}
button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible {
  outline:3px solid var(--focus);
  outline-offset:2px
}

  .app-shell {
  min-height:var(--chat-viewport-height,100dvh);
  display:grid;
  grid-template-columns:286px minmax(0,1fr)
}
.sidebar {
  min-width:0;
  height:var(--chat-viewport-height,100dvh);
  position:sticky;
  top:0;
  display:flex;
  flex-direction:column;
  padding:22px 16px 14px;
  background:var(--sidebar);
  border-inline-end:1px solid var(--line);
  z-index:5
}
.sidebar-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:11px;
  padding:0 6px 22px
}
.brand-lockup {
  min-width:0;
  display:flex;
  align-items:center;
  gap:11px
}
.brand-mark {
  width:42px;
  height:42px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:var(--accent);
  background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 13%,transparent);
  border-radius:15px
}
.brand-mark svg {
  width:24px;
  height:24px
}
.brand-name {
  margin:0;
  font-family:Tahoma,"Segoe UI",sans-serif;
  font-size:21px;
  line-height:1.25;
  font-weight:700;
  letter-spacing:normal
}
.brand-caption {
  margin:3px 0 0;
  color:var(--muted);
  font-size:12px;
  line-height:1.4
}
.icon-button {
  width:40px;
  height:40px;
  display:inline-grid;
  place-items:center;
  flex:0 0 auto;
  border:1px solid transparent;
  border-radius:13px;
  background:transparent;
  cursor:pointer;
  color:var(--muted)
}
.icon-button:hover {
  color:var(--ink);
  background:color-mix(in srgb,var(--accent) 8%,transparent)
}
.theme-toggle {
  border-color:var(--line);
  background:var(--panel);
  color:var(--accent)
}
.theme-toggle svg { width:19px; height:19px }
.theme-toggle .theme-sun { display:none }
:root[data-theme="dark"] .theme-toggle .theme-moon { display:none }
:root[data-theme="dark"] .theme-toggle .theme-sun { display:block }
.icon-button svg {
  width:20px;
  height:20px
}
.sidebar-close {
  display:none
}
.history-toggle {
  display:inline-grid
}
@media(min-width:861px) {
  .app-shell { transition:grid-template-columns .22s ease }
  .app-shell.sidebar-collapsed { grid-template-columns:0 minmax(0,1fr) }
  .app-shell.sidebar-collapsed .sidebar { display:none }
  .app-shell.sidebar-collapsed .workspace { grid-column:2 }
}

  .new-chat {
  width:100%;
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  border:0;
  border-radius:15px;
  background:var(--accent);
  color:var(--accent-ink);
  font-weight:650;
  cursor:pointer;
  box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 18%,transparent);
  transition:transform .16s ease,box-shadow .16s ease
}
.new-chat:hover {
  transform:translateY(-1px);
  box-shadow:0 7px 16px color-mix(in srgb,var(--accent) 21%,transparent)
}
.new-chat svg {
  width:19px;
  height:19px
}
.history-heading {
  margin:28px 8px 10px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em
}
.history-search {
  height:42px;
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--line);
  border-radius:13px;
  padding:0 11px;
  color:var(--muted);
  background:color-mix(in srgb,var(--panel) 70%,transparent)
}
.history-search svg {
  width:17px;
  height:17px;
  flex:0 0 auto
}
.history-search input {
  min-width:0;
  width:100%;
  border:0;
  outline:0;
  color:var(--ink);
  background:transparent;
  font-size:13px
}
.history-search input::placeholder {
  color:var(--muted);
  opacity:.9
}
.history-list {
  display:flex;
  flex-direction:column;
  gap:4px;
  overflow:auto;
  margin-top:12px
}
.history-item {
  display:flex;
  align-items:center;
  gap:9px;
  min-height:43px;
  width:100%;
  padding:7px 10px;
  border:1px solid transparent;
  border-radius:12px;
  background:transparent;
  text-align:start;
  cursor:pointer;
  color:var(--muted);
  font-size:13px
}
.history-item:hover {
  background:color-mix(in srgb,var(--panel) 72%,transparent);
  color:var(--ink)
}
.history-item[aria-current="true"] {
  color:var(--ink);
  background:color-mix(in srgb,var(--panel) 90%,transparent);
  border-color:var(--line);
  box-shadow:0 2px 8px rgba(35,60,48,.035)
}
.history-item svg {
  width:17px;
  height:17px;
  flex:0 0 auto;
  opacity:.72
}
.history-item span {
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}
.history-empty {
  margin:12px 7px;
  color:var(--muted);
  font-size:12px;
  line-height:1.7
}
.sidebar-spacer {
  flex:1;
  min-height:20px
}
.sidebar-note {
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:12px 10px 4px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
  line-height:1.65
}
.sidebar-note svg {
  width:17px;
  height:17px;
  flex:0 0 auto;
  margin-top:2px;
  color:var(--accent)
}

  .workspace {
  position:relative;
  isolation:isolate;
  min-width:0;
  height:var(--chat-viewport-height,100dvh);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--bg)
}
.ambient {
  position:absolute;
  inset:0;
  z-index:-1;
  overflow:hidden;
  pointer-events:none;
  background:radial-gradient(ellipse 60% 45% at 92% 8%,var(--glow-mint),transparent 78%),radial-gradient(ellipse 65% 54% at 5% 65%,var(--glow-violet),transparent 78%)
}
.ambient::before,.ambient::after {
  content:"";
  position:absolute;
  width:min(92vw,860px);
  height:min(65vh,680px);
  border-radius:50%;
  filter:blur(32px);
  opacity:.34;
  transition:opacity .65s ease
}
.ambient::before {
  top:-26%;
  right:-24%;
  background:radial-gradient(ellipse,var(--glow-mint),transparent 72%)
}
.ambient::after {
  bottom:-32%;
  left:-24%;
  background:radial-gradient(ellipse,var(--glow-violet),transparent 72%)
}
.workspace:has(.rider-status.is-searching) .ambient::before {
  opacity:.92;
  will-change:transform;
  animation:ambient-drift-a 8s ease-in-out infinite alternate
}
.workspace:has(.rider-status.is-searching) .ambient::after {
  opacity:.86;
  will-change:transform;
  animation:ambient-drift-b 10s ease-in-out infinite alternate
}
.workspace:has(.rider-status.is-searching) #ask {
  box-shadow:var(--shadow),0 0 34px color-mix(in srgb,var(--accent) 20%,transparent)
}
@keyframes ambient-drift-a {
  from { transform:translate3d(0,0,0) scale(1) }
  to { transform:translate3d(-19vw,19vh,0) scale(1.2) }
}
@keyframes ambient-drift-b {
  from { transform:translate3d(0,0,0) scale(1) }
  to { transform:translate3d(19vw,-17vh,0) scale(1.18) }
}
.topbar {
  flex:0 0 auto;
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:0 clamp(18px,3.4vw,48px);
  border-bottom:1px solid var(--line);
  background:var(--sidebar)
}
.topbar-start,.topbar-tools {
  min-width:0;
  display:flex;
  align-items:center;
  gap:12px
}
.topbar h1 {
  max-width:min(52vw,570px);
  margin:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:16px;
  line-height:1.4;
  font-weight:650
}
.trust-pill {
  display:inline-flex;
  align-items:center;
  gap:7px;
  white-space:nowrap;
  border:1px solid color-mix(in srgb,var(--accent) 14%,transparent);
  border-radius:100px;
  padding:6px 10px;
  color:var(--accent);
  background:color-mix(in srgb,var(--panel) 58%,transparent);
  font-size:11px;
  font-weight:650
}
.trust-pill svg {
  width:15px;
  height:15px
}
.lang-wrap {
  display:flex;
  align-items:center
}
.sr-only {
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap
}
.topbar select {
  max-width:100%;
  color:var(--ink);
  background:color-mix(in srgb,var(--panel) 70%,transparent);
  border:1px solid var(--line);
  border-radius:11px;
  padding:7px 9px;
  font-size:12px
}
.synthetic {
  flex:0 0 auto;
  margin:12px auto 0;
  width:min(850px,calc(100% - 40px));
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:color-mix(in srgb,var(--warn-bg) 83%,transparent);
  color:var(--warn-ink);
  font-size:12px;
  line-height:1.5
}

  .conversation-frame {
  position:relative;
  z-index:1;
  width:100%;
  max-width:1000px;
  min-height:0;
  flex:1;
  display:flex;
  flex-direction:column;
  align-self:center;
  padding:0 clamp(18px,4vw,58px)
}
#thread {
  min-height:0;
  flex:1;
  display:flex;
  flex-direction:column;
  gap:18px;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:24px 2px 22px;
  scroll-behavior:smooth
}
.empty-state {
  width:100%;
  margin:auto;
  padding:36px 0 48px;
  text-align:center;
  animation:arrive .55s ease both
}
.kids-list {
  list-style:none;
  margin:4px 0 10px;
  padding:0;
  display:grid;
  gap:10px
}
.kids-list li {
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:10px 12px;
  border-radius:14px;
  background:color-mix(in srgb,var(--accent) 7%,transparent);
  line-height:1.8
}
.kids-icon {
  flex:none;
  font-size:1.35em;
  line-height:1.4
}
.welcome-wordmark {
  width:min(430px,84%);
  margin:0 auto 3px;
  color:var(--accent);
  line-height:0
}
.welcome-wordmark svg {
  display:block;
  width:100%;
  height:auto;
  overflow:visible;
  filter:drop-shadow(0 7px 18px color-mix(in srgb,var(--accent) 18%,transparent))
}
.welcome-kicker {
  display:inline-block;
  position:relative;
  margin:0 auto 25px;
  color:var(--accent);
  font-size:17px;
  font-weight:700;
  letter-spacing:0;
  line-height:1.6;
  white-space:nowrap
}
.welcome-kicker-measure { visibility:hidden }
.welcome-kicker-typed {
  position:absolute;
  inset:0;
  text-align:start
}
.welcome-kicker.is-typing .welcome-kicker-typed::after {
  content:"";
  display:inline-block;
  width:2px;
  height:.95em;
  margin-inline-start:3px;
  vertical-align:-.13em;
  background:currentColor;
  animation:welcome-caret .7s steps(1,end) infinite
}
@keyframes welcome-caret {
  50% { opacity:0 }
}
.prompt-grid {
  max-width:720px;
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:11px;
  text-align:start
}
.suggestion {
  min-height:98px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--panel);
  box-shadow:0 4px 16px rgba(45,70,58,.025);
  cursor:pointer;
  text-align:start;
  transition:border-color .16s ease,transform .16s ease,background .16s ease
}
.suggestion:hover {
  transform:translateY(-2px);
  border-color:color-mix(in srgb,var(--accent) 31%,var(--line));
  background:color-mix(in srgb,var(--panel) 90%,transparent)
}
.suggestion-topic {
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--accent);
  font-size:11px;
  font-weight:700
}
.suggestion-topic:before {
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--accent)
}
.suggestion-text {
  color:var(--ink);
  font-size:12px;
  line-height:1.7
}

  .turn-user {
  align-self:flex-start;
  max-width:min(78%,690px);
  border:1px solid color-mix(in srgb,var(--accent) 8%,transparent);
  border-radius:18px 18px 5px 18px;
  padding:11px 17px;
  white-space:pre-line;
  background:var(--mine);
  color:var(--ink);
  box-shadow:0 3px 12px rgba(44,67,56,.035);
  animation:arrive .25s ease both
}
.msg {
  align-self:stretch;
  padding:20px 22px;
  border:1px solid color-mix(in srgb,var(--line) 78%,transparent);
  border-radius:18px;
  background:var(--panel);
  color:var(--ink);
  box-shadow:0 8px 28px rgba(38,60,49,.055);
  white-space:pre-line;
  animation:arrive .35s ease both
}
.msg.pending {
  width:max-content;
  min-width:98px;
  color:var(--muted)
}
.answer-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
  padding-bottom:10px;
  border-bottom:1px solid color-mix(in srgb,var(--line) 77%,transparent)
}
.answer-brand {
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:12px;
  font-weight:700
}
.answer-brand .brand-mark {
  width:27px;
  height:27px;
  border-radius:10px
}
.answer-brand .brand-mark svg {
  width:16px;
  height:16px
}
.status {
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:var(--accent);
  font-size:11px
}
.status:before {
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:currentColor
}
.answer {
  margin:0;
  line-height:1.95
}
.answer-section {
  margin:14px 0 4px;
  font-size:16px;
  color:var(--accent)
}
.follow-up {
  display:block;
  margin-top:12px;
  font:inherit;
  font-size:15px;
  text-align:start;
  cursor:pointer;
  background:none;
  border:1px solid var(--accent);
  color:var(--accent);
  border-radius:999px;
  padding:6px 14px
}
.answer-list {
  margin:7px 0 0;
  padding-inline-start:22px
}
.answer-list li {
  margin:4px 0;
  padding-inline-start:3px
}
.cite {
  font-size:12px;
  vertical-align:super;
  line-height:0;
  margin-inline-start:2px
}
.cite a {
  color:var(--accent);
  text-decoration:none;
  font-weight:700
}
.sources-title {
  color:var(--muted);
  font-size:12px;
  margin:16px 0 0;
  font-weight:700
}
.card .num {
  color:var(--accent);
  margin-inline-end:6px
}
.card {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:13px;
  padding:11px 14px;
  margin-top:9px
}
.card summary,.views summary {
  cursor:pointer;
  font-weight:650;
  font-size:13px
}
.card[open] summary,.views[open] summary {
  margin-bottom:7px
}
.card .about {
  color:var(--muted);
  font-size:12px;
  margin:2px 0 8px
}
.card blockquote {
  margin:0;
  padding-inline-start:12px;
  border-inline-start:3px solid var(--accent)
}
.example-tag {
  display:inline-block;
  font-size:11px;
  color:var(--muted);
  border:1px solid var(--line, currentColor);
  border-radius:6px;
  padding:0 6px;
  margin-inline-end:4px
}
.card blockquote.translation {
  margin-top:8px;
  font-style:italic
}
.card .meta {
  color:var(--muted);
  font-size:11px;
  margin-top:9px
}
.note {
  color:var(--muted);
  font-size:13px;
  margin-top:10px
}
.referral {
  border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));
  background:color-mix(in srgb,var(--accent) 6%,transparent);
  border-radius:12px;
  padding:10px 14px;
  margin-top:12px
}
.referral h3 {
  margin:0 0 4px;
  font-size:14px;
  color:var(--accent)
}
.referral p {
  margin:0 0 6px;
  font-size:13px
}
.referral ul {
  margin:0;
  padding-inline-start:18px;
  font-size:13px;
  line-height:1.8
}
.referral .where {
  color:var(--muted)
}
.general-info {
  margin-top:12px;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 14px
}
.general-info > summary {
  cursor:pointer;
  font-weight:600;
  color:var(--accent, inherit);
  min-height:32px;
  line-height:1.8
}
.general-info[open] > summary {
  margin-bottom:8px
}
.views {
  border:1px dashed var(--line);
  border-radius:12px;
  padding:10px 14px;
  margin-top:10px
}
.view {
  margin:6px 0
}
.tools {
  margin-top:12px;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:4px
}
.action-btn {
  min-height:34px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 8px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  font:inherit;
  font-size:12px;
  cursor:pointer
}
.action-btn:hover,.action-btn[aria-expanded="true"],.action-btn[aria-pressed="true"] {
  color:var(--ink);
  background:color-mix(in srgb,var(--accent) 9%,transparent)
}
.action-btn:disabled { opacity:.5; cursor:wait }
.action-icon,.action-icon svg {
  width:17px;
  height:17px;
  flex:0 0 auto
}
.action-label { white-space:nowrap }
.action-status {
  min-height:20px;
  color:var(--muted);
  font-size:11px
}
.listen-group { display:inline-flex; flex-direction:column; align-items:flex-start; gap:2px; max-width:100% }
.listen-controls { display:inline-flex; align-items:center; gap:4px }
.voice-choice { display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--muted) }
.voice-choice select {
  min-height:34px;
  padding:3px 7px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--panel);
  color:var(--ink);
  font:inherit
}
.listen-note { font-size:11px; line-height:1.5; color:var(--muted); max-width:350px }
.more-actions { position:relative }
.more-actions > summary { list-style:none; cursor:pointer }
.more-actions > summary::-webkit-details-marker { display:none }
.more-menu {
  position:absolute;
  z-index:7;
  inset-block-start:calc(100% + 5px);
  inset-inline-end:0;
  min-width:210px;
  padding:5px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel);
  box-shadow:var(--shadow)
}
.more-item {
  width:100%;
  display:block;
  border:0;
  border-radius:8px;
  padding:8px 10px;
  background:transparent;
  color:var(--ink);
  text-align:start;
  font:inherit;
  font-size:12px;
  cursor:pointer
}
.more-item:hover { background:color-mix(in srgb,var(--accent) 9%,transparent) }
.no-voice {
  font-size:12px;
  color:var(--muted);
  margin-top:4px
}
@media(max-width:620px) {
  .tools { gap:2px }
  .action-btn { width:36px; min-width:36px; justify-content:center; padding:0 }
  .action-label { display:none }
  .listen-group .action-btn { width:auto; min-width:42px; padding:0 7px }
  .listen-group .action-label { display:inline }
}

  #ask {
  flex:0 0 auto;
  padding:9px;
  border:1px solid var(--line);
  border-radius:21px;
  background:var(--panel);
  box-shadow:var(--shadow);
  backdrop-filter:blur(18px);
  transition:box-shadow .65s ease
}
.composer-field {
  display:flex;
  align-items:flex-end;
  gap:9px;
  padding:3px 4px 5px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--bg)
}
.composer-field:focus-within {
  border-color:var(--accent);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 28%,transparent)
}
textarea {
  display:block;
  min-width:0;
  width:100%;
  min-height:49px;
  max-height:180px;
  resize:vertical;
  border:0;
  outline:0;
  border-radius:13px;
  padding:9px 11px;
  font:inherit;
  font-size:16px;
  line-height:1.7;
  color:var(--ink);
  background:transparent
}
textarea:focus-visible {
  outline:0
}
textarea::placeholder {
  color:var(--muted);
  opacity:1
}
.composer-row {
  display:flex;
  min-height:43px;
  align-items:center;
  gap:8px;
  padding:8px 5px 2px
}
.style-wrap {
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--ink);
  font-size:14px;
  font-weight:600
}
.style-wrap select {
  min-height:44px;
  border:1px solid var(--line);
  border-radius:10px;
  padding:6px 10px;
  background:var(--bg);
  color:var(--ink);
  font-size:14px
}
.send {
  width:44px;
  height:44px;
  display:inline-grid;
  place-items:center;
  margin-inline-start:auto;
  border:0;
  border-radius:13px;
  background:var(--accent);
  color:var(--accent-ink);
  cursor:pointer;
  transition:transform .15s ease,opacity .15s ease
}
.send:hover {
  transform:translateY(-1px)
}
.send svg {
  width:19px;
  height:19px
}
.send span {
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap
}
.send:disabled {
  opacity:.58;
  cursor:wait
}
.stop-request {
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:6px 12px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--accent-soft);
  color:var(--ink);
  cursor:pointer
}
.stop-request[hidden] { display:none }
.stop-request svg { width:17px; height:17px; flex:none }
.stop-request:hover { border-color:var(--accent); color:var(--accent) }
.request-notice {
  margin:6px 12px 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}
.mic {
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:44px;
  padding:6px 10px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  cursor:pointer
}
.mic svg {
  width:14px;
  height:14px;
  flex:0 0 auto
}
.mic:hover {
  color:var(--accent);
  border-color:var(--accent)
}
.mic[aria-pressed="true"] {
  border-color:var(--accent);
  color:var(--accent);
  font-weight:650;
  background:var(--accent-soft)
}
.voice-note {
  padding:0 11px 7px;
  color:var(--muted);
  font-size:13px;
  line-height:1.6
}
.disclaimer {
  flex:0 0 auto;
  margin:9px 0 10px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:1.6
}
.sidebar-scrim {
  display:none
}
a {
  color:var(--accent)
}
@media(max-width:620px) {
  .ambient::before,.ambient::after {
    width:95vw;
    height:55vh;
    filter:blur(26px)
  }
  .ambient::before { right:-42%; top:-19% }
  .ambient::after { left:-42%; bottom:-25% }
}
@media(prefers-reduced-motion:reduce) {
  .workspace:has(.rider-status.is-searching) .ambient::before,
  .workspace:has(.rider-status.is-searching) .ambient::after {
    animation:none;
    transform:none
  }
}
@keyframes blink {
  0%,80%,100% {
    opacity:.25
  }
  40% {
    opacity:1
  }
}
@keyframes arrive {
  from {
    opacity:0;
    transform:translateY(5px)
  }
  to {
    opacity:1;
    transform:translateY(0)
  }
}
.typing span {
  display:inline-block;
  width:7px;
  height:7px;
  margin:0 2px;
  border-radius:50%;
  background:var(--muted);
  animation:blink 1.2s infinite ease-in-out
}
.typing span:nth-child(2) {
  animation-delay:.2s
}
.typing span:nth-child(3) {
  animation-delay:.4s
}

  @media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    transition-duration:.01ms!important
  }
}

  @media(max-width:860px) {
  .app-shell {
    display:block
  }
  .sidebar {
    position:fixed;
    inset-block:0;
    inset-inline-start:0;
    width:min(310px,calc(100vw - 48px));
    height:var(--chat-viewport-height,100dvh);
    transform:translateX(105%);
    transition:transform .22s ease;
    box-shadow:none
  }
  .app-shell.drawer-open .sidebar {
    transform:translateX(0);
    box-shadow:var(--shadow)
  }
  .app-shell.drawer-open .sidebar-scrim {
    display:block;
    position:fixed;
    inset:0;
    z-index:4;
    background:rgba(22,34,29,.3);
    backdrop-filter:blur(2px)
  }

    display:inline-grid
  }
  .conversation-frame {
    max-width:900px
  }
}

  [dir="ltr"] .sidebar {
    transform:translateX(-105%)
  }
  .app-shell {
    display:block
  }
  .sidebar {
    position:fixed;
    inset-block:0;
    inset-inline-start:0;
    width:min(310px,calc(100vw - 48px));
    height:var(--chat-viewport-height,100dvh);
    transform:translateX(105%);
    transition:transform .22s ease;
    box-shadow:none
  }
  .app-shell.drawer-open .sidebar {
    transform:translateX(0);
    box-shadow:var(--shadow)
  }
  .app-shell.drawer-open .sidebar-scrim {
    display:block;
    position:fixed;
    inset:0;
    z-index:4;
    background:rgba(22,34,29,.3);
    backdrop-filter:blur(2px)
  }
  .sidebar-close,.mobile-menu {
    display:inline-grid
  }
  .conversation-frame {
    max-width:900px
  }
}

/* Compact source-search scholar animation. */
.msg.pending.rider-status { display:flex; align-items:center; gap:10px; width:max-content; max-width:100%; min-width:0; padding:4px 0; border:0; border-radius:0; background:transparent; box-shadow:none; white-space:normal; }
.scholar-visual { width:48px; height:48px; flex:0 0 48px; background-image:var(--scholar-art); background-size:600% 100%; background-repeat:no-repeat; }
.is-searching .scholar-visual { animation:scholar-pages 1.4s step-end infinite; }
@keyframes scholar-pages { 0%,100% { background-position:0% 0; } 25% { background-position:20% 0; } 50% { background-position:40% 0; } 75% { background-position:60% 0; } }
.is-found .scholar-visual,.is-settled .scholar-visual { animation:scholar-close .55s step-end both; }
@keyframes scholar-close { 0% { background-position:60% 0; } 40% { background-position:80% 0; } 80%,100% { background-position:100% 0; } }
.rider-status-copy { color:var(--muted); font-size:14px; line-height:1.6; }
.search-outcome { margin:0 0 12px; color:var(--muted); font-size:13px; }
:root { --bg:#fff; --sidebar:#f8f8fc; --line:#dedee9; --shadow:0 3px 14px rgba(18,24,63,.04); }
:root[data-theme="dark"] { --bg:#171d36; --sidebar:#1d2544; --line:#424b6b; }
.ambient,.trust-pill { display:none; }
.topbar { background:var(--bg); border-bottom:0; }
.welcome-wordmark { width:min(260px,65%); }
.welcome-wordmark svg { filter:none; }
.welcome-description { max-width:460px; margin:18px auto 16px; color:var(--muted); font-size:15px; line-height:1.9; text-wrap:pretty; }
.welcome-kicker { white-space:normal; margin-bottom:0; color:var(--ink); }
.msg:not(.pending) { border:0; background:transparent; box-shadow:none; padding-inline:0; }
#ask { display:flex; align-items:flex-end; gap:8px; padding:8px; box-shadow:none; backdrop-filter:none; }
.composer-field { flex:1; min-width:0; border:0; background:transparent; padding:0; }
.composer-field:focus-within { box-shadow:none; }
.composer-row { flex:0 0 auto; flex-wrap:nowrap; gap:6px; padding:0; min-height:44px; }
.mic,.stop-request { width:40px; height:44px; min-height:44px; padding:0; border:0; display:inline-flex; justify-content:center; align-items:center; }
.mic span,.stop-request span { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
.mic[hidden],.stop-request[hidden],.send[hidden] { display:none; }
.voice-note { flex:1 1 100%; }
#ask:has(.voice-note:not([hidden])) { flex-wrap:wrap; }
.style-settings { padding:10px 8px; color:var(--muted); font-size:13px; }
.style-settings summary { cursor:pointer; }
.action-btn[aria-pressed="true"],.action-btn[aria-pressed="true"]:disabled { color:var(--ink); opacity:1; background:var(--sidebar); }
.style-settings .style-wrap { display:flex; flex-direction:column; align-items:stretch; gap:5px; margin-top:12px; font-size:13px; }
.style-settings .style-wrap select { max-width:100%; }
@media(max-width:620px) { .welcome-wordmark { width:min(230px,65%); } .msg.pending.rider-status { width:max-content; padding:4px 0; } .composer-row { flex-wrap:nowrap; } textarea { min-height:44px; padding:7px; } .disclaimer { font-size:12px; } }
@media(prefers-reduced-motion:reduce) { .is-searching .scholar-visual,.is-found .scholar-visual,.is-settled .scholar-visual { animation:none; } .is-found .scholar-visual,.is-settled .scholar-visual { background-position:100% 0; } }

/* Chat content must be visible on its first paint, including during Android IME updates. */
.turn-user,.msg,.empty-state { animation:none; opacity:1; transform:none; }
@media(max-width:860px) {
  html,body { height:100%; overflow:hidden; }
  .app-shell { height:var(--chat-viewport-height,100dvh); min-height:0; overflow:hidden; }
  .workspace { height:100%; }
  #thread > .turn-user,#thread > .msg { flex-shrink:0; }
}
/* The question composer follows wrapped text, with scrolling only for long questions. */
#q { resize:none; overflow-y:hidden; }

function typeWelcomeKicker() {
  window.clearTimeout(welcomeTypingTimer);
  const node = $("thread").querySelector(".welcome-kicker");
  if (!node) return;
  const typed = node.querySelector(".welcome-kicker-typed");
  const phrase = UI[lang].welcomeKicker;
  if (welcomeMotion.matches) {
    typed.textContent = phrase;
    node.classList.remove("is-typing");
    return;
  }
  const letters = typeof Intl.Segmenter === "function"
    ? Array.from(new Intl.Segmenter(lang, { granularity: "grapheme" }).segment(phrase), (part) => part.segment)
    : Array.from(phrase).reduce((parts, letter) => {
      if (/\p{Mark}/u.test(letter) && parts.length) parts[parts.length - 1] += letter;
      else parts.push(letter);
      return parts;
    }, []);
  typed.textContent = "";
  node.classList.add("is-typing");
  let index = 0;
  const write = () => {
    if (!typed.isConnected) return;
    typed.textContent += letters[index++];
    if (index < letters.length) welcomeTypingTimer = window.setTimeout(write, letters[index] === " " ? 120 : 72);
    else {
      node.classList.remove("is-typing");
      welcomeTypingTimer = null;

  };

// Muhawir's own words only: quoted ayahs, tafsir and hadith are never read by a computer voice.
function spokenText(res) {
  const parts = [];
  if (res.message) parts.push(res.message);
  // a sentence that cites a verse quotes it between «», {}, ﴿﴾ or "" (English translation): every quotation in
  // it is taken as the verse and replaced by «(آية)», so no synthetic voice ever reads the Quran
  const verseIds = new Set((res.sources || []).filter((s) => s.kind === "quran" || s.kind === "tafsir")
    .map((s) => s.passage_id));
  const mark = /[\u0600-\u06FF]/.test(JSON.stringify(res.claims || [])) ? "(آية)" : "(verse)";
  const safe = (text, ids) => {
    let out = text.replace(/﴿[^﴾]*(?:﴾|$)/g, mark).replace(/\{[^}]*(?:\}|$)/g, mark);
    if ((ids || []).some((id) => verseIds.has(id) || String(id).startsWith("q:"))) {
      out = out.replace(/«[^»]*(?:»|$)/g, mark).replace(/"[^"]*(?:"|$)/g, mark).replace(/“[^”]*(?:”|$)/g, mark);
    }
    return out;
  };
  let heading = "";
  for (const c of res.claims || []) {
    if (c.text.startsWith("«")) continue;
    if (c.section && c.section !== heading) { heading = c.section; parts.push(heading + "."); }
    parts.push((c.label ? c.label + ": " : "") + safe(c.text, c.passage_ids));
  }
  if (res.follow_up) parts.push(res.follow_up);
  for (const v of res.views || []) parts.push(`${v.school}: ${safe(v.text, v.passage_ids)}`);
  return parts.join("\n");
}

// Browsers load their voices late (Chrome on first use), so wait for them briefly.
function voicesReady() {
  const now = speechSynthesis.getVoices();
  if (now.length) return Promise.resolve(now);
  return new Promise((resolve) => {
    const done = () => resolve(speechSynthesis.getVoices());
    speechSynthesis.addEventListener("voiceschanged", done, { once: true });
    setTimeout(done, 1500);
  });
}

function pickVoice(voices, speakLang) {
  const tag = speakLang === "ar" ? "ar-sa" : "en-us";
  const ofLang = voices.filter((v) => v.lang.toLowerCase().replace("_", "-").startsWith(speakLang));
  return ofLang.find((v) => v.lang.toLowerCase().replace("_", "-") === tag) || ofLang[0] || null;
}

// Short pieces, one after another: Chrome stops long utterances after about 15 seconds.
function pieces(text) {
  return text.split(/(?<=[.!?؟。\n])\s*/).map((x) => x.trim()).filter(Boolean);
}

function listenButton(res, status) {
  const rawText = spokenText(res);
  if (!rawText) return null;
  const withoutVerses = rawText.replace(/﴿[^﴾]*(?:﴾|$)/g, "");
  const speakLang = /[\u0600-\u06FF]/.test(withoutVerses) ? "ar" :
    (withoutVerses.trim() ? "en" : lang);
  const text = rawText.replace(/﴿[^﴾]*(?:﴾|$)/g, speakLang === "ar" ? "(آية)" : "(verse)");
  const group = el("span", "listen-group");
  const row = el("span", "listen-controls");
  const btn = makeActionButton(UI[lang].listen, "listen");
  const label = btn.querySelector(".action-label");
  const icon = btn.querySelector(".action-icon");
  const choice = el("label", "voice-choice");
  const choiceLabel = el("span", "", UI[lang].voiceChoice);
  choiceLabel.dataset.itemKey = "voiceChoice";
  const select = el("select");
  for (const [value, key] of [["female", "femaleVoice"], ["male", "maleVoice"]]) {
    const option = el("option", "", UI[lang][key]);
    option.value = value;
    option.dataset.itemKey = key;
    select.append(option);
  }
  select.value = selectedSpeechVoice;
  choice.append(choiceLabel, select);
  select.addEventListener("change", () => {
    selectedSpeechVoice = select.value;
    try { localStorage.setItem("muhawir-speech-voice", selectedSpeechVoice); }
    catch { /* preference remains available for this page */ }
    document.querySelectorAll(".voice-choice select").forEach((other) => { other.value = selectedSpeechVoice; });
    stopReadAloud();
  });
  const note = el("small", "listen-note", UI[lang].azureNotice);
  note.dataset.itemKey = "azureNotice";
  const reset = () => {
    delete btn.dataset.playing;
    btn.setAttribute("aria-pressed", "false");
    btn.dataset.labelKey = "listen";
    label.textContent = UI[lang].listen;
    btn.setAttribute("aria-label", UI[lang].listen);
    btn.title = UI[lang].listen;
    icon.innerHTML = ACTION_ICONS.listen;
  };
  const setPlaying = () => {
    btn.dataset.playing = "1";
    btn.setAttribute("aria-pressed", "true");
    btn.dataset.labelKey = "stop";
    label.textContent = UI[lang].stop;
    btn.setAttribute("aria-label", UI[lang].stop);
    btn.title = UI[lang].stop;
    icon.innerHTML = ACTION_ICONS.stop;
  };
  const browserFallback = async (playback) => {
    if (playback.fallbackStarted) return;
    playback.fallbackStarted = true;
    if (!("speechSynthesis" in window)) {
      playback.stop();
      status.textContent = UI[speakLang].noVoice;
      delete status.dataset.statusKey;
      return;
    }
    const voice = pickVoice(await voicesReady(), speakLang);
    if (activeReadAloud !== playback) return;
    if (!voice) {
      playback.stop();
      status.textContent = UI[speakLang].noVoice;
      delete status.dataset.statusKey;
      return;
    }
    status.textContent = "";
    delete status.dataset.statusKey;
    setPlaying();
    const parts = pieces(text);
    parts.forEach((part, i) => {
      const u = new SpeechSynthesisUtterance(part);
      u.lang = voice.lang;
      try { u.voice = voice; } catch { /* the language tag alone still picks it */ }
      if (i === parts.length - 1) u.onend = () => playback.stop();
      u.onerror = () => playback.stop();
      speechSynthesis.speak(u);
    });
  };
  btn.play = async () => {
    stopReadAloud();
    const controller = new AbortController();
    const playback = {
      button: btn, audio: null, url: null, ready: false, fallbackStarted: false,
      stop() {
        controller.abort();
        if ("speechSynthesis" in window) speechSynthesis.cancel();
        if (this.audio) { this.audio.pause(); this.audio.removeAttribute("src"); this.audio.load(); }
        if (this.url) URL.revokeObjectURL(this.url);
        if (activeReadAloud === this) activeReadAloud = null;
        if (["voiceLoading", "voiceTap"].includes(status.dataset.statusKey)) {
          status.textContent = "";
          delete status.dataset.statusKey;
        }
        reset();
      }
    };
    activeReadAloud = playback;
    setPlaying();
    setActionStatus(status, "voiceLoading");
    try {
      if (!document.body.classList.contains("natural-voice")) throw new Error("no natural voice on this server");
      const response = await fetch("/tts", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, voice: selectedSpeechVoice, lang: speakLang }),
        signal: controller.signal
      });
      if (!response.ok) throw new Error("Azure speech unavailable");
      const blob = await response.blob();
      if (activeReadAloud !== playback) return;
      playback.url = URL.createObjectURL(blob);
      playback.audio = new Audio(playback.url);
      playback.audio.addEventListener("ended", () => playback.stop(), { once: true });
      playback.audio.addEventListener("error", () => {
        if (activeReadAloud === playback) {
          playback.audio.pause();
          URL.revokeObjectURL(playback.url);
          playback.url = null;
          playback.audio = null;
          browserFallback(playback);
        }
      }, { once: true });
      await playback.audio.play();
      if (activeReadAloud === playback) { status.textContent = ""; delete status.dataset.statusKey; }
    } catch (error) {
      if (activeReadAloud !== playback) return;
      if (error.name === "NotAllowedError" && playback.audio) {
        playback.ready = true;
        reset();
        setActionStatus(status, "voiceTap");
      } else {
        await browserFallback(playback);  // includes 503, timeouts and network failures
      }
    }
  };
  btn.addEventListener("click", () => {
    if (activeReadAloud?.ready && activeReadAloud.button === btn) {
      const playback = activeReadAloud;
      playback.ready = false;
      setPlaying();
      playback.audio.play().then(() => { status.textContent = ""; delete status.dataset.statusKey; })
        .catch(() => browserFallback(playback));
      return;
    }
    if (btn.dataset.playing) { stopReadAloud(); return; }
    btn.play();
  });
  row.append(btn, choice);
  group.append(row, note);
  group.play = btn.play;
  return group;
}

function answerText(res, includeSourcePassages = false) {
  const lines = [];
  if (res.message) lines.push(res.message);
  const sourceNumbers = new Map((res.sources || []).map((source, i) => [source.passage_id, i + 1]));
  for (const claim of res.claims || []) {
    const text = `${claim.label ? `${claim.label}: ` : ""}${claim.text}`;
    const refs = [...new Set(claim.passage_ids || [])].map((id) => sourceNumbers.get(id)).filter(Boolean);
    lines.push(`${claim.section ? `${claim.section}: ` : ""}${text}${refs.length ? ` [${refs.join(", ")}]` : ""}`);
  }
  for (const view of res.views || []) {
    const refs = [...new Set(view.passage_ids || [])].map((id) => sourceNumbers.get(id)).filter(Boolean);
    lines.push(`${view.school}: ${view.text}${refs.length ? ` [${refs.join(", ")}]` : ""}`);
  }
  if (res.note) lines.push(res.note);
  if (res.referral && res.referral.title) {
    lines.push("", res.referral.title, res.referral.intro);
    for (const link of res.referral.links || []) lines.push(`- ${link.label}${link.where ? ` (${link.where})` : ""}: ${link.url}`);
  }
  if (res.follow_up) lines.push(res.follow_up);
  if ((res.sources || []).length) {
    lines.push("", UI[lang].sources + ":");
    for (const [i, source] of res.sources.entries()) {
      lines.push(`[${i + 1}] ${source.source_name || source.location}${source.location ? ` · ${source.location}` : ""}`);
      if (includeSourcePassages && source.quote) lines.push(source.quote);
    }
  }
  return lines.join("\n").trim();
}

async function writeClipboard(text) {
  if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); return; }
  const field = el("textarea");
  field.value = text;
  field.setAttribute("readonly", "");
  field.style.position = "fixed";
  field.style.opacity = "0";
  document.body.append(field);
  field.select();
  const copied = document.execCommand("copy");
  field.remove();
  if (!copied) throw new Error("Clipboard unavailable");
}

function rememberable(res) {
  return !["invalid", "declined", "abstained", "unavailable"].includes(res.status);
}

// The children's style shows a small picture beside each sentence, chosen from its words. Pictures of things only
// (water, a mosque, the Quran, the crescent): never a person, a prophet or anything of the unseen. They add nothing
// to what the sentence says; the information stays in the sourced text. The first match wins: wudu before prayer.
const KIDS_ICONS = [
  [/وضوء|توضأ|يتوضأ|نتوضأ|اغسل|يغسل|نغسل|الغسل|(^|[\s،])(بال|ال|و)?ماء([\s.،]|$)|wudu|wash|water/i, "💧"],
  [/الكعبة|الحج|يحج|مكة|hajj|kaaba|makkah|mecca/i, "🕋"],
  [/صيام|الصوم|يصوم|نصوم|تصوم|رمضان|الإفطار|السحور|fasting|ramadan/i, "🌙"],
  [/زكاة|صدقة|الفقراء|الفقير|المحتاج|يتصدق|نتصدق|charity|zakat|the poor/i, "🤝"],
  [/الدعاء|دعاء|يدعو|ندعو|ادعُ|ادعوا|supplicat|\bdua\b/i, "🤲"],
  [/صلاة|الصلاة|يصلي|نصلي|تصلي|الصلوات|ركعة|السجود|الركوع|المسجد|pray|mosque/i, "🕌"],
  [/القرآن|قرآن|سورة|آية|الآيات|quran|qur'an|verse|surah/i, "📖"],
  [/(^|[\s،])(ال)?علم([\s.،]|$)|يتعلم|نتعلم|تتعلم|learn|knowledge/i, "📚"],
  [/الوالدين|والديك|والديه|أمك|أبيك|parents|your mother|your father/i, "👨‍👩‍👧"],
  [/رحمة|يرحم|الرحمن|الرحيم|محبة|يحب|نحب|mercy|merciful|love/i, "💛"],
];
function kidsIcon(text) {
  const hit = KIDS_ICONS.find(([re]) => re.test(text));
  return hit ? hit[1] : "⭐";
}

// «المقاطع» is the word the model is given for the retrieved texts; the reader knows them as the sources.
// Only Muhawir's own words are changed: a quote («…») and the source cards stay exactly as written.
const PLAIN_WORDS = [[/(^|[^\p{L}])(و?[بلف]?)المقاطع(?![\p{L}])/gu, "$1$2المصادر"], [/(^|[^\p{L}])(و?[بلف]?)المقطع(?![\p{L}])/gu, "$1$2المصدر"],
                     [/(^|[^\p{L}])(و?[بلف]?)مقاطع(?![\p{L}])/gu, "$1$2مصادر"], [/\bthe passages\b/gi, "the sources"], [/\bthe passage\b/gi, "the source"]];
function plainText(text) {
  if (!text) return text;
  return PLAIN_WORDS.reduce((t, [from, to]) => t.replace(from, to), text);
}
function plainWords(res) {
  res.message = plainText(res.message);
  res.follow_up = plainText(res.follow_up);
  for (const c of res.claims || []) {
    if (c.text && !c.text.startsWith("«")) c.text = plainText(c.text);
    if (c.label) c.label = plainText(c.label);
  }
  return res;
}

function renderAnswer(res, style, context) {
  plainWords(res);
  const open = style === "extended";
  const t = UI[lang];
  const msg = el("div", "msg");
  const heading = el("div", "answer-heading");
  const identity = el("div", "answer-brand");
  const mark = el("span", "brand-mark");
  mark.setAttribute("aria-hidden", "true");
  mark.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 14.3 9.7 20.5 12l-6.2 2.3L12 20.5l-2.3-6.2L3.5 12l6.2-2.3L12 3.5Z"/></svg>';
  identity.append(mark, el("span", "", t.assistant));
  heading.append(identity);
  const outcome = sourceSearchOutcome(res);
  if (outcome !== "settled") {
    const searchOutcome = el("p", "search-outcome", t[outcome]);
    searchOutcome.dataset.t = outcome;
    msg.append(searchOutcome);
  }
  const statusText = t.status[res.status];
  if (statusText) heading.append(el("span", "status", statusText));
  msg.append(heading);
  // A referral answers first: the referral line and who to ask; what the sources say in general follows, folded,
  // under a question the user opens (already in the reply: no new request).
  const referredInfo = res.status === "referred" && (res.claims || []).length > 0;
  const [firstLine, ...restLines] = (res.message || "").split("\n");
  if (firstLine) { const m = el("div", "", referredInfo ? firstLine : res.message); m.dir = "auto"; msg.append(m); }
  const generalFrom = msg.childNodes.length;
  if (referredInfo && restLines.join(" ").trim()) { const m = el("p", "", restLines.join(" ")); m.dir = "auto"; msg.append(m); }
  // Sources are numbered; each sentence of the answer carries the numbers of the sources it rests on.
  const number = new Map((res.sources || []).map((s, i) => [s.passage_id, i + 1]));
  const cardFor = new Map();
  const sourceCards = [];
  const quoted = new Set((res.sources || []).map((s) => `«${s.quote}»`));
  // A claim that only repeats a passage word for word is already shown in its source card.
  const shown = new Set();  // passages whose text is itself the answer stay open
  const cite = (c) => {  // the numbers of the sources a sentence rests on, each opening its card
    const sup = el("span", "cite");
    for (const id of new Set(c.passage_ids)) {
      const n = number.get(id);
      if (!n) continue;
      const a = el("a", "", `[${n}]`);
      a.href = "#"; a.title = t.source;
      a.addEventListener("click", (e) => {
        e.preventDefault();
        const card = cardFor.get(id);
        if (card) { card.open = true; card.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
      });
      sup.append(a);
    }
    return sup;
  };
  const sentences = (res.claims || []).filter((c) => {
    if (!quoted.has(c.text)) return true;
    c.passage_ids.forEach((id) => shown.add(id));
    return false;
  });
  // one sentence: an optional bold label («المقدار:»), the text, then its source numbers
  const fill = (node, c) => {
    if (c.label) node.append(el("strong", "", c.label + ": "));
    // an everyday example is Muhawir's own illustration, not the source's words: it says so
    if (c.example) node.append(el("span", "example-tag", t.exampleTag), " ");
    node.append(c.text);
    const sup = cite(c);
    if (sup.childNodes.length) node.append(sup);
  };
  const paragraph = () => { const p = el("p", "answer"); p.dir = "auto"; return p; };
  const list = () => { const u = el("ul", "answer-list"); u.dir = "auto"; return u; };
  if (sentences.some((c) => c.section)) {
    // a short definition, then each part under its own heading, as a list
    let block = null, current = null, outro = null;
    const intro = paragraph();
    for (const c of sentences) {
      if (!c.section) {  // before the first heading: the definition; after the parts: a closing line
        const p = block ? (outro || (outro = paragraph())) : intro;
        if (p.childNodes.length) p.append(" ");
        fill(p, c);
        continue;
      }
      if (c.section !== current) {
        if (intro.childNodes.length && !intro.parentNode) msg.append(intro);
        current = c.section;
        const h = el("h4", "answer-section", current); h.dir = "auto";
        block = list();
        msg.append(h, block);
      }
      const li = el("li"); fill(li, c); block.append(li);
    }
    if (intro.childNodes.length && !intro.parentNode) msg.append(intro);
    if (outro) msg.append(outro);
  } else if (style === "kids" && sentences.length > 1) {
    // for children: one short sentence per line, each with a small picture for its subject (no new information)
    const items = el("ul", "kids-list"); items.dir = "auto";
    for (const c of sentences) {
      const li = el("li");
      const icon = el("span", "kids-icon", kidsIcon(c.text));
      icon.setAttribute("aria-hidden", "true");
      const body = el("span"); fill(body, c);
      li.append(icon, body); items.append(li);
    }
    msg.append(items);
  } else {
    const answer = paragraph();
    // types, kinds, conditions or steps: a short lead sentence, then one item per line
    const items = res.as_list && sentences.length > 1 ? list() : null;
    // the first sentence leads the list only when it introduces it (ends with a colon)
    const lead = items && /[:：]\s*$/.test(sentences[0].text);
    sentences.forEach((c, i) => {
      if (items && (i > 0 || !lead)) { const li = el("li"); fill(li, c); items.append(li); return; }
      if (answer.childNodes.length) answer.append(" ");
      fill(answer, c);
    });
    if (answer.childNodes.length) msg.append(answer);
    if (items) msg.append(items);
  }
  if (res.note) msg.append(el("p", "note", res.note));
  if ((res.views || []).length) {
    // the usual order: Hanafi, Maliki, Shafi'i, Hanbali, then others
    const ORDER = [/حنيف|حنف|احناف|أحناف/, /مالك/, /شافع/, /أحمد|احمد|حنبل/];
    const rank = (name) => { const i = ORDER.findIndex((re) => re.test(name)); return i < 0 ? ORDER.length : i; };
    const panel = el("details", "views");
    panel.open = true;  // the scholars' views are the answer to a ruling question: shown, not hidden
    panel.append(el("summary", "", t.views));
    for (const v of [...res.views].sort((a, b) => rank(a.school) - rank(b.school))) {
      const row = el("p", "view");
      row.dir = "auto";
      row.append(el("strong", "", v.school + ": "), document.createTextNode(v.text));
      const sup = cite(v);
      if (sup.childNodes.length) row.append(sup);
      panel.append(row);
    }
    msg.append(panel);
  }
  let general = null;
  if (referredInfo) {
    general = el("details", "general-info");
    const summary = el("summary", "", t.generalInfo); summary.dir = "auto";
    general.append(summary);
    while (msg.childNodes.length > generalFrom) general.append(msg.childNodes[generalFrom]);
  }
  let next = null;
  if (res.follow_up) {  // Muhawir's suggestion to continue the dialogue: a tap asks it
    next = el("button", "follow-up", res.follow_up);
    next.type = "button"; next.dir = "auto";
    next.addEventListener("click", () => { setQuestionText(res.follow_up); $("ask").requestSubmit(); });
    if (!general) msg.append(next);
  }
  if (res.referral && res.referral.title) {  // who to ask when Muhawir refers on: official bodies, opened in a new tab
    const box = el("section", "referral");
    box.dir = "auto";
    box.append(el("h3", "", res.referral.title), el("p", "", res.referral.intro));
    if ((res.referral.links || []).length) {
      const list = el("ul");
      for (const link of res.referral.links) {
        const item = el("li");
        const a = el("a", "", link.label);
        a.href = link.url; a.target = "_blank"; a.rel = "noopener noreferrer";
        item.append(a);
        if (link.where) item.append(el("span", "where", ` · ${link.where}`));
        list.append(item);
      }
      box.append(list);
    }
    msg.append(box);
  }
  if (general) msg.append(general);
  const sourcesHome = general || msg;  // a folded answer keeps its sources with it
  if ((res.sources || []).length) sourcesHome.append(el("div", "sources-title", t.sources));
  for (const s of res.sources || []) {
    const card = el("details", "card");
    card.open = open || shown.has(s.passage_id);
    cardFor.set(s.passage_id, card);
    // a hadith shows its grading in the folded line, so it is never seen without it
    const summary = el("summary");
    const label = s.kind !== "hadith" ? `${s.source_name} · ${s.location}`
      : s.grade ? `${t.hadith} (${t.grade}: ${s.grade}) · ${s.source_name}`
      : s.location;  // e.g. «صحيح البخاري، رقم 1»
    summary.append(el("span", "num", `[${number.get(s.passage_id)}]`), label);
    card.append(summary);
    card.append(el("div", "about", s.source_about));
    card.append(el("blockquote", "", s.quote));
    const ayah = s.kind === "quran" && /^q:(\d{1,3}):(\d{1,3})$/.exec(s.passage_id || "");
    if (ayah) card.append(recitationButton(+ayah[1], +ayah[2]));
    if (s.translation) {  // the approved English translation of the verse's meaning (King Fahd Complex)
      const tr = el("blockquote", "translation", s.translation);
      tr.dir = "ltr"; tr.lang = "en";
      card.append(tr);
      if (s.translation_name) card.append(el("div", "meta", s.translation_name));
    }
    if (s.topics) card.append(el("div", "meta", `${t.topics}: ${s.topics}`));
    const meta = el("div", "meta", `${t.location}: ${s.location}` + (s.grade ? ` · ${t.grade}: ${s.grade}` : ""));
    if (s.source_url) {
      const a = el("a", "", t.open);
      a.href = s.source_url; a.target = "_blank"; a.rel = "noopener";
      meta.append(" · ", a);
    }
    if (s.kind === "hadith") {  // check this hadith on dorar.net, as dorar's own search box for site owners does
      const a = el("a", "", t.verify);
      a.href = "https://dorar.net/hadith/search?q=" + encodeURIComponent(searchPhrase(s.quote));
      a.target = "_blank"; a.rel = "noopener";
      meta.append(" · ", a);
    }
    card.append(meta);
    sourcesHome.append(card);
    sourceCards.push(card);
  }
  if (general && next) msg.append(next);
  const actions = el("div", "tools");
  actions.setAttribute("role", "group");
  actions.setAttribute("aria-label", t.responseActions);
  const status = el("span", "action-status");
  status.setAttribute("role", "status");
  status.setAttribute("aria-live", "polite");

  const copy = makeActionButton(t.copyAnswer, "copy", "", "copyAnswer");
  copy.addEventListener("click", async () => {
    try { await writeClipboard(answerText(res)); setActionStatus(status, "copied"); }
    catch { setActionStatus(status, "copyFailed"); }
  });
  actions.append(copy);

  const share = makeActionButton(t.shareAnswer, "share", "", "shareAnswer");
  share.addEventListener("click", async () => {
    const text = answerText(res);
    try {
      if (navigator.share) await navigator.share({ title: t.assistant, text });
      else { await writeClipboard(text); setActionStatus(status, "shareFallback"); }
    } catch (error) {
      if (error?.name !== "AbortError") setActionStatus(status, "shareFailed");
    }
  });
  actions.append(share);

  const listen = listenButton(res, status);
  if (listen) { actions.append(listen); msg.listen = listen; }

  const regenerate = makeActionButton(t.regenerate, "regenerate", "", "regenerate");
  regenerate.disabled = !context;
  regenerate.addEventListener("click", () => regenerateAnswer(msg));
  actions.append(regenerate);

  if (res.status === "answered") {  // a rating only counts on the server: no model is asked anything
    const rate = (verdict) => {
      clearButton.disabled = unclearButton.disabled = true;
      (verdict === "clear" ? clearButton : unclearButton).setAttribute("aria-pressed", "true");
      setActionStatus(status, verdict === "clear" ? "thanks" : "thanksUnclear");
      fetch("/api/feedback", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ verdict }) }).catch(() => {});
    };
    const clearButton = makeActionButton(t.clear, "clear", "", "clear");
    const unclearButton = makeActionButton(t.unclear, "unclear", "", "unclear");
    clearButton.addEventListener("click", () => rate("clear"));
    unclearButton.addEventListener("click", () => rate("unclear"));
    actions.append(clearButton, unclearButton);
  }

  const more = el("details", "more-actions");
  const moreSummary = el("summary", "action-btn");
  moreSummary.dataset.labelKey = "more";
  moreSummary.setAttribute("aria-expanded", "false");
  moreSummary.setAttribute("aria-label", t.more);
  moreSummary.title = t.more;
  moreSummary.append(actionIcon("more"), el("span", "action-label", t.more));
  more.append(moreSummary);
  const menu = el("div", "more-menu");
  const copySources = el("button", "more-item", t.copyWithSources);
  copySources.type = "button";
  copySources.dataset.itemKey = "copyWithSources";
  copySources.addEventListener("click", async () => {
    try { await writeClipboard(answerText(res, true)); setActionStatus(status, "copied"); }
    catch { setActionStatus(status, "copyFailed"); }
    more.open = false;
  });
  const simplify = el("button", "more-item", t.simplifyAnswer);
  simplify.type = "button";
  simplify.dataset.itemKey = "simplifyAnswer";
  simplify.addEventListener("click", () => {
    more.open = false;
    setQuestionText(UI[lang].simplifyPrompt);
    $("q").focus();
    $("ask").requestSubmit();
  });
  menu.append(copySources, simplify);
  more.append(menu);
  more.addEventListener("toggle", () => moreSummary.setAttribute("aria-expanded", String(more.open)));
  actions.append(more);

  if (sourceCards.length) {
    const sourcesButton = makeActionButton(sourceCards.every((card) => card.open) ? t.hideSources : t.showSources, "sources", "", "sources");
    const label = sourcesButton.querySelector(".action-label");
    const setSourceLabel = (expanded) => {
      const current = UI[lang];
      const text = expanded ? current.hideSources : current.showSources;
      label.textContent = text;
      sourcesButton.setAttribute("aria-label", text);
      sourcesButton.title = text;
      sourcesButton.setAttribute("aria-expanded", String(expanded));
    };
    setSourceLabel(sourceCards.every((card) => card.open));
    sourcesButton.addEventListener("click", () => {
      const expanded = !sourceCards.every((card) => card.open);
      sourceCards.forEach((card) => { card.open = expanded; });
      if (expanded && general) general.open = true;
      setSourceLabel(expanded);
    });
    actions.append(sourcesButton);
  }

  actions.append(status);
  msg.append(actions);
  msg.actionStatus = status;
  msg.regenerateButton = regenerate;
  msg.responseActions = actions;
  msg.responseData = res;
  msg.requestContext = context;
  return msg;
}

function syncRegenerateButtons(conversation) {
  const targets = conversation ? [conversation] : conversations;
  for (const item of targets) {
    const latest = item.messages.at(-1);
    for (const message of item.messages) {
      if (message?.regenerateButton) message.regenerateButton.disabled = message !== latest || $("send").disabled;
    }
  }
}

function beginAnswerRequest(details) {
  const request = { ...details, controller: new AbortController(), cancelled: false };
  activeRequest = request;
  $("send").disabled = true;
  $("send").hidden = true;
  $("stopRequest").hidden = false;
  $("requestNotice").hidden = true;
  // Blur after the DOM/button updates too: Android can otherwise keep the IME's
  // focused-input pan even though the conversation has already been appended.
  if (document.activeElement === $("q")) $("q").blur();
  if (isMobileLayout() && (!window.visualViewport || Math.abs(window.visualViewport.scale - 1) <= .01)) {
    window.scrollTo({ top:0, left:0, behavior:"instant" });
  }
  syncRegenerateButtons();
  return request;
}

function finishAnswerRequest(request) {
  if (activeRequest !== request) return;
  activeRequest = null;
  $("send").disabled = false;
  $("send").hidden = false;
  $("stopRequest").hidden = true;
  syncRegenerateButtons();
  request.conversation.updatedAt = Date.now();
  renderHistory();
  if (activeConversation === request.conversation) {
    scrollDown();
    if (request.kind === "question" && window.matchMedia("(min-width: 861px)").matches) $("q").focus();
  }
}

function stopAnswerRequest() {
  const request = activeRequest;
  if (!request) return;
  request.cancelled = true;
  activeRequest = null;
  request.controller.abort();
  const conversation = request.conversation;
  conversation.messages = conversation.messages.filter((entry) => entry !== request.pending && entry !== request.userMessage);
  request.pending.remove();
  if (request.userMessage) request.userMessage.remove();
  if (request.kind === "regenerate") setActionStatus(request.message.actionStatus, "requestStopped");
  if (!conversation.messages.length) conversation.title = UI[lang].newChat;
  conversation.updatedAt = Date.now();
  $("send").disabled = false;
  $("send").hidden = false;
  $("stopRequest").hidden = true;
  syncRegenerateButtons();
  if (activeConversation === conversation) {
    if (request.kind === "question" && !$("q").value.trim()) setQuestionText(request.question);
    if (!conversation.messages.length) renderConversation(conversation);
    else { updateConversationTitle(); renderHistory(); }
    $("q").focus();
  } else renderHistory();
  $("requestNotice").textContent = UI[lang].requestStopped;
  $("requestNotice").hidden = false;
}

async function regenerateAnswer(message) {
  const context = message.requestContext;
  const conversation = context?.conversation;
  if (!context || !conversation || conversation.messages.at(-1) !== message || $("send").disabled) return;
  const messageIndex = conversation.messages.indexOf(message);
  if (messageIndex < 0) return;
  message.regenerateButton.disabled = true;
  setActionStatus(message.actionStatus, "regenerating");
  const pending = createRiderStatus(context.lang || lang);
  conversation.messages.push(pending);
  if (activeConversation === conversation) { $("thread").append(pending); scrollDown(); }
  const request = beginAnswerRequest({ kind: "regenerate", conversation, pending, message });
  try {
    const response = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: context.question, style: context.style, lang: context.lang, history: context.history }), signal: request.controller.signal });
    if (!response.ok) throw new Error(response.status);
    const res = await response.json();
    if (request.cancelled) return;
    await completeRiderStatus(pending, res, context.lang || lang);
    if (request.cancelled) return;
    const replacement = renderAnswer(res, context.style, context);
    conversation.messages[messageIndex] = replacement;
    conversation.messages = conversation.messages.filter((entry) => entry !== pending);
    if (activeConversation === conversation) {
      message.replaceWith(replacement);
      pending.remove();
    }
    conversation.turns = context.history.slice();
    if (rememberable(res)) {
      remember(conversation, "user", res.understood || context.question);
      remember(conversation, "assistant", [res.message, ...(res.claims || []).map((claim) => claim.text)].filter(Boolean).join(" "));
    }
    conversation.updatedAt = Date.now();
    if (activeConversation === conversation) scrollDown();
  } catch {
    if (request.cancelled) return;
    conversation.messages = conversation.messages.filter((entry) => entry !== pending);
    if (activeConversation === conversation) pending.remove();
    setActionStatus(message.actionStatus, "error");
  } finally {
    finishAnswerRequest(request);
  }
}

// A short distinctive phrase of a hadith for dorar's search: the Prophet's words when quoted, else the last words.
function searchPhrase(text) {
  const plain = text.replace(/[\u064B-\u0652\u0670\u0640]/g, "");
  const quoted = plain.match(/"([^"]{15,})"/) || plain.match(/«([^»]{15,})»/);
  const words = (quoted ? quoted[1] : plain).replace(/[^\p{L}\s]/gu, " ").split(/\s+/).filter(Boolean);
  return (quoted ? words.slice(0, 7) : words.slice(-7)).join(" ");
}

function remember(conversation, role, text) {
  if (!text) return;
  conversation.turns.push({ role, text: text.slice(0, 600) });
  while (conversation.turns.length > MAX_HISTORY) conversation.turns.shift();
}

function fitQuestionBox() {
  const field = $("q");
  const style = getComputedStyle(field);
  const minimum = parseFloat(style.minHeight) || 44;
  const borders = (parseFloat(style.borderTopWidth) || 0) + (parseFloat(style.borderBottomWidth) || 0);
  const viewport = window.visualViewport;
  const screenHeight = viewport && Math.abs(viewport.scale - 1) <= .01 ? viewport.height : window.innerHeight;
  const maximum = Math.max(minimum, Math.min(180, screenHeight * .3));
  field.style.maxHeight = `${maximum}px`;
  field.style.height = "auto";
  const required = Math.max(minimum, field.scrollHeight + borders);
  field.style.height = `${Math.min(required, maximum)}px`;
  field.style.overflowY = required > maximum ? "auto" : "hidden";
}
function setQuestionText(text) {
  $("q").value = text;
  fitQuestionBox();
}
$("q").addEventListener("input", fitQuestionBox);
document.fonts?.ready.then(fitQuestionBox);

// A mobile keyboard can resize only the visual viewport, leaving 100dvh unchanged.
// Scroll instantly after layout as well, so the pending row is not below the keyboard.
function scrollDown() {
  const thread = $("thread");
  const pinToBottom = () => { thread.scrollTo({ top: thread.scrollHeight, behavior: "instant" }); };
  pinToBottom();
  requestAnimationFrame(pinToBottom);
}

let chatViewportFrame = null;
function syncChatViewport() {
  if (chatViewportFrame !== null) cancelAnimationFrame(chatViewportFrame);
  chatViewportFrame = requestAnimationFrame(() => {
    chatViewportFrame = null;
    const viewport = window.visualViewport;
    // Pinch zoom should magnify the existing layout, not make the app shrink again.
    if (viewport && Math.abs(viewport.scale - 1) > .01) return;
    const thread = $("thread");
    const followingBottom = thread.scrollHeight - thread.scrollTop - thread.clientHeight <= 64;
    if (isMobileLayout()) {
      const height = viewport ? viewport.height : window.innerHeight;
      if (height > 0) document.documentElement.style.setProperty("--chat-viewport-height", `${height}px`);
    } else {
      document.documentElement.style.removeProperty("--chat-viewport-height");
    }
    fitQuestionBox();
    const visibleRequest = activeRequest && activeRequest.conversation === activeConversation;
    if (followingBottom || visibleRequest) scrollDown();
  });
}
window.visualViewport?.addEventListener("resize", syncChatViewport, { passive: true });
window.addEventListener("resize", syncChatViewport, { passive: true });
syncChatViewport();

$("lang").addEventListener("change", (e) => { lang = e.target.value; applyLang(); });
$("themeToggle").addEventListener("click", toggleTheme);
$("stopRequest").addEventListener("click", stopAnswerRequest);
$("newChat").addEventListener("click", startNewConversation);
$("openHistory").addEventListener("click", toggleHistory);
$("closeHistory").addEventListener("click", closeHistory);
$("sidebarScrim").addEventListener("click", closeHistory);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("appShell").classList.contains("drawer-open")) closeHistory();
});
$("historySearch").addEventListener("input", renderHistory);
window.addEventListener("resize", () => {
  if (!isMobileLayout()) $("appShell").classList.remove("drawer-open");
  updateHistoryToggle();
}, { passive: true });
$("thread").addEventListener("click", (e) => {
  const suggestion = e.target.closest(".suggestion");
  if (!suggestion) return;
  setQuestionText(suggestion.querySelector(".suggestion-text").textContent);
  $("q").focus();
});

$("ask").addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = $("q").value.trim();
  if (!question || $("send").disabled) return;  // one question at a time: Enter must not send a second
  // Dismiss the mobile keyboard before painting the source-search indicator.
  if (isMobileLayout()) $("q").blur();
  const askedBySpeech = spokenTurn;
  spokenTurn = false;
  stopListening();
  const conversation = activeConversation;
  const style = $("style").value;
  const requestLang = lang;
  const requestHistory = conversation.turns.slice();
  const context = { conversation, question, style, lang: requestLang, history: requestHistory };
  $("empty")?.remove();
  const userMessage = el("div", "turn-user", question);
  userMessage.dir = "auto";
  conversation.messages.push(userMessage);
  conversation.updatedAt = Date.now();
  if (conversation.messages.length === 1) {
    const title = question.replace(/\s+/g, " ").trim();
    conversation.title = title.length > 42 ? `${title.slice(0, 41).trimEnd()}…` : title;
    updateConversationTitle();
    renderHistory();
  }
  $("thread").append(userMessage);
  const pending = createRiderStatus(requestLang);
  conversation.messages.push(pending);
  syncRegenerateButtons();
  conversation.updatedAt = Date.now();
  $("thread").append(pending);
  const request = beginAnswerRequest({ kind: "question", conversation, pending, userMessage, question });
  setQuestionText("");
  scrollDown();
  try {
    const r = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, style, lang: requestLang, history: requestHistory }), signal: request.controller.signal });
    if (!r.ok) throw new Error(r.status);
    const res = await r.json();
    if (request.cancelled) return;
    await completeRiderStatus(pending, res, requestLang);
    if (request.cancelled) return;
    const msg = renderAnswer(res, style, context);
    const pendingIndex = conversation.messages.indexOf(pending);
    if (pendingIndex >= 0) conversation.messages[pendingIndex] = msg;
    pending.replaceWith(msg);
    if (askedBySpeech && msg.listen) msg.listen.play();  // spoken question: spoken reply
    // answers and Muhawir's offers (e.g. "shall I explain it more simply?") are remembered, so a follow-up
    // or a "yes" is understood; refusals, errors and "not found" are not answers to explain again
    if (rememberable(res)) {
      remember(conversation, "user", res.understood || question);
      remember(conversation, "assistant", [res.message, ...(res.claims || []).map((c) => c.text)].filter(Boolean).join(" "));
    }
    syncRegenerateButtons();
  } catch {
    if (request.cancelled) return;
    const errorMessage = el("div", "msg", UI[lang].error);
    const pendingIndex = conversation.messages.indexOf(pending);
    if (pendingIndex >= 0) conversation.messages[pendingIndex] = errorMessage;
    pending.replaceWith(errorMessage);
    syncRegenerateButtons();
    if (activeConversation === conversation && !$("q").value.trim()) setQuestionText(question);
  } finally {
    finishAnswerRequest(request);
  }
});

$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("ask").requestSubmit(); }
});

// Voice input: the browser's own speech recognition (Chrome, Edge, Safari). Hidden where unavailable.
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
function stopListening() { if (recognizer && recognizing) recognizer.stop(); }
if (Recognition) {
  $("mic").hidden = false;
  $("mic").addEventListener("click", () => {
    if (recognizing) { stopListening(); return; }
    $("voiceNote").hidden = false;
    recognizer = new Recognition();
    recognizer.lang = lang === "ar" ? "ar-SA" : "en-US";
    recognizer.interimResults = true;
    recognizer.continuous = false;
    stopReadAloud();  // stop reading the last reply while the user speaks
    const before = $("q").value.trim();
    let heard = false;
    recognizer.onresult = (ev) => {
      const said = Array.from(ev.results).map((r) => r[0].transcript).join(" ");
      setQuestionText((before ? before + " " : "") + said);
      heard = Boolean(said.trim());
    };
    let failed = false;
    recognizer.onerror = () => { failed = true; };
    recognizer.onend = () => {
      recognizing = false;
      $("mic").setAttribute("aria-pressed", "false");
      $("mic").lastElementChild.textContent = UI[lang].mic;
      // the user talked: send what was heard and answer by voice, like a conversation
      if (heard && !failed && $("q").value.trim()) { spokenTurn = true; $("ask").requestSubmit(); }
    };
    recognizing = true;
    $("mic").setAttribute("aria-pressed", "true");
    $("mic").lastElementChild.textContent = UI[lang].micStop;
    recognizer.start();
  });
}

fetch("/api/health").then((r) => r.json()).then((h) => {
  $("synthetic").hidden = !h.synthetic;
  // the natural voice (and its notice that the text goes to Microsoft) only when the server has it configured
  document.body.classList.toggle("natural-voice", Boolean(h.tts));
}).catch(() => {});
renderHistory();
applyLang();
fitQuestionBox();
</script>
</body>
</html>
