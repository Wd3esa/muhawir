// 7. The answer as plain text for copying and sharing.
function answerText(res, includeSourcePassages = false) {
  const lines = [];
  if (res.message) lines.push(res.message);
  const sourceNumbers = new Map((res.sources || []).map((source, i) => [source.passage_id, i + 1]));
  for (const claim of res.claims || []) {
    const text = `${claim.label ? `${claim.label}: ` : ""}${claim.text}`;
    const refs = [...new Set(claim.passage_ids || [])].map((id) => sourceNumbers.get(id)).filter(Boolean);
    lines.push(`${claim.section ? `${claim.section}: ` : ""}${text}${refs.length ? ` [${refs.join(", ")}]` : ""}`);
  }
  for (const view of res.views || []) {
    const refs = [...new Set(view.passage_ids || [])].map((id) => sourceNumbers.get(id)).filter(Boolean);
    lines.push(`${view.school}: ${view.text}${refs.length ? ` [${refs.join(", ")}]` : ""}`);
  }
  if (res.note) lines.push(res.note);
  if (res.referral && res.referral.title) {
    lines.push("", res.referral.title, res.referral.intro);
    for (const link of res.referral.links || []) lines.push(`- ${link.label}${link.where ? ` (${link.where})` : ""}: ${link.url}`);
  }
  if (res.follow_up) lines.push(res.follow_up);
  if ((res.sources || []).length) {
    lines.push("", UI[lang].sources + ":");
    for (const [i, source] of res.sources.entries()) {
      lines.push(`[${i + 1}] ${source.source_name || source.location}${source.location ? ` · ${source.location}` : ""}`);
      if (includeSourcePassages && source.quote) lines.push(source.quote);
    }
  }
  return lines.join("\n").trim();
}

async function writeClipboard(text) {
  if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); return; }
  const field = el("textarea");
  field.value = text;
  field.setAttribute("readonly", "");
  field.style.position = "fixed";
  field.style.opacity = "0";
  document.body.append(field);
  field.select();
  const copied = document.execCommand("copy");
  field.remove();
  if (!copied) throw new Error("Clipboard unavailable");
}

function rememberable(res) {
  return !["invalid", "declined", "abstained", "unavailable"].includes(res.status);
}

// Rendering an answer: helpers first, then renderAnswer, which builds the whole answer (text, sections, views,
// source cards, buttons) from the server's reply.
// The children's style shows a small picture beside each sentence, chosen from its words. Pictures of things only
// (water, a mosque, the Quran, the crescent): never a person, a prophet or anything of the unseen. They add nothing
// to what the sentence says; the information stays in the sourced text. The first match wins: wudu before prayer.
const KIDS_ICONS = [
  [/وضوء|توضأ|يتوضأ|نتوضأ|اغسل|يغسل|نغسل|الغسل|(^|[\s،])(بال|ال|و)?ماء([\s.،]|$)|wudu|wash|water/i, "💧"],
  [/الكعبة|الحج|يحج|مكة|hajj|kaaba|makkah|mecca/i, "🕋"],
  [/صيام|الصوم|يصوم|نصوم|تصوم|رمضان|الإفطار|السحور|fasting|ramadan/i, "🌙"],
  [/زكاة|صدقة|الفقراء|الفقير|المحتاج|يتصدق|نتصدق|charity|zakat|the poor/i, "🤝"],
  [/الدعاء|دعاء|يدعو|ندعو|ادعُ|ادعوا|supplicat|\bdua\b/i, "🤲"],
  [/صلاة|الصلاة|يصلي|نصلي|تصلي|الصلوات|ركعة|السجود|الركوع|المسجد|pray|mosque/i, "🕌"],
  [/القرآن|قرآن|سورة|آية|الآيات|quran|qur'an|verse|surah/i, "📖"],
  [/(^|[\s،])(ال)?علم([\s.،]|$)|يتعلم|نتعلم|تتعلم|learn|knowledge/i, "📚"],
  [/الوالدين|والديك|والديه|أمك|أبيك|parents|your mother|your father/i, "👨‍👩‍👧"],
  [/رحمة|يرحم|الرحمن|الرحيم|محبة|يحب|نحب|mercy|merciful|love/i, "💛"],
];
function kidsIcon(text) {
  const hit = KIDS_ICONS.find(([re]) => re.test(text));
  return hit ? hit[1] : "⭐";
}

// «المقاطع» is the word the model is given for the retrieved texts; the reader knows them as the sources.
// Only Muhawir's own words are changed: a quote («…») and the source cards stay exactly as written.
const PLAIN_WORDS = [[/(^|[^\p{L}])(و?[بلف]?)المقاطع(?![\p{L}])/gu, "$1$2المصادر"], [/(^|[^\p{L}])(و?[بلف]?)المقطع(?![\p{L}])/gu, "$1$2المصدر"],
                     [/(^|[^\p{L}])(و?[بلف]?)مقاطع(?![\p{L}])/gu, "$1$2مصادر"], [/\bthe passages\b/gi, "the sources"], [/\bthe passage\b/gi, "the source"]];
function plainText(text) {
  if (!text) return text;
  return PLAIN_WORDS.reduce((t, [from, to]) => t.replace(from, to), text);
}
function plainWords(res) {
  res.message = plainText(res.message);
  res.follow_up = plainText(res.follow_up);
  for (const c of res.claims || []) {
    if (c.text && !c.text.startsWith("«")) c.text = plainText(c.text);
    if (c.label) c.label = plainText(c.label);
  }
  return res;
}

function answerBadgeState(response) {
  // Referrals stay red even when general supporting passages accompany them.
  if (response.status === "referred") return { key:"referred", tone:"referred" };
  if (response.status === "answered") {
    const supported = Array.isArray(response.sources) && response.sources.length > 0;
    return { key:supported ? "answered" : "abstained", tone:supported ? "found" : "missing" };
  }
  return { key:response.status, tone:"missing" };
}

// How the understood question differs from what was typed. «same»: only spaces, punctuation, hamza or
// diacritics («ماهي الزكاة» / «ما هي الزكاة؟»): nothing is shown. «added»: every typed word is still there and
// words were added («الزكاة» / «ما هي الزكاة؟»): a quiet line. «changed»: a typed word was replaced («ضيام» /
// «صيام»): a first question asks «هل تقصد…؟ نعم / لا».
function plainLetters(text) {
  return (text || "").replace(/[\u064B-\u065F\u0670\u0640]/g, "").replace(/[أإآٱ]/g, "ا").replace(/ة/g, "ه")
    .replace(/ى/g, "ي").replace(/ؤ/g, "و").replace(/ئ/g, "ي").toLowerCase();
}
// The number of single-letter edits between two words (a typo is one or two of them).
function editDistance(a, b) {
  let row = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const next = [i];
    for (let j = 1; j <= b.length; j++) {
      next[j] = Math.min(row[j] + 1, next[j - 1] + 1, row[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    row = next;
  }
  return row[b.length];
}

// How the understood question differs from the typed one:
//   "same"    no difference in the words;
//   "added"   the typed words are all there (a follow-up made whole), or the question was only put in other words
//             («جواهر سورة الكهف: اذكر الكلمات النادرة» → «ما الكلمات النادرة في سورة الكهف؟»): said, never asked about;
//   "changed" a typed word was mistyped and corrected («ضيام» → «صيام»): the only case that asks «هل تقصد؟».
function rewordKind(typed, understood) {
  if (!understood) return "same";
  const words = (t) => plainLetters(t).split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const typedWords = words(typed);
  const understoodWords = words(understood);
  const joined = understoodWords.join("");
  if (typedWords.join("") === joined) return "same";
  const missing = typedWords.filter((w) => !joined.includes(w));
  if (!missing.length) return "added";
  const mistyped = missing.some((w) => w.length >= 3
    && understoodWords.some((u) => u.length >= 3 && !typedWords.includes(u) && editDistance(w, u) <= Math.max(1, Math.floor(w.length / 4))));
  return mistyped ? "changed" : "added";
}

// Reply-language: the words around a reply (its status line, its buttons) are in the language the reply is written in,
// as its letters tell, whatever the page language: an English question on the Arabic page gets English all through
function replyLangOf(res) {
  const text = [res.message, ...(res.claims || []).map((c) => c.text), res.follow_up].filter(Boolean).join(" ");
  if (/[\u0679\u0688\u0691\u06BA\u06BE\u06C1\u06D2\u06D3]/.test(text)) return "ur";
  if (/[\u0600-\u06FF]/.test(text)) return "ar";
  return /[A-Za-z]{2,}/.test(text) ? "en" : lang;
}

function renderAnswer(res, style, context) {
  if (res.status === "quote") return renderQuote(res, context);
  plainWords(res);
  const vowelTargets = [];
  const open = style === "extended";
  const replyLang = replyLangOf(res);
  const t = UI[replyLang] || UI[lang];
  const msg = el("div", "msg");
  msg.lang = replyLang;
  if (replyLang !== lang) msg.dir = replyLang === "en" ? "ltr" : "rtl";
  if (res.status === "answered") {
    msg.dataset.sourcedAnswer = "true";
    applyAnswerLayout(msg);
  }
  const heading = el("div", "answer-heading");
  const identity = el("div", "answer-brand");
  const mark = el("span", "brand-mark");
  mark.setAttribute("aria-hidden", "true");
  mark.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 14.3 9.7 20.5 12l-6.2 2.3L12 20.5l-2.3-6.2L3.5 12l6.2-2.3L12 3.5Z"/></svg>';
  identity.append(mark, el("span", "", t.assistant));
  heading.append(identity);
  const outcome = sourceSearchOutcome(res);
  if (outcome !== "settled") {
    const searchOutcome = el("p", "search-outcome", t[outcome]);
    searchOutcome.dataset.t = outcome;
    msg.append(searchOutcome);
  }
  const badgeState = answerBadgeState(res);
  const statusText = t.status[badgeState.key];
  if (statusText) {
    const badge = el("span", "status", statusText);
    badge.dataset.tone = badgeState.tone;
    badge.dataset.statusKey = badgeState.key;
    heading.append(badge);
  }
  if (res.status !== "answered") msg.append(heading);
  // the question as Muhawir understood it, when it differs from what was typed (a typo such as «ضيام», or a
  // follow-up such as «ولماذا؟» made whole): the reader sees what was answered, with no new request
  // A first question that was reworded (a typo such as «ضيام») asks «هل تقصد…؟ نعم / لا» before the answer is
  // shown; a follow-up («ولماذا؟») only says what was understood. The answer is already here: no new request.
  let understoodLine = null;
  const change = rewordKind(context?.question || "", res.understood || "");
  const confirmFirst = res.unsure && change === "changed" && !(context?.history || []).length && !context?.restored
    && ["answered", "referred", "abstained"].includes(res.status);
  // a first question put in other words is not repeated back: the line is for a corrected typo and for follow-ups
  const firstReworded = change === "added" && !(context?.history || []).length;
  // shown only when the understanding step was not sure what was meant: a clear question is not repeated back
  if (res.understood && res.unsure && change !== "same" && !firstReworded) {
    understoodLine = el("p", "understood");
    understoodLine.dir = "auto";
    const label = el("span", "understood-label", (confirmFirst ? t.didYouMean : t.understoodAs) + " ");
    understoodLine.append(label, el("strong", "", res.understood));
    understoodLine.label = label;
    msg.append(understoodLine);
  }
  // A referral answers first: the referral line and who to ask; what the sources say in general follows, folded,
  // under a question the user opens (already in the reply: no new request).
  const referredInfo = res.status === "referred" && (res.claims || []).length > 0;
  // the line that introduces the quoted information («هذا ما وجدته في المصادر…:») goes in with it
  let [firstLine, ...restLines] = (res.message || "").split("\n");
  if (referredInfo && !restLines.length) {
    const parts = firstLine.split(/(?<=[.!؟?])\s+/);
    if (parts.length > 1 && /[:：]\s*$/.test(parts[parts.length - 1])) {
      restLines = [parts.pop()];
      firstLine = parts.join(" ");
    }
  }
  if (firstLine) { const m = el("div", "", referredInfo ? firstLine : res.message); m.dir = "auto"; msg.append(m); vowelTargets.push(m); }
  const generalFrom = msg.childNodes.length;
  if (referredInfo && restLines.join(" ").trim()) { const m = el("p", "", restLines.join(" ")); m.dir = "auto"; msg.append(m); }
  // Sources are numbered; each sentence of the answer carries the numbers of the sources it rests on.
  const number = new Map((res.sources || []).map((s, i) => [s.passage_id, i + 1]));
  const cardFor = new Map();
  const sourceCards = [];
  let showOnlyCard = () => {};  // Source-on-tap: set below, once the sources panel exists
  const quoted = new Set((res.sources || []).map((s) => `«${s.quote}»`));
  // A claim that only repeats a passage word for word is already shown in its source card.
  const shown = new Set();  // passages whose text is itself the answer stay open
  const cite = (c) => {  // the numbers of the sources a sentence rests on, each opening its card
    const sup = el("span", "cite");
    for (const id of new Set(c.passage_ids)) {
      const n = number.get(id);
      if (!n) continue;
      const a = el("a", "", `[${n}]`);
      a.href = "#"; a.title = t.source;
      a.addEventListener("click", (e) => {
        e.preventDefault();
        const card = cardFor.get(id);
        if (card) showOnlyCard(card);
      });
      sup.append(a);
    }
    return sup;
  };
  // Label-once: several sentences in a row under the same label («من الأدعية») say it once, then number the items
  if (!res._ordinals) {
    res._ordinals = true;
    const words = (context?.lang || lang) === "ar"
      ? ["الأول", "الثاني", "الثالث", "الرابع", "الخامس", "السادس", "السابع", "الثامن", "التاسع", "العاشر"] : [];
    const claims = res.claims || [];
    for (let i = 0; i < claims.length;) {
      let j = i + 1;
      while (j < claims.length && claims[i].label && claims[j].label === claims[i].label && !!claims[j].section === !!claims[i].section) j++;
      if (j - i > 1) {
        const shared = claims[i].label;
        for (let k = i; k < j; k++) {
          const ordinal = words[k - i] || String(k - i + 1);
          claims[k].label = k === i ? `${shared}: ${ordinal}` : ordinal;
          claims[k].text = claims[k].text.replace(/^\s*و?منها\s*:\s*/, "");  // the number now says «منها»
        }
      }
      i = j;
    }
  }
  const sentences = (res.claims || []).filter((c) => {
    if (!quoted.has(c.text)) return true;
    c.passage_ids.forEach((id) => shown.add(id));
    return false;
  });
  // one sentence: an optional bold label («المقدار:»), the text, then its source numbers
  const fill = (node, c) => {
    if (c.label) { const labelText = el("strong", "", c.label + ": "); node.append(labelText); vowelTargets.push(labelText); }
    // an everyday example is Muhawir's own illustration, not the source's words: it says so
    if (c.example) node.append(el("span", "example-tag", t.exampleTag), " ");
    // a quotation («…», ﴿…﴾) is set apart from the rest so the page can colour it; each piece is its own target for
    // the optional vowelling, so colouring survives it (the server leaves quoted words as they are)
    for (const piece of c.text.split(/(«[^»]+»|﴿[^﴾]+﴾)/g).filter(Boolean)) {
      const part = el("span", /^[«﴿]/.test(piece) ? "source-quote" : "", piece);
      node.append(part);
      vowelTargets.push(part);
    }
    const sup = cite(c);
    if (sup.childNodes.length) node.append(sup);
  };
  const paragraph = () => { const p = el("p", "answer"); p.dir = "auto"; return p; };
  const list = () => { const u = el("ul", "answer-list"); u.dir = "auto"; return u; };
  if (sentences.some((c) => c.section)) {
    // a short definition, then each part under its own heading, as a list
    let block = null, current = null, outro = null;
    const intro = paragraph();
    for (const c of sentences) {
      if (!c.section) {  // before the first heading: the definition; after the parts: a closing line
        const p = block ? (outro || (outro = paragraph())) : intro;
        if (p.childNodes.length) p.append(" ");
        fill(p, c);
        continue;
      }
      if (c.section !== current) {
        if (intro.childNodes.length && !intro.parentNode) msg.append(intro);
        current = c.section;
        const h = el("h4", "answer-section", current); h.dir = "auto"; vowelTargets.push(h);
        block = list();
        msg.append(h, block);
      }
      const li = el("li"); fill(li, c); block.append(li);
    }
    if (intro.childNodes.length && !intro.parentNode) msg.append(intro);
    if (outro) msg.append(outro);
  } else if (style === "kids" && sentences.length > 1) {
    // for children: one short sentence per line, each with a small picture for its subject (no new information)
    const items = el("ul", "kids-list"); items.dir = "auto";
    for (const c of sentences) {
      const li = el("li");
      const icon = el("span", "kids-icon", kidsIcon(c.text));
      icon.setAttribute("aria-hidden", "true");
      const body = el("span"); fill(body, c);
      li.append(icon, body); items.append(li);
    }
    msg.append(items);
  } else {
    const answer = paragraph();
    // types, kinds, conditions or steps: a short lead sentence, then one item per line
    const items = res.as_list && sentences.length > 1 ? list() : null;
    // the first sentence leads the list only when it introduces it (ends with a colon)
    const lead = items && /[:：]\s*$/.test(sentences[0].text);
    sentences.forEach((c, i) => {
      if (items && (i > 0 || !lead)) { const li = el("li"); fill(li, c); items.append(li); return; }
      if (answer.childNodes.length) answer.append(" ");
      fill(answer, c);
    });
    if (answer.childNodes.length) msg.append(answer);
    if (items) msg.append(items);
  }
  if (res.note) msg.append(el("p", "note", res.note));
  if ((res.views || []).some((v) => v.text) && res.status !== "referred") {  // a referred reply carries no panel of views
    // the usual order: Hanafi, Maliki, Shafi'i, Hanbali, then others
    const ORDER = [/حنيف|حنف|احناف|أحناف/, /مالك/, /شافع/, /أحمد|احمد|حنبل/];
    const rank = (name) => { const i = ORDER.findIndex((re) => re.test(name)); return i < 0 ? ORDER.length : i; };
    const panel = el("details", "views");
    panel.open = true;  // the scholars' views are the answer to a ruling question: shown, not hidden
    panel.append(el("summary", "", t.views));
    for (const v of [...res.views].sort((a, b) => rank(a.school) - rank(b.school))) {
      const row = el("p", "view");
      row.dir = "auto";
      const schoolName = el("strong", "", v.school + ": ");
      const viewText = el("span", "", v.text);
      row.append(schoolName, viewText);
      vowelTargets.push(schoolName, viewText);
      const sup = cite(v);
      if (sup.childNodes.length) row.append(sup);
      panel.append(row);
    }
    msg.append(panel);
  }
  let general = null;
  if (referredInfo) {
    general = el("details", "general-info");
    const summary = el("summary", "", t.generalInfo); summary.dir = "auto";
    general.append(summary);
    while (msg.childNodes.length > generalFrom) general.append(msg.childNodes[generalFrom]);
  }
  let next = null;
  if (res.follow_up) {
    // Reply-by-typing: Muhawir ends with a question, as in a conversation. The question is shown as Muhawir's words and
    // the box below says «ردّ على مُحاور…»: whatever is typed there is read as the reply to it (the question is kept in
    // the conversation sent with the next message). No buttons: the reply is typed, as to a person
    next = el("div", "follow-up-turn");
    const asked = el("p", "follow-up-question", /[؟?]\s*$/.test(res.follow_up) ? res.follow_up : "");
    asked.dir = "auto";
    next.append(asked);
    if (!general) msg.append(next);
  }
  if ((res.choices || []).length) {  // e.g. «بالعربية» / «In English» for a language Muhawir does not answer in
    const row = el("div", "confirm-choices");
    row.style.marginTop = "12px";
    row.setAttribute("role", "group");
    for (const choice of res.choices) {
      const b = el("button", "", choice);
      b.type = "button"; b.dir = "auto";
      b.addEventListener("click", () => { row.remove(); setQuestionText(choice); $("ask").requestSubmit(); });
      row.append(b);
    }
    msg.append(row);
  }
  // «وضّح أكثر»: the same question again in the detailed style, more sentences from more passages, each checked
  // as before. The question as Muhawir understood it is asked on its own (a saved reply is reused at no cost).
  let deepen = null;
  if (context && res.status === "answered" && !res.by_code && style !== "extended" && (res.claims || []).length) {
    deepen = () => {
      nextAsk = { style: "extended", history: res.understood ? [] : (context.history || []) };
      setQuestionText(res.understood || context.question);
      $("ask").requestSubmit();
    };
  }
  if (res.referral && res.referral.title) {  // who to ask when Muhawir refers on: official bodies, opened in a new tab
    const box = el("section", "referral");
    box.dir = "auto";
    box.append(el("h3", "", res.referral.title), el("p", "", res.referral.intro));
    if ((res.referral.links || []).length) {
      const list = el("ul");
      for (const link of res.referral.links) {
        const item = el("li");
        const a = el("a", "", link.label);
        a.href = safeLink(link.url); a.target = "_blank"; a.rel = "noopener noreferrer";
        item.append(a);
        if (link.where) item.append(el("span", "where", ` · ${link.where}`));
        list.append(item);
      }
      box.append(list);
    }
    msg.append(box);
  }
  if (general) {
    // Referral-offer: the general rulings are offered as Muhawir's question, «هل تريد معرفة الأحكام العامة…؟», answered
    // by typing in the box like any reply; they stay folded here (opened with the sources)
    const offer = el("div", "follow-up-turn");
    const asked = el("p", "follow-up-question", t.generalInfo);
    asked.dir = "auto";
    offer.append(asked);
    msg.append(offer, general);
  }
  const sourcesHome = general || msg;  // a folded answer keeps its sources with it
  const shelf = el("div", "source-shelf");
  // Source-on-tap: the sources stay folded inside their icon; a number or the icon opens them
  const panel = el("div", "source-panel");
  panel.hidden = true;
  if ((res.sources || []).length) {
    const sourcesTitle = el("div", "sources-title");
    sourcesTitle.append(el("span", "sr-only", t.sources));  // one sources icon only: the one in the toolbar
    panel.append(sourcesTitle, shelf);
    sourcesHome.append(panel);
  }
  for (const s of res.sources || []) {
    const card = el("details", "card");
    // a reply with no sentences of its own (the closest hadith found) is its source: shown open
    card.open = open || shown.has(s.passage_id) || !(res.claims || []).length;
    cardFor.set(s.passage_id, card);
    // a hadith shows its grading in the folded line, so it is never seen without it
    const summary = el("summary");
    const label = s.kind !== "hadith" ? `${s.source_name} · ${s.location}`
      : s.grade ? `${t.hadith} (${t.grade}: ${s.grade}) · ${s.source_name}`
      : s.location;  // e.g. «صحيح البخاري، رقم 1»
    summary.append(el("span", "num", `[${number.get(s.passage_id)}]`), el("span", "book-title", label));
    card.append(summary);
    card.append(el("div", "about", s.source_about));
    card.append(el("blockquote", "", s.quote));
    if (s.passage_id) card.append(contextButton(s.passage_id));
    const ayah = s.kind === "quran" && /^q:(\d{1,3}):(\d{1,3})$/.exec(s.passage_id || "");
    if (ayah) card.append(recitationButton(+ayah[1], +ayah[2]));
    if (s.translation) {  // the approved English translation of the verse's meaning (King Fahd Complex)
      const tr = el("blockquote", "translation", s.translation);
      const urdu = /[\u0679\u0688\u0691\u06BA\u06BE\u06C1\u06D2\u06D3]/.test(s.translation);
      tr.dir = urdu ? "rtl" : "ltr"; tr.lang = urdu ? "ur" : "en";
      card.append(tr);
      if (s.translation_name) card.append(el("div", "meta", s.translation_name));
    }
    // «موضوعات الآية» is said of a verse only; another passage shows its chapter, unless the location already names it
    if (s.topics && s.kind === "quran") card.append(el("div", "meta", `${t.topics}: ${s.topics}`));
    else if (s.topics && !(s.location || "").includes(s.topics)) card.append(el("div", "meta", `${t.chapter}: ${s.topics}`));
    const meta = el("div", "meta", `${t.location}: ${s.location}` + (s.grade ? ` · ${t.grade}: ${s.grade}` : ""));
    if (s.source_url) {
      const a = el("a", "", t.open);
      a.href = safeLink(s.source_url); a.target = "_blank"; a.rel = "noopener";
      meta.append(" · ", a);
    }
    if (s.kind === "hadith") {  // check this hadith on dorar.net, as dorar's own search box for site owners does
      const a = el("a", "", t.verify);
      a.href = "https://dorar.net/hadith/search?q=" + encodeURIComponent(searchPhrase(s.quote));
      a.target = "_blank"; a.rel = "noopener";
      meta.append(" · ", a);
    }
    card.append(meta);
    shelf.append(card);
    sourceCards.push(card);
  }
  // a reply that is its own source (the closest hadith, a passage that is itself the answer) shows it at once
  if (sourceCards.length && (!(res.claims || []).length || shown.size)) panel.hidden = false;
  let sourcesChanged = () => {};
  showOnlyCard = (card) => {
    const alone = !panel.hidden && sourceCards.every((c) => c.hidden === (c !== card)) && card.open;
    if (alone) { panel.hidden = true; sourcesChanged(); return; }  // the same number again folds it
    panel.hidden = false;
    sourceCards.forEach((c) => { c.hidden = c !== card; });
    card.open = true;
    if (general) general.open = true;
    sourcesChanged();
    card.scrollIntoView({ behavior: "smooth", block: "nearest" });
  };
  if (general && next) msg.append(next);
  const actions = el("div", "tools");
  actions.setAttribute("role", "group");
  actions.setAttribute("aria-label", t.responseActions);
  const status = el("span", "action-status");
  status.setAttribute("role", "status");
  status.setAttribute("aria-live", "polite");

  const copy = makeActionButton(t.copyAnswer, "copy", "", "copyAnswer");
  copy.addEventListener("click", async () => {
    try { await writeClipboard(answerText(res)); setActionStatus(status, "copied"); }
    catch { setActionStatus(status, "copyFailed"); }
  });
  actions.append(copy);

  // Display only: keep res, history, source cards and clipboard content original.
  const tashkeelLang = context?.lang || lang;
  if (tashkeelLang === "ar" && vowelTargets.some(n => /[ء-ي]/.test(n.textContent))) {
    const original = vowelTargets.map(n => n.textContent);
    let vowelled = null, showing = false;
    const vowelButton = makeActionButton("شكّل الجواب", "tashkeel", "vowel-btn", "tashkeel");
    const setVowelLabel = (text) => {
      vowelButton.querySelector(".action-label").textContent = text;
      vowelButton.setAttribute("aria-label", text);
      vowelButton.title = text + " — تشكيل آلي مساعد قد يخطئ؛ النص الأصلي محفوظ";
    };
    setVowelLabel("شكّل الجواب");
    vowelButton.type = "button";
    vowelButton.setAttribute("aria-pressed", "false");
    vowelButton.title = "تشكيل آلي مساعد قد يخطئ؛ النص الأصلي محفوظ";
    const applyVowels = async () => {
      if (vowelButton.disabled) return;
      if (showing) {
        vowelTargets.forEach((n, i) => { n.textContent = original[i]; });
        showing = false;
        setVowelLabel("شكّل الجواب");
        vowelButton.setAttribute("aria-pressed", "false");
        status.textContent = "";
        return;
      }
      vowelButton.disabled = true;
      status.textContent = "جارٍ التشكيل…";
      try {
        if (!vowelled) {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 240000);
          try {
            const send = () => fetch("/api/tashkeel", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ texts: original, passage_ids: (res.sources || []).map(s => s.passage_id) }),
              signal: controller.signal
            });
            let data = null;
            // a long answer is read a few sentences at a time: the server says when some are still unread, and the
            // sentences already read are kept there, so asking again only reads the rest
            for (let round = 0; round < 6; round++) {
              let response = await send();
              if (response.status === 503) {  // busy: one more try after a short wait
                await new Promise((resolve) => setTimeout(resolve, 3000));
                response = await send();
              }
              if (!response.ok) {
                let reason = "";
                try { reason = (await response.json()).detail || ""; } catch {}
                throw Object.assign(new Error("Unavailable"), { reason, code: response.status });
              }
              data = await response.json();
              if (data.complete !== false) break;
              status.textContent = "جارٍ التشكيل… (" + (round + 1) + ")";
            }
            const bare = text => text.replace(/[\u064b-\u0652\u0670]/g, "");
            if (!Array.isArray(data.texts) || data.texts.length !== original.length ||
                data.texts.some((text, i) => typeof text !== "string" || bare(text) !== bare(original[i])))
              throw new Error("Changed text");
            vowelled = data;
          } finally { clearTimeout(timer); }
        }
        vowelTargets.forEach((n, i) => { n.textContent = vowelled.texts[i]; });
        showing = true;
        setVowelLabel("النص الأصلي");
        vowelButton.setAttribute("aria-pressed", "true");
        status.textContent = vowelled.rejected ? "تشكيل آلي؛ أُبقيت أجزاء على أصلها لحماية النص." : "تشكيل آلي مساعد قد يخطئ. النسخ والمشاركة يحتفظان بالأصل.";
      } catch (error) {
        const reason = error?.reason || "";
        status.textContent = /environment unavailable/.test(reason) ? "خدمة التشكيل غير مفعّلة على الخادم؛ النص الأصلي محفوظ."
          : /rate limit/.test(reason) ? "كثرت طلبات التشكيل الآن؛ النص الأصلي محفوظ. حاول بعد دقيقة."
          : /busy/.test(reason) ? "التشكيل مشغول الآن؛ النص الأصلي محفوظ. حاول بعد قليل."
          : error?.code === 422 ? "الجواب أطول من أن يُشكَّل دفعة واحدة؛ النص الأصلي محفوظ."
          : error?.message === "Changed text" ? "اختلف النص بعد التشكيل فأُبقي الأصل حمايةً له."
          : "تعذّر التشكيل؛ النص الأصلي محفوظ. حاول لاحقًا.";
      } finally { vowelButton.disabled = false; }
    };
    vowelButton.addEventListener("click", applyVowels);
    actions.append(vowelButton);
    // Wait for explicit question confirmation; never re-run for restored history.
    if (["kids", "newcomer"].includes(style) && !context?.restored) {
      if (confirmFirst) msg.startTashkeel = applyVowels;
      else setTimeout(() => { if (msg.isConnected) applyVowels(); }, 0);
    }
  }


  const share = makeActionButton(t.shareAnswer, "share", "", "shareAnswer");
  share.addEventListener("click", async () => {
    const text = answerText(res);
    try {
      if (navigator.share) await navigator.share({ title: t.assistant, text });
      else { await writeClipboard(text); setActionStatus(status, "shareFallback"); }
    } catch (error) {
      if (error?.name !== "AbortError") setActionStatus(status, "shareFailed");
    }
  });
  actions.append(share);

  const listen = listenButton(res, status);
  if (listen) { actions.append(listen); msg.listen = listen; }

  const regenerate = makeActionButton(t.regenerate, "regenerate", "", "regenerate");
  regenerate.disabled = !context;
  regenerate.addEventListener("click", () => regenerateAnswer(msg));
  actions.append(regenerate);

  if (res.status === "answered") {  // a rating only counts on the server: no model is asked anything
    const rate = (verdict) => {
      clearButton.disabled = unclearButton.disabled = true;
      (verdict === "clear" ? clearButton : unclearButton).setAttribute("aria-pressed", "true");
      setActionStatus(status, verdict === "clear" ? "thanks" : "thanksUnclear");
      fetch("/api/feedback", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ verdict }) }).catch(() => {});
    };
    const clearButton = makeActionButton(t.clear, "clear", "", "clear");
    const unclearButton = makeActionButton(t.unclear, "unclear", "", "unclear");
    clearButton.addEventListener("click", () => rate("clear"));
    unclearButton.addEventListener("click", () => rate("unclear"));
    actions.append(clearButton, unclearButton);
  }

  const more = el("details", "more-actions");
  const moreSummary = el("summary", "action-btn");
  moreSummary.dataset.labelKey = "more";
  moreSummary.setAttribute("aria-expanded", "false");
  moreSummary.setAttribute("aria-label", t.more);
  moreSummary.title = t.more;
  moreSummary.append(actionIcon("more"), el("span", "action-label", t.more));
  more.append(moreSummary);
  const menu = el("div", "more-menu");
  const copySources = el("button", "more-item", t.copyWithSources);
  copySources.type = "button";
  copySources.dataset.itemKey = "copyWithSources";
  copySources.addEventListener("click", async () => {
    try { await writeClipboard(answerText(res, true)); setActionStatus(status, "copied"); }
    catch { setActionStatus(status, "copyFailed"); }
    more.open = false;
  });
  const simplify = el("button", "more-item", t.simplifyAnswer);
  simplify.type = "button";
  simplify.dataset.itemKey = "simplifyAnswer";
  simplify.addEventListener("click", () => {
    more.open = false;
    setQuestionText(UI[lang].simplifyPrompt);
    $("q").focus();
    $("ask").requestSubmit();
  });
  menu.append(copySources, simplify);
  if (deepen) {  // «وضّح أكثر» lives in this menu, not under every answer
    const detail = el("button", "more-item", t.moreDetail);
    detail.type = "button";
    detail.dataset.itemKey = "moreDetail";
    detail.addEventListener("click", () => { more.open = false; deepen(); });
    menu.append(detail);
  }
  if (listen) {
    const voiceChoice = listen.querySelector(".voice-choice");
    const voiceNote = listen.querySelector(".listen-note");
    if (voiceChoice) menu.append(voiceChoice);
    if (voiceNote) menu.append(voiceNote);
  }
  more.append(menu);
  more.addEventListener("toggle", () => {
    moreSummary.setAttribute("aria-expanded", String(more.open));
    if (more.open) {
      const rect = moreSummary.getBoundingClientRect();
      menu.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 240)) + "px";
      menu.style.top = Math.max(8, rect.top - menu.offsetHeight - 8) + "px";
    }
  });
  more.addEventListener("keydown", (event) => { if (event.key === "Escape") { more.open = false; moreSummary.focus(); } });
  actions.append(more);

  if (sourceCards.length) {
    const sourcesButton = makeActionButton(panel.hidden ? t.showSources : t.hideSources, "sources", "", "sources");
    const label = sourcesButton.querySelector(".action-label");
    sourcesButton.dataset.count = String(sourceCards.length);
    sourcesButton.classList.add("sources-chip");
    const setSourceLabel = (expanded) => {
      const current = UI[lang];
      const text = expanded ? current.hideSources : current.showSources;
      label.textContent = String(sourceCards.length);
      sourcesButton.setAttribute("aria-label", text + " — " + sourceCountLabel(sourceCards.length));
      sourcesButton.title = text;
      sourcesButton.setAttribute("aria-expanded", String(expanded));
    };
    setSourceLabel(!panel.hidden);
    sourcesChanged = () => setSourceLabel(!panel.hidden);
    sourcesButton.addEventListener("click", () => {
      const single = !panel.hidden && sourceCards.some((card) => card.hidden);  // one source shown: the icon lists them all
      const expanded = panel.hidden || single;
      panel.hidden = !expanded;
      if (expanded) {  // all the sources, each folded to its title
        sourceCards.forEach((card) => { card.hidden = false; card.open = false; });
        if (general) general.open = true;
      }
      setSourceLabel(expanded);
    });
    actions.append(sourcesButton);
  }

  // Keep the primary icons in the same order as the supplied toolbar reference.
  const ordered = [copy, share, listen, actions.querySelector('[data-label-key="clear"]'),
    actions.querySelector('[data-label-key="unclear"]'), regenerate,
    actions.querySelector(".vowel-btn"), actions.querySelector(".sources-chip"), more];
  ordered.filter(Boolean).forEach((control) => actions.append(control));
  msg.append(actions, status);
  msg.actionStatus = status;
  msg.regenerateButton = regenerate;
  msg.responseActions = actions;
  msg.responseData = res;
  msg.requestContext = context;
  if (confirmFirst) {
    const body = el("div", "confirm-body");
    body.hidden = true;
    while (understoodLine.nextSibling) body.append(understoodLine.nextSibling);
    msg.append(body);
    const statusTag = heading.querySelector(".status");  // «إحالة إلى مختص» waits for the answer too
    if (statusTag) statusTag.hidden = true;
    const choices = el("div", "confirm-choices");
    choices.setAttribute("role", "group");
    const yes = el("button", "confirm-yes", t.yes); yes.type = "button";
    const no = el("button", "confirm-no", t.no); no.type = "button";
    choices.append(yes, no);
    understoodLine.after(choices);
    yes.addEventListener("click", () => {
      choices.remove();
      // confirmed: the user already said this is the question, so the line is not shown again
      understoodLine.remove();
      body.hidden = false;
      if (msg.startTashkeel) msg.startTashkeel();
      if (statusTag) statusTag.hidden = false;
    });
    no.addEventListener("click", () => {
      choices.remove();
      body.remove();
      const ask = el("p", "", UI[lang].whatDidYouMean); ask.dir = "auto";
      msg.append(ask);
      // the answer to a question the user did not mean is not kept for the next one
      forgetRejectedAnswer(context, res);
      saveConversations();
      $("q").focus();
    });
  }
  return msg;
}

// 8. Requests in flight: stopping one, asking again, forgetting an answer the reader rejected.
function forgetRejectedAnswer(context, res) {
  const conversation = context?.conversation;
  if (!conversation) return;
  const userText = String(res.understood || context.question).slice(0, 600);
  const answerText = [res.message, ...(res.claims || []).map((claim) => claim.text)].filter(Boolean).join(" ").slice(0, 600);
  const removePair = (turns) => {
    if (!Array.isArray(turns)) return;
    for (let i = turns.length - 2; i >= 0; i--) {
      if (turns[i].role === "user" && turns[i].text === userText &&
          turns[i + 1].role === "assistant" && turns[i + 1].text === answerText) {
        turns.splice(i, 2);
        break;
      }
    }
  };
  removePair(conversation.turns);
  conversation.log = (conversation.log || []).filter((entry) => entry !== context.entry);
  for (const entry of conversation.log) removePair(entry.history);
  context.entry = null;
}

function syncRegenerateButtons(conversation) {
  const targets = conversation ? [conversation] : conversations;
  for (const item of targets) {
    const latest = item.messages.at(-1);
    for (const message of item.messages) {
      if (message?.regenerateButton) message.regenerateButton.disabled = message !== latest || $("send").disabled;
    }
  }
}

function beginAnswerRequest(details) {
  const request = { ...details, controller: new AbortController(), cancelled: false };
  activeRequest = request;
  $("composerVoice").hidden = true;
  $("send").disabled = true;
  $("send").hidden = true;
  $("stopRequest").hidden = false;
  $("requestNotice").hidden = true;
  // Blur after the DOM/button updates too: Android can otherwise keep the IME's
  // focused-input pan even though the conversation has already been appended.
  if (document.activeElement === $("q")) $("q").blur();
  if (isMobileLayout() && (!window.visualViewport || Math.abs(window.visualViewport.scale - 1) <= .01)) {
    window.scrollTo({ top:0, left:0, behavior:"instant" });
  }
  syncRegenerateButtons();
  return request;
}

function finishAnswerRequest(request) {
  if (activeRequest !== request) return;
  activeRequest = null;
  $("send").disabled = false;
  fitQuestionBox();
  $("stopRequest").hidden = true;
  syncRegenerateButtons();
  request.conversation.updatedAt = Date.now();
  renderHistory();
  if (activeConversation === request.conversation) {
    const last = request.conversation.messages.at(-1);
    if (!request.cancelled && last?.dataset.sourcedAnswer) scrollToAnswerStart(last);
    else scrollDown();
    if (request.kind === "question" && window.matchMedia("(min-width: 861px)").matches) $("q").focus();
  }
}

function stopAnswerRequest() {
  const request = activeRequest;
  if (!request) return;
  request.cancelled = true;
  activeRequest = null;
  request.controller.abort();
  const conversation = request.conversation;
  conversation.messages = conversation.messages.filter((entry) => entry !== request.pending && entry !== request.userMessage);
  request.pending.remove();
  if (request.userMessage) request.userMessage.remove();
  if (request.kind === "regenerate") setActionStatus(request.message.actionStatus, "requestStopped");
  if (!conversation.messages.length) conversation.title = UI[lang].newChat;
  conversation.updatedAt = Date.now();
  $("send").disabled = false;
  $("send").hidden = false;
  $("stopRequest").hidden = true;
  syncRegenerateButtons();
  if (activeConversation === conversation) {
    if (request.kind === "question" && !$("q").value.trim()) setQuestionText(request.question);
    if (!conversation.messages.length) renderConversation(conversation);
    else { updateConversationTitle(); renderHistory(); }
    $("q").focus();
  } else renderHistory();
  // Stopping a new answer leaves the question to edit; stopping a re-written answer leaves the old answer in place,
  // and that button's own status already says so.
  if (request.kind !== "regenerate") {
    const note = $("requestNotice"), said = UI[lang].requestStopped;
    note.textContent = said; note.hidden = false;
    setTimeout(() => { if (note.textContent === said) note.hidden = true; }, 8000);
  }
}

async function regenerateAnswer(message) {
  const context = message.requestContext;
  const conversation = context?.conversation;
  if (!context || !conversation || conversation.messages.at(-1) !== message || $("send").disabled) return;
  const messageIndex = conversation.messages.indexOf(message);
  if (messageIndex < 0) return;
  message.regenerateButton.disabled = true;
  setActionStatus(message.actionStatus, "regenerating");
  const pending = createRiderStatus(context.lang || lang);
  conversation.messages.push(pending);
  if (activeConversation === conversation) { $("thread").append(pending); scrollDown(); }
  const request = beginAnswerRequest({ kind: "regenerate", conversation, pending, message });
  try {
    const res = await askStreamed({ question: context.question, style: context.style, lang: context.lang, history: context.history }, request.controller.signal, pending);
    if (request.cancelled) return;
    await completeRiderStatus(pending, res, context.lang || lang);
    if (request.cancelled) return;
    const replacement = renderAnswer(res, context.style, context);
    conversation.messages[messageIndex] = replacement;
    conversation.messages = conversation.messages.filter((entry) => entry !== pending);
    if (activeConversation === conversation) {
      message.replaceWith(replacement);
      pending.remove();
      typeAnswer(replacement);
    }
    conversation.turns = context.history.slice();
    if (rememberable(res)) {
      remember(conversation, "user", res.understood || context.question);
      remember(conversation, "assistant", [res.message, ...(res.claims || []).map((claim) => claim.text)].filter(Boolean).join(" "));
    }
    conversation.updatedAt = Date.now();
    logAnswer(conversation, context, res);
    if (activeConversation === conversation) scrollDown();
  } catch {
    if (request.cancelled) return;
    conversation.messages = conversation.messages.filter((entry) => entry !== pending);
    if (activeConversation === conversation) pending.remove();
    setActionStatus(message.actionStatus, "error");
  } finally {
    finishAnswerRequest(request);
  }
}

// A short distinctive phrase of a hadith for dorar's search: the Prophet's words when quoted, else the last words.
function searchPhrase(text) {
  const plain = text.replace(/[\u064B-\u0652\u0670\u0640]/g, "");
  const quoted = plain.match(/"([^"]{15,})"/) || plain.match(/«([^»]{15,})»/);
  const words = (quoted ? quoted[1] : plain).replace(/[^\p{L}\s]/gu, " ").split(/\s+/).filter(Boolean);
  return (quoted ? words.slice(0, 7) : words.slice(-7)).join(" ");
}

function fitQuestionBox() {

  const viewport = window.visualViewport;

// 10. The usage warning.
// «استخدمت 80% من حد الأسئلة… يتجدد بعد 12 دقيقة»: said by the server once four fifths of a limit are used
function showUsage(u) {
  const box = $("requestNotice");
  if (!u) { if (box.dataset.usage) { box.hidden = true; delete box.dataset.usage; } return; }
  const t = UI[lang] || UI.ar;

    .replace("{limit}", u.limit).replace("{wait}", wait);

// Sending a question: show it, wait for the answer, render it, keep it, and say what went wrong when it fails.
$("ask").addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = $("q").value.trim();
  if (!question || $("send").disabled) return;  // one question at a time: Enter must not send a second
  // Dismiss the mobile keyboard before painting the source-search indicator.
  if (isMobileLayout()) $("q").blur();
  const askedBySpeech = spokenTurn;
  spokenTurn = false;
  stopListening();
  const conversation = activeConversation;
  conversation.awaitingReply = false;
  syncPlaceholder();
  const override = nextAsk;  // «وضّح أكثر» asks once in the detailed style; the chosen style stays as it was
  nextAsk = null;
  const style = override?.style || $("style").value;
  const requestLang = lang;
  const requestHistory = override?.history ? override.history.slice() : conversation.turns.slice();
  const context = { conversation, question, style, lang: requestLang, history: requestHistory };
  $("empty")?.remove();
  const userMessage = el("div", "turn-user", question);
  userMessage.dir = "auto";
  conversation.messages.push(userMessage);
  conversation.updatedAt = Date.now();
  if (conversation.messages.length === 1) {
    const title = question.replace(/\s+/g, " ").trim();
    conversation.title = title.length > 42 ? `${title.slice(0, 41).trimEnd()}…` : title;
    updateConversationTitle();
    renderHistory();
  }
  appendThreadMessage($("thread"), userMessage);
  const pending = createRiderStatus(requestLang);
  conversation.messages.push(pending);
  syncRegenerateButtons();
  conversation.updatedAt = Date.now();
  $("thread").append(pending);
  const request = beginAnswerRequest({ kind: "question", conversation, pending, userMessage, question });
  setQuestionText("");
  scrollDown();
  try {
    lastAskStatus = 0;
    const payload = { question, style, lang: requestLang, history: requestHistory };
    if (override?.asQuestion) payload.as_question = true;
    const res = await askStreamed(payload, request.controller.signal, pending);
    showUsage(res.usage);
    if (request.cancelled) return;
    await completeRiderStatus(pending, res, requestLang);
    if (request.cancelled) return;
    const msg = renderAnswer(res, style, context);
    const pendingIndex = conversation.messages.indexOf(pending);
    if (pendingIndex >= 0) conversation.messages[pendingIndex] = msg;
    pending.replaceWith(msg);
    if (!(askedBySpeech && voiceMode)) typeAnswer(msg);
    if (askedBySpeech && voiceMode) voiceRead(res);  // voice mode: the answer, its sources, then listen again
    else if (askedBySpeech && msg.listen && !msg.querySelector(".confirm-body[hidden]")) msg.listen.play();  // spoken question: spoken reply
    // answers and Muhawir's offers (e.g. "shall I explain it more simply?") are remembered, so a follow-up
    // or a "yes" is understood; refusals, errors and "not found" are not answers to explain again
    if (res.status === "quote") {  // a follow-up («ما معناه؟») is about the text that was found
      remember(conversation, "user", question);
      remember(conversation, "assistant", (res.quote?.matches?.[0]?.excerpt) || "");
    } else if (rememberable(res)) {
      remember(conversation, "user", res.understood || question);
      // a referral keeps its offer of the general rulings, so a typed «نعم» is read as the reply to it
      const offered = res.status === "referred" && (res.claims || []).length ? (UI[replyLangOf(res)] || UI[lang]).generalInfo : "";
      remember(conversation, "assistant", [(res.message || "").split("\n")[0], offered || (res.claims || []).map((c) => c.text).join(" "),
        res.follow_up].filter(Boolean).join(" "));
    }
    conversation.awaitingReply = Boolean(res.follow_up || (res.choices || []).length
      || (res.status === "referred" && (res.claims || []).length));
    syncPlaceholder();
    logAnswer(conversation, context, res);
    syncRegenerateButtons();
  } catch (error) {
    if (request.cancelled) return;
    lastAskStatus = error?.status || 0;
    const errorMessage = el("div", "msg", lastAskStatus === 429 ? UI[lang].tooMany : UI[lang].error);
    const pendingIndex = conversation.messages.indexOf(pending);
    if (pendingIndex >= 0) conversation.messages[pendingIndex] = errorMessage;
    pending.replaceWith(errorMessage);
    syncRegenerateButtons();
    if (activeConversation === conversation && !$("q").value.trim()) setQuestionText(question);
    if (askedBySpeech && voiceMode) voiceSay(lastAskStatus === 429 ? UI[lang].tooMany : UI[lang].error).then(voiceListen);
  } finally {
    finishAnswerRequest(request);
  }
});

const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (Recognition) {

  $("mic").addEventListener("click", () => {

    recognizer.interimResults = true;
    recognizer.continuous = false;
    stopReadAloud();  // stop reading the last reply while the user speaks
    const before = $("q").value.trim();
    let heard = false;
    recognizer.onresult = (ev) => {
      const said = Array.from(ev.results).map((r) => r[0].transcript).join(" ");
      setQuestionText((before ? before + " " : "") + said);
      heard = Boolean(said.trim());

    let failed = false;

    recognizer.onend = () => {
      recognizing = false;
      $("mic").setAttribute("aria-pressed", "false");
      $("mic").lastElementChild.textContent = UI[lang].mic;
      // the user talked: send what was heard and answer by voice, like a conversation
      if (heard && !failed && $("q").value.trim()) { spokenTurn = true; $("ask").requestSubmit(); }
      else if (voiceMode) voiceMissed();
    };
    recognizing = true;
    $("mic").setAttribute("aria-pressed", "true");
    $("mic").lastElementChild.textContent = UI[lang].micStop;
    recognizer.start();
  });
}

// The voice mode (22 October 2026), for a listener who cannot see the page: one button, then a spoken conversation.
// It listens after a short tone, sends what was heard, reads the answer, then each source (a verse in the reciter's
// own voice, Mishary Alafasy, with its approved translation in English or Urdu; any other text read aloud as it is),
// and listens again. Every step is also said in a live region, so a screen reader announces it. Escape stops it.
let voiceMode = false, voiceMisses = 0, voiceRun = 0;
function setVoiceModeLabel(text) {  // the button's name is read by screen readers even where its label is hidden
  const b = $("voiceMode");
  b.lastElementChild.textContent = text;
  b.setAttribute("aria-label", text);
  b.title = text;
}
const VOICE_SOURCES = 3;  // the first sources only: the rest stay on the page
function voiceStatus(text) {
  const box = $("voiceStatus");
  box.hidden = !text;
  box.textContent = text || "";
}
function voiceTone(high = true) {  // a short tone: «speak now» (high) or «stopped» (low)
  try {
    const ctx = voiceTone.ctx || (voiceTone.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.frequency.value = high ? 880 : 440;
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.26);
  } catch { /* no sound: the live region still says it */ }
  return new Promise((resolve) => setTimeout(resolve, 300));
}
function textLang(text) {
  if (/[ٹڈڑںھہےۓ]/.test(text)) return "ur";
  return /[؀-ۿ]/.test(text) ? "ar" : "en";
}
let voiceAudio = null;
function voiceStopSound() {
  if (voiceAudio) { voiceAudio.pause(); voiceAudio = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
function playUrl(url) {
  return new Promise((resolve) => {
    const audio = new Audio(url);
    voiceAudio = audio;
    const done = () => { if (voiceAudio === audio) voiceAudio = null; resolve(); };
    audio.addEventListener("ended", done, { once: true });
    audio.addEventListener("error", done, { once: true });
    audio.play().catch(done);
  });
}
// one piece of text aloud: the natural voice the listener chose when the server has it, else the browser's own
let voiceNoticeAt = 0;
function voiceNoVoice(speakLang) {  // said on the page, at most every 20 seconds
  if (Date.now() - voiceNoticeAt < 20000) return;
  voiceNoticeAt = Date.now();
  const note = $("requestNotice");
  note.textContent = (UI[speakLang] || UI[lang]).noVoice;
  note.hidden = false;
  setTimeout(() => { if (note.textContent === (UI[speakLang] || UI[lang]).noVoice) note.hidden = true; }, 9000);
}
async function voiceSay(text, speakLang = textLang(text)) {
  const run = voiceRun;
  // a verse quoted inside a passage (between ﴿﴾ or {}) is never read by a synthetic voice, in any language
  const mark = { ar: "(آية)", ur: "(آیت)" }[speakLang] || "(verse)";
  text = (text || "").replace(/﴿[^﴾]*(?:﴾|$)/g, mark).replace(/\{[^}]*(?:\}|$)/g, mark).trim();
  if (!text) return;
  if (text.length > 1500) text = text.slice(0, 1490).replace(/\s+\S*$/, "") + "…";
  if (document.body.classList.contains("natural-voice")) {
    const named = VOICE_LIST[speakLang] || [];
    const stored = storedVoice(speakLang);
    const voice = named.some((v) => v.id === stored) ? stored : selectedSpeechVoice;
    try {
      const r = await fetch("/tts", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, voice, lang: speakLang }) });
      if (r.ok) {
        const url = URL.createObjectURL(await r.blob());
        if (run === voiceRun) await playUrl(url);
        URL.revokeObjectURL(url);
        return;
      }
    } catch { /* the browser's voice below */ }
  }
  if (!("speechSynthesis" in window) || run !== voiceRun) return;
  const voice = pickVoice(await voicesReady(), speakLang, selectedSpeechVoice);
  if (!voice) {
    // No voice for this language on the device: a voice of another language would read only the digits, in English
    voiceNoVoice(speakLang);
    return;
  }
  for (const part of pieces(text)) {
    if (run !== voiceRun) return;
    await new Promise((resolve) => {
      const u = new SpeechSynthesisUtterance(part);
      u.voice = voice; u.lang = voice.lang;
      u.onend = resolve; u.onerror = resolve;
      setTimeout(resolve, 4000 + part.length * 120);  // a browser that never says it finished does not stop the turn
      speechSynthesis.speak(u);
    });
  }
}
async function voiceListen() {
  if (!voiceMode) return;
  if (recognizing) return;
  voiceStatus(UI[lang].vmListening);
  await voiceTone(true);
  if (voiceMode && !recognizing) $("mic").click();
}
async function voiceMissed() {  // silence or nothing understood: say so and listen again, twice at most
  voiceMisses += 1;
  if (voiceMisses > 2) { stopVoiceMode(); return; }
  voiceStatus(UI[lang].vmNotHeard);
  await voiceSay(UI[lang].vmNotHeard, lang);
  voiceListen();
}
async function voiceRead(res) {
  const run = voiceRun, t = UI[lang] || UI.ar;
  voiceMisses = 0;
  voiceStatus(t.vmReading);
  const said = spokenText(res);
  if (said) await voiceSay(said);
  for (const s of (res.sources || []).slice(0, VOICE_SOURCES)) {
    if (run !== voiceRun || !voiceMode) return;
    const where = (s.location || "").includes(s.source_name) ? s.location : `${s.source_name}، ${s.location}`;
    await voiceSay(`${t.source}: ${where}`, lang);
    const ayah = s.kind === "quran" && /^q:(\d{1,3}):(\d{1,3})$/.exec(s.passage_id || "");
    if (ayah) {  // a verse is heard only in a reciter's real voice, never a synthetic one
      await playUrl(`https://everyayah.com/data/Alafasy_128kbps/${ayah[1].padStart(3, "0")}${ayah[2].padStart(3, "0")}.mp3`);
      if (s.translation) await voiceSay(`${t.vmTranslation} ${s.translation}`);
    } else if (s.kind !== "quran") {
      await voiceSay(s.quote);  // a verse quoted inside it (between ﴿﴾ or {}) is left out by the server
    }
  }
  if (run === voiceRun && voiceMode) voiceListen();
}
function startVoiceMode() {
  if (!Recognition) { voiceStatus(UI[lang].vmNoMic); return; }
  voiceMode = true; voiceMisses = 0; voiceRun += 1;
  stopReadAloud();
  const b = $("voiceMode");
  b.setAttribute("aria-pressed", "true");
  setVoiceModeLabel(UI[lang].voiceModeStop);
  voiceStatus(UI[lang].vmOn);
  voiceSay(UI[lang].vmOn, lang).then(voiceListen);
}
function stopVoiceMode() {
  if (!voiceMode) return;
  voiceMode = false; voiceRun += 1;
  stopListening();
  voiceStopSound();
  const b = $("voiceMode");
  b.setAttribute("aria-pressed", "false");
  setVoiceModeLabel(UI[lang].voiceMode);
  voiceStatus(UI[lang].vmOff);
  voiceTone(false);
  setTimeout(() => { if (!voiceMode) voiceStatus(""); }, 4000);
}
