// 10. The usage warning.
// «استخدمت 80% من حد الأسئلة… يتجدد بعد 12 دقيقة»: said by the server once four fifths of a limit are used
function showUsage(u) {
  const box = $("requestNotice");
  if (!u) { if (box.dataset.usage) { box.hidden = true; delete box.dataset.usage; } return; }
  const t = UI[lang] || UI.ar;
  const wait = t.minutes.replace("{n}", Math.max(1, Math.ceil(u.resets_in / 60)));
  box.textContent = t.usageWarn.replace("{pct}", Math.round(100 * u.used / u.limit)).replace("{used}", u.used)
    .replace("{limit}", u.limit).replace("{wait}", wait);
  box.dataset.usage = "1";
  box.hidden = false;
}

// Sending a question: show it, wait for the answer, render it, keep it, and say what went wrong when it fails.
$("ask").addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = $("q").value.trim();
  if (!question || $("send").disabled) return;  // one question at a time: Enter must not send a second
  // Dismiss the mobile keyboard before painting the source-search indicator.
  if (isMobileLayout()) $("q").blur();
  const askedBySpeech = spokenTurn;
  spokenTurn = false;
  stopListening();
  const conversation = activeConversation;
  conversation.awaitingReply = false;
  syncPlaceholder();
  const override = nextAsk;  // «وضّح أكثر» asks once in the detailed style; the chosen style stays as it was
  nextAsk = null;
  const style = override?.style || $("style").value;
  const requestLang = lang;
  const requestHistory = override?.history ? override.history.slice() : conversation.turns.slice();
  const context = { conversation, question, style, lang: requestLang, history: requestHistory };
  $("empty")?.remove();
  const userMessage = el("div", "turn-user", question);
  userMessage.dir = "auto";
  conversation.messages.push(userMessage);
  conversation.updatedAt = Date.now();
  if (conversation.messages.length === 1) {
    const title = question.replace(/\s+/g, " ").trim();
    conversation.title = title.length > 42 ? `${title.slice(0, 41).trimEnd()}…` : title;
    updateConversationTitle();
    renderHistory();
  }
  appendThreadMessage($("thread"), userMessage);
  const pending = createRiderStatus(requestLang);
  conversation.messages.push(pending);
  syncRegenerateButtons();
  conversation.updatedAt = Date.now();
  $("thread").append(pending);
  const request = beginAnswerRequest({ kind: "question", conversation, pending, userMessage, question });
  setQuestionText("");
  scrollDown();
  try {
    lastAskStatus = 0;
    const payload = { question, style, lang: requestLang, history: requestHistory };
    if (override?.asQuestion) payload.as_question = true;
    const res = await askStreamed(payload, request.controller.signal, pending);
    showUsage(res.usage);
    if (request.cancelled) return;
    await completeRiderStatus(pending, res, requestLang);
    if (request.cancelled) return;
    const msg = renderAnswer(res, style, context);
    const pendingIndex = conversation.messages.indexOf(pending);
    if (pendingIndex >= 0) conversation.messages[pendingIndex] = msg;
    pending.replaceWith(msg);
    if (!(askedBySpeech && voiceMode)) typeAnswer(msg);
    if (askedBySpeech && voiceMode) voiceRead(res);  // voice mode: the answer, its sources, then listen again
    else if (askedBySpeech && msg.listen && !msg.querySelector(".confirm-body[hidden]")) msg.listen.play();  // spoken question: spoken reply
    // answers and Muhawir's offers (e.g. "shall I explain it more simply?") are remembered, so a follow-up
    // or a "yes" is understood; refusals, errors and "not found" are not answers to explain again
    if (res.status === "quote") {  // a follow-up («ما معناه؟») is about the text that was found
      remember(conversation, "user", question);
      remember(conversation, "assistant", (res.quote?.matches?.[0]?.excerpt) || "");
    } else if (rememberable(res)) {
      remember(conversation, "user", res.understood || question);
      // a referral keeps its offer of the general rulings, so a typed «نعم» is read as the reply to it
      const offered = res.status === "referred" && (res.claims || []).length ? (UI[replyLangOf(res)] || UI[lang]).generalInfo : "";
      remember(conversation, "assistant", [(res.message || "").split("\n")[0], offered || (res.claims || []).map((c) => c.text).join(" "),
        res.follow_up].filter(Boolean).join(" "));
    }
    conversation.awaitingReply = Boolean(res.follow_up || (res.choices || []).length
      || (res.status === "referred" && (res.claims || []).length));
    syncPlaceholder();
    logAnswer(conversation, context, res);
    syncRegenerateButtons();
  } catch (error) {
    if (request.cancelled) return;
    lastAskStatus = error?.status || 0;
    const errorMessage = el("div", "msg", lastAskStatus === 429 ? UI[lang].tooMany : UI[lang].error);
    const pendingIndex = conversation.messages.indexOf(pending);
    if (pendingIndex >= 0) conversation.messages[pendingIndex] = errorMessage;
    pending.replaceWith(errorMessage);
    syncRegenerateButtons();
    if (activeConversation === conversation && !$("q").value.trim()) setQuestionText(question);
    if (askedBySpeech && voiceMode) voiceSay(lastAskStatus === 429 ? UI[lang].tooMany : UI[lang].error).then(voiceListen);
  } finally {
    finishAnswerRequest(request);
  }
});

$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("ask").requestSubmit(); }
});

// 11. Voice input: the browser's own speech recognition (Chrome, Edge, Safari). Hidden where unavailable.
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
function stopListening() { if (recognizer && recognizing) recognizer.stop(); }
if (Recognition) {
  $("mic").hidden = false;
  $("mic").addEventListener("click", () => {
    if (recognizing) { stopListening(); return; }
    $("voiceNote").hidden = false;
    recognizer = new Recognition();
    recognizer.lang = { ar: "ar-SA", en: "en-US", ur: "ur-PK" }[lang] || "ar-SA";
    recognizer.interimResults = true;
    recognizer.continuous = false;
    stopReadAloud();  // stop reading the last reply while the user speaks
    const before = $("q").value.trim();
    let heard = false;
    recognizer.onresult = (ev) => {
      const said = Array.from(ev.results).map((r) => r[0].transcript).join(" ");
      setQuestionText((before ? before + " " : "") + said);
      heard = Boolean(said.trim());
    };
    let failed = false;
    recognizer.onerror = () => { failed = true; };
    recognizer.onend = () => {
      recognizing = false;
      $("mic").setAttribute("aria-pressed", "false");
      $("mic").lastElementChild.textContent = UI[lang].mic;
      // the user talked: send what was heard and answer by voice, like a conversation
      if (heard && !failed && $("q").value.trim()) { spokenTurn = true; $("ask").requestSubmit(); }
      else if (voiceMode) voiceMissed();
    };
    recognizing = true;
    $("mic").setAttribute("aria-pressed", "true");
    $("mic").lastElementChild.textContent = UI[lang].micStop;
    recognizer.start();
  });
}

// The voice mode (22 October 2026), for a listener who cannot see the page: one button, then a spoken conversation.
// It listens after a short tone, sends what was heard, reads the answer, then each source (a verse in the reciter's
// own voice, Mishary Alafasy, with its approved translation in English or Urdu; any other text read aloud as it is),
// and listens again. Every step is also said in a live region, so a screen reader announces it. Escape stops it.
let voiceMode = false, voiceMisses = 0, voiceRun = 0;
function setVoiceModeLabel(text) {  // the button's name is read by screen readers even where its label is hidden
  const b = $("voiceMode");
  b.lastElementChild.textContent = text;
  b.setAttribute("aria-label", text);
  b.title = text;
}
const VOICE_SOURCES = 3;  // the first sources only: the rest stay on the page
function voiceStatus(text) {
  const box = $("voiceStatus");
  box.hidden = !text;
  box.textContent = text || "";
}
function voiceTone(high = true) {  // a short tone: «speak now» (high) or «stopped» (low)
  try {
    const ctx = voiceTone.ctx || (voiceTone.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.frequency.value = high ? 880 : 440;
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.26);
  } catch { /* no sound: the live region still says it */ }
  return new Promise((resolve) => setTimeout(resolve, 300));
}
function textLang(text) {
  if (/[ٹڈڑںھہےۓ]/.test(text)) return "ur";
  return /[؀-ۿ]/.test(text) ? "ar" : "en";
}
let voiceAudio = null;
function voiceStopSound() {
  if (voiceAudio) { voiceAudio.pause(); voiceAudio = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
function playUrl(url) {
  return new Promise((resolve) => {
    const audio = new Audio(url);
    voiceAudio = audio;
    const done = () => { if (voiceAudio === audio) voiceAudio = null; resolve(); };
    audio.addEventListener("ended", done, { once: true });
    audio.addEventListener("error", done, { once: true });
    audio.play().catch(done);
  });
}
// one piece of text aloud: the natural voice the listener chose when the server has it, else the browser's own
let voiceNoticeAt = 0;
function voiceNoVoice(speakLang) {  // said on the page, at most every 20 seconds
  if (Date.now() - voiceNoticeAt < 20000) return;
  voiceNoticeAt = Date.now();
  const note = $("requestNotice");
  note.textContent = (UI[speakLang] || UI[lang]).noVoice;
  note.hidden = false;
  setTimeout(() => { if (note.textContent === (UI[speakLang] || UI[lang]).noVoice) note.hidden = true; }, 9000);
}
async function voiceSay(text, speakLang = textLang(text)) {
  const run = voiceRun;
  // a verse quoted inside a passage (between ﴿﴾ or {}) is never read by a synthetic voice, in any language
  const mark = { ar: "(آية)", ur: "(آیت)" }[speakLang] || "(verse)";
  text = (text || "").replace(/﴿[^﴾]*(?:﴾|$)/g, mark).replace(/\{[^}]*(?:\}|$)/g, mark).trim();
  if (!text) return;
  if (text.length > 1500) text = text.slice(0, 1490).replace(/\s+\S*$/, "") + "…";
  if (document.body.classList.contains("natural-voice")) {
    const named = VOICE_LIST[speakLang] || [];
    const stored = storedVoice(speakLang);
    const voice = named.some((v) => v.id === stored) ? stored : selectedSpeechVoice;
    try {
      const r = await fetch("/tts", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, voice, lang: speakLang }) });
      if (r.ok) {
        const url = URL.createObjectURL(await r.blob());
        if (run === voiceRun) await playUrl(url);
        URL.revokeObjectURL(url);
        return;
      }
    } catch { /* the browser's voice below */ }
  }
  if (!("speechSynthesis" in window) || run !== voiceRun) return;
  const voice = pickVoice(await voicesReady(), speakLang, selectedSpeechVoice);
  if (!voice) {
    // No voice for this language on the device: a voice of another language would read only the digits, in English
    voiceNoVoice(speakLang);
    return;
  }
  for (const part of pieces(text)) {
    if (run !== voiceRun) return;
    await new Promise((resolve) => {
      const u = new SpeechSynthesisUtterance(part);
      u.voice = voice; u.lang = voice.lang;
      u.onend = resolve; u.onerror = resolve;
      setTimeout(resolve, 4000 + part.length * 120);  // a browser that never says it finished does not stop the turn
      speechSynthesis.speak(u);
    });
  }
}
async function voiceListen() {
  if (!voiceMode) return;
  if (recognizing) return;
  voiceStatus(UI[lang].vmListening);
  await voiceTone(true);
  if (voiceMode && !recognizing) $("mic").click();
}
async function voiceMissed() {  // silence or nothing understood: say so and listen again, twice at most
  voiceMisses += 1;
  if (voiceMisses > 2) { stopVoiceMode(); return; }
  voiceStatus(UI[lang].vmNotHeard);
  await voiceSay(UI[lang].vmNotHeard, lang);
  voiceListen();
}
async function voiceRead(res) {
  const run = voiceRun, t = UI[lang] || UI.ar;
  voiceMisses = 0;
  voiceStatus(t.vmReading);
  const said = spokenText(res);
  if (said) await voiceSay(said);
  for (const s of (res.sources || []).slice(0, VOICE_SOURCES)) {
    if (run !== voiceRun || !voiceMode) return;
    const where = (s.location || "").includes(s.source_name) ? s.location : `${s.source_name}، ${s.location}`;
    await voiceSay(`${t.source}: ${where}`, lang);
    const ayah = s.kind === "quran" && /^q:(\d{1,3}):(\d{1,3})$/.exec(s.passage_id || "");
    if (ayah) {  // a verse is heard only in a reciter's real voice, never a synthetic one
      await playUrl(`https://everyayah.com/data/Alafasy_128kbps/${ayah[1].padStart(3, "0")}${ayah[2].padStart(3, "0")}.mp3`);
      if (s.translation) await voiceSay(`${t.vmTranslation} ${s.translation}`);
    } else if (s.kind !== "quran") {
      await voiceSay(s.quote);  // a verse quoted inside it (between ﴿﴾ or {}) is left out by the server
    }
  }
  if (run === voiceRun && voiceMode) voiceListen();
}
function startVoiceMode() {
  if (!Recognition) { voiceStatus(UI[lang].vmNoMic); return; }
  voiceMode = true; voiceMisses = 0; voiceRun += 1;
  stopReadAloud();
  const b = $("voiceMode");
  b.setAttribute("aria-pressed", "true");
  setVoiceModeLabel(UI[lang].voiceModeStop);
  voiceStatus(UI[lang].vmOn);
  voiceSay(UI[lang].vmOn, lang).then(voiceListen);
}
function stopVoiceMode() {
  if (!voiceMode) return;
  voiceMode = false; voiceRun += 1;
  stopListening();
  voiceStopSound();
  const b = $("voiceMode");
  b.setAttribute("aria-pressed", "false");
  setVoiceModeLabel(UI[lang].voiceMode);
  voiceStatus(UI[lang].vmOff);
  voiceTone(false);
  setTimeout(() => { if (!voiceMode) voiceStatus(""); }, 4000);
}
$("voiceMode").hidden = false;
$("voiceMode").addEventListener("click", () => (voiceMode ? stopVoiceMode() : startVoiceMode()));
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && voiceMode) stopVoiceMode(); });

fetch("/api/health").then((r) => r.json()).then((h) => {
  $("synthetic").hidden = !h.synthetic;
  // the natural voice (and its notice that the text goes to Microsoft) only when the server has it configured
  document.body.classList.toggle("natural-voice", Boolean(h.tts));
  if (h.tts) fetch("/api/voices").then((r) => r.json()).then((v) => { VOICE_LIST = v || {}; }).catch(() => {});
}).catch(() => {});
loadConversations();  // the conversations kept in this browser: listed in the history, nothing is asked again
renderHistory();
applyLang();
fitQuestionBox();

popList($("lang"), $("langButton"), $("langPop"));
appearancePanel();
applyTextSize();
mcpConnect();
</script>
</body>
</html>
