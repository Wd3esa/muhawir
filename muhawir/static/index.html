<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>مُحاور</title>
<script>try { const z = parseFloat(localStorage.getItem("muhawir-text-size")); if (z >= .9 && z <= 1.5) document.documentElement.style.setProperty("--text-zoom", z); } catch {}</script>
<script>try { document.documentElement.dataset.theme = localStorage.getItem("muhawir-theme") === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
<style>
@font-face {
  font-family:"Muhawir Arabic";
  src:url("/fonts/NotoSansArabic-Regular.ttf") format("truetype");
  font-style:normal;
  font-weight:400;
  font-display:swap
}
@font-face {
  font-family:"Muhawir Arabic";
  src:url("/fonts/NotoSansArabic-Bold.ttf") format("truetype");
  font-style:normal;
  font-weight:700;
  font-display:swap
}

  :root {
  color-scheme:light;
  --bg:#F7F5FE;
  --panel:#FFFFFF;
  --sidebar:#F2F4FF;
  --ink:#0E153F;
  --muted:#4A5590;
  --muted-soft:#6676A5;
  --line:#7583AA;
  --accent:#6150EA;
  --accent-ink:#FFFFFF;
  --accent-soft:#E0D9FB;
  --mint:#2EF2C2;
  --deep:#12183F;
  --indigo:#2D3775;
  --warn-bg:#E0D9FB;
  --warn-ink:#2D3775;
  --card:#FFFFFF;
  --mine:#E0D9FB;
  --shadow:0 10px 34px rgba(18,24,63,.09);
  --focus:#6150EA;
  --glow-mint:rgba(46,242,194,.36);
  --glow-violet:rgba(97,80,234,.29)
}

:root[data-theme="dark"] {
    color-scheme:dark;
    --bg:#171D36;
    --panel:#222A49;
    --sidebar:#1D2544;
    --ink:#F7F8FF;
    --muted:#D9E0F4;
    --muted-soft:#BAC6E7;
    --line:#8E9CC7;
    --accent:#C5BAFF;
    --accent-ink:#171D36;
    --accent-soft:#343B6B;
    --mint:#77DECA;
    --deep:#171D36;
    --indigo:#D9E0F4;
    --warn-bg:#39365F;
    --warn-ink:#F7F8FF;
    --card:#222A49;
    --mine:#343B6B;
    --shadow:0 10px 34px rgba(0,0,0,.25);
    --focus:#C5BAFF;
    --glow-mint:rgba(119,222,202,.24);
    --glow-violet:rgba(160,139,255,.30)
}

  * {
  box-sizing:border-box
}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.75 "Muhawir Arabic",system-ui,Tahoma,sans-serif
}
button,textarea,select {
  font:inherit
}
button {
  color:inherit
}
button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible {
  outline:3px solid var(--focus);
  outline-offset:2px
}

  .app-shell {
  min-height:var(--chat-viewport-height,100dvh);
  display:grid;
  grid-template-columns:286px minmax(0,1fr)
}
.sidebar {
  min-width:0;
  height:var(--chat-viewport-height,100dvh);
  position:sticky;
  top:0;
  display:flex;
  flex-direction:column;
  padding:22px 16px 14px;
  background:var(--sidebar);
  border-inline-end:1px solid var(--line);
  z-index:5
}
.sidebar-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:11px;
  padding:0 6px 22px
}
.brand-lockup {
  min-width:0;
  display:flex;
  align-items:center;
  gap:11px
}
.brand-mark {
  width:42px;
  height:42px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:var(--accent);
  background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 13%,transparent);
  border-radius:15px
}
.brand-mark svg {
  width:24px;
  height:24px
}
.brand-name {
  margin:0;
  font-family:Tahoma,"Segoe UI",sans-serif;
  font-size:21px;
  line-height:1.25;
  font-weight:700;
  letter-spacing:normal
}
.brand-caption {
  margin:3px 0 0;
  color:var(--muted);
  font-size:12px;
  line-height:1.4
}
.icon-button {
  width:40px;
  height:40px;
  display:inline-grid;
  place-items:center;
  flex:0 0 auto;
  border:1px solid transparent;
  border-radius:13px;
  background:transparent;
  cursor:pointer;
  color:var(--muted)
}
.icon-button:hover {
  color:var(--ink);
  background:color-mix(in srgb,var(--accent) 8%,transparent)
}
.theme-toggle {
  border-color:var(--line);
  background:var(--panel);
  color:var(--accent)
}
.theme-toggle svg { width:19px; height:19px }
.theme-toggle .theme-sun { display:none }
:root[data-theme="dark"] .theme-toggle .theme-moon { display:none }
:root[data-theme="dark"] .theme-toggle .theme-sun { display:block }
.icon-button svg {
  width:20px;
  height:20px
}
.sidebar-close {
  display:none
}
.history-toggle {
  display:inline-grid
}
@media(min-width:861px) {
  .app-shell { transition:grid-template-columns .22s ease }
  .app-shell.sidebar-collapsed { grid-template-columns:0 minmax(0,1fr) }
  .app-shell.sidebar-collapsed .sidebar { display:none }
  .app-shell.sidebar-collapsed .workspace { grid-column:2 }
}

  .new-chat {
  width:100%;
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  border:0;
  border-radius:15px;
  background:var(--accent);
  color:var(--accent-ink);
  font-weight:650;
  cursor:pointer;
  box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 18%,transparent);
  transition:transform .16s ease,box-shadow .16s ease
}
.new-chat:hover {
  transform:translateY(-1px);
  box-shadow:0 7px 16px color-mix(in srgb,var(--accent) 21%,transparent)
}
.new-chat svg {
  width:19px;
  height:19px
}
.history-heading {
  margin:28px 8px 10px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em
}
.history-search {
  height:42px;
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--line);
  border-radius:13px;
  padding:0 11px;
  color:var(--muted);
  background:color-mix(in srgb,var(--panel) 70%,transparent)
}
.history-search svg {
  width:17px;
  height:17px;
  flex:0 0 auto
}
.history-search input {
  min-width:0;
  width:100%;
  border:0;
  outline:0;
  color:var(--ink);
  background:transparent;
  font-size:13px
}
.history-search input::placeholder {
  color:var(--muted);
  opacity:.9
}
.history-list {
  display:flex;
  flex-direction:column;
  gap:4px;
  overflow:auto;
  margin-top:12px
}
.history-item {
  display:flex;
  align-items:center;
  gap:9px;
  min-height:43px;
  width:100%;
  padding:7px 10px;
  border:1px solid transparent;
  border-radius:12px;
  background:transparent;
  text-align:start;
  cursor:pointer;
  color:var(--muted);
  font-size:13px
}
.history-row {
  display:flex;
  align-items:center;
  gap:2px
}
.history-row .history-item {
  flex:1;
  min-width:0
}
.history-tool {
  flex:0 0 auto;
  width:32px;
  height:32px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:var(--muted);
  font-size:15px;
  cursor:pointer
}
.history-tool:hover,.history-tool:focus-visible {
  color:var(--ink);
  background:color-mix(in srgb,var(--panel) 72%,transparent)
}
.history-tool[aria-pressed="true"] {
  color:var(--accent)
}
.history-delete-all {
  margin:10px 7px 0;
  padding:6px 8px;
  border:0;
  background:transparent;
  color:var(--muted);
  font:inherit;
  font-size:12px;
  text-decoration:underline;
  cursor:pointer
}
.history-item:hover {
  background:color-mix(in srgb,var(--panel) 72%,transparent);
  color:var(--ink)
}
.history-item[aria-current="true"] {
  color:var(--ink);
  background:color-mix(in srgb,var(--panel) 90%,transparent);
  border-color:var(--line);
  box-shadow:0 2px 8px rgba(35,60,48,.035)
}
.history-item svg {
  width:17px;
  height:17px;
  flex:0 0 auto;
  opacity:.72
}
.history-item span {
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}
.history-empty {
  margin:12px 7px;
  color:var(--muted);
  font-size:12px;
  line-height:1.7
}
.sidebar-spacer {
  flex:1;
  min-height:20px
}
.sidebar-note {
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:12px 10px 4px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
  line-height:1.65
}
.sidebar-note svg {
  width:17px;
  height:17px;
  flex:0 0 auto;
  margin-top:2px;
  color:var(--accent)
}

  .workspace {
  position:relative;
  isolation:isolate;
  min-width:0;
  height:var(--chat-viewport-height,100dvh);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--bg)
}
.ambient {
  position:absolute;
  inset:0;
  z-index:-1;
  overflow:hidden;
  pointer-events:none;
  background:radial-gradient(ellipse 60% 45% at 92% 8%,var(--glow-mint),transparent 78%),radial-gradient(ellipse 65% 54% at 5% 65%,var(--glow-violet),transparent 78%)
}
.ambient::before,.ambient::after {
  content:"";
  position:absolute;
  width:min(92vw,860px);
  height:min(65vh,680px);
  border-radius:50%;
  filter:blur(32px);
  opacity:.34;
  transition:opacity .65s ease
}
.ambient::before {
  top:-26%;
  right:-24%;
  background:radial-gradient(ellipse,var(--glow-mint),transparent 72%)
}
.ambient::after {
  bottom:-32%;
  left:-24%;
  background:radial-gradient(ellipse,var(--glow-violet),transparent 72%)
}
.workspace:has(.rider-status.is-searching) .ambient::before {
  opacity:.92;
  will-change:transform;
  animation:ambient-drift-a 8s ease-in-out infinite alternate
}
.workspace:has(.rider-status.is-searching) .ambient::after {
  opacity:.86;
  will-change:transform;
  animation:ambient-drift-b 10s ease-in-out infinite alternate
}
.workspace:has(.rider-status.is-searching) #ask {
  box-shadow:var(--shadow),0 0 34px color-mix(in srgb,var(--accent) 20%,transparent)
}
@keyframes ambient-drift-a {
  from { transform:translate3d(0,0,0) scale(1) }
  to { transform:translate3d(-19vw,19vh,0) scale(1.2) }
}
@keyframes ambient-drift-b {
  from { transform:translate3d(0,0,0) scale(1) }
  to { transform:translate3d(19vw,-17vh,0) scale(1.18) }
}
.topbar {
  flex:0 0 auto;
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:0 clamp(18px,3.4vw,48px);
  border-bottom:1px solid var(--line);
  background:var(--sidebar)
}
.topbar-start,.topbar-tools {
  min-width:0;
  display:flex;
  align-items:center;
  gap:12px
}
.topbar h1 {
  max-width:min(52vw,570px);
  margin:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:16px;
  line-height:1.4;
  font-weight:650
}
.trust-pill {
  display:inline-flex;
  align-items:center;
  gap:7px;
  white-space:nowrap;
  border:1px solid color-mix(in srgb,var(--accent) 14%,transparent);
  border-radius:100px;
  padding:6px 10px;
  color:var(--accent);
  background:color-mix(in srgb,var(--panel) 58%,transparent);
  font-size:11px;
  font-weight:650
}
.trust-pill svg {
  width:15px;
  height:15px
}
.pop-wrap { position:relative; display:inline-block; }
.lang-pop { margin-inline-start:auto; }
.pop-list, .pop-panel { position:absolute; z-index:40; top:calc(100% + 6px); margin:0; padding:4px; list-style:none; background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.14); min-width:150px; }
.lang-pop .pop-list { inset-inline-end:0; }
.pop-list[hidden], .pop-panel[hidden], .appearance-pop .pop-panel[hidden] { display:none !important; }
.pop-item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 11px; border-radius:8px; font-size:14px; color:var(--ink); cursor:pointer; }
.pop-item:hover, .pop-item:focus-visible { background:var(--accent-soft); outline:none; }
.pop-item[aria-selected="true"] { color:var(--accent); font-weight:650; }
.pop-item[aria-selected="true"]::after { content:"\2713"; font-size:12px; }
.pop-item[lang="ur"] { font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Alvi Nastaleeq",inherit; line-height:1.9; }
.verify-go { margin-top:10px; padding:9px 18px; font:inherit; color:#fff; background:var(--accent); border:0; border-radius:10px; cursor:pointer; }
.mic.attach span { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.verify-verdict { font-weight:700; }
.verify-verdict[data-tone="exact"] { color:var(--status-found,#16a34a); }
.verify-verdict[data-tone="close"] { color:var(--accent); }
.verify-verdict[data-tone="none"] { color:var(--status-missing,#6b7280); }
.verify-card { padding:10px 12px; border:1px solid var(--line); border-radius:10px; }
.verify-card .where { font-size:13px; opacity:.85; margin-top:6px; }
.verify-answer { display:flex; gap:10px; margin-top:10px; }
.verify-no { padding:9px 18px; font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:10px; cursor:pointer; }
.verify-passage { margin:8px 0 0; line-height:2; }
.verify-passage strong { font-weight:800; background:color-mix(in srgb,var(--accent) 16%,transparent); border-radius:4px; padding:0 2px; }
.verify-side { margin-top:8px; font-size:13px; line-height:1.9; opacity:.7; }
.verify-side p { margin:2px 0 0; }
.verify-side-label { font-size:12px; font-weight:700; }
.verify-card q { display:block; margin-top:6px; line-height:1.9; quotes:none; }
.sidebar-preferences { display:flex; flex-direction:column; gap:6px; }
.sidebar-preferences .side-tool, .sidebar-preferences .voice-mode { display:flex; align-items:center; gap:10px; width:100%; min-height:40px; padding:8px 12px; font:inherit; font-size:14px; color:var(--ink); background:transparent; border:1px solid transparent; border-radius:10px; cursor:pointer; }
.sidebar-preferences .side-tool:hover, .sidebar-preferences .voice-mode:hover { background:color-mix(in srgb,var(--accent) 8%,transparent); }
.sidebar-preferences .voice-mode span { position:static; width:auto; height:auto; overflow:visible; clip:auto; }
.sidebar-preferences .voice-mode[aria-pressed="true"] { background:var(--accent-soft); color:var(--accent); }
.sidebar-preferences svg { width:19px; height:19px; flex:none; color:var(--accent); }
.appearance-pop { width:100%; }
.appearance-pop .pop-panel[hidden] { display:none; }
.appearance-pop .pop-panel { inset-inline:0; bottom:calc(100% + 6px); top:auto; display:grid; gap:10px; padding:10px; }
.seg { display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:3px; background:color-mix(in srgb,var(--accent) 7%,transparent); border-radius:10px; }
.seg button { padding:7px 4px; font:inherit; font-size:13px; color:var(--ink); background:transparent; border:0; border-radius:8px; cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--panel); color:var(--accent); font-weight:650; box-shadow:0 1px 3px rgba(0,0,0,.12); }
.dots { display:flex; justify-content:center; gap:12px; }
.dots button { width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer; box-shadow:0 0 0 1px var(--line); }
.dots button[aria-pressed="true"] { border-color:var(--panel); box-shadow:0 0 0 2px var(--accent); }
.appearance-pop .theme-toggle { width:100%; height:auto; display:flex; align-items:center; justify-content:flex-start; gap:10px; padding:8px 10px; font:inherit; font-size:13px; border-radius:10px; }
.lang-wrap {
  display:flex;
  align-items:center
}
.sr-only {
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap
}
.topbar select {
  max-width:100%;
  color:var(--ink);
  background:color-mix(in srgb,var(--panel) 70%,transparent);
  border:1px solid var(--line);
  border-radius:11px;
  padding:7px 9px;
  font-size:12px
}
.synthetic {
  flex:0 0 auto;
  margin:12px auto 0;
  width:min(850px,calc(100% - 40px));
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:color-mix(in srgb,var(--warn-bg) 83%,transparent);
  color:var(--warn-ink);
  font-size:12px;
  line-height:1.5
}

  .conversation-frame {
  position:relative;
  z-index:1;
  width:100%;
  max-width:1000px;
  min-height:0;
  flex:1;
  display:flex;
  flex-direction:column;
  align-self:center;
  padding:0 clamp(18px,4vw,58px)
}
#thread {
  min-height:0;
  flex:1;
  display:flex;
  flex-direction:column;
  gap:18px;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:24px 2px 22px;
  scroll-behavior:smooth
}
.empty-state {
  width:100%;
  margin:auto;
  padding:36px 0 48px;
  text-align:center;
  animation:arrive .55s ease both
}
.kids-list {
  list-style:none;
  margin:4px 0 10px;
  padding:0;
  display:grid;
  gap:10px
}
.kids-list li {
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:10px 12px;
  border-radius:14px;
  background:color-mix(in srgb,var(--accent) 7%,transparent);
  line-height:1.8
}
.kids-icon {
  flex:none;
  font-size:1.35em;
  line-height:1.4
}
.welcome-wordmark {
  width:min(430px,84%);
  margin:0 auto 3px;
  color:var(--accent);
  line-height:0
}
.welcome-wordmark svg {
  display:block;
  width:100%;
  height:auto;
  overflow:visible;
  filter:drop-shadow(0 7px 18px color-mix(in srgb,var(--accent) 18%,transparent))
}
.welcome-kicker {
  display:inline-block;
  position:relative;
  margin:0 auto 25px;
  color:var(--accent);
  font-size:17px;
  font-weight:700;
  letter-spacing:0;
  line-height:1.6;
  white-space:nowrap
}
.welcome-kicker-measure { visibility:hidden }
.welcome-kicker-typed {
  position:absolute;
  inset:0;
  text-align:start
}
.welcome-kicker.is-typing .welcome-kicker-typed::after {
  content:"";
  display:inline-block;
  width:2px;
  height:.95em;
  margin-inline-start:3px;
  vertical-align:-.13em;
  background:currentColor;
  animation:welcome-caret .7s steps(1,end) infinite
}
@keyframes welcome-caret {
  50% { opacity:0 }
}
.prompt-grid {
  max-width:720px;
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:11px;
  text-align:start
}
.suggestion {
  min-height:98px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--panel);
  box-shadow:0 4px 16px rgba(45,70,58,.025);
  cursor:pointer;
  text-align:start;
  transition:border-color .16s ease,transform .16s ease,background .16s ease
}
.suggestion:hover {
  transform:translateY(-2px);
  border-color:color-mix(in srgb,var(--accent) 31%,var(--line));
  background:color-mix(in srgb,var(--panel) 90%,transparent)
}
.suggestion-topic {
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--accent);
  font-size:11px;
  font-weight:700
}
.suggestion-topic:before {
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--accent)
}
.suggestion-text {
  color:var(--ink);
  font-size:12px;
  line-height:1.7
}

  .turn-user {
  align-self:flex-start;
  max-width:min(78%,690px);
  border:1px solid color-mix(in srgb,var(--accent) 8%,transparent);
  border-radius:18px 18px 5px 18px;
  padding:11px 17px;
  white-space:pre-line;
  background:var(--mine);
  color:var(--ink);
  box-shadow:0 3px 12px rgba(44,67,56,.035);
  animation:arrive .25s ease both
}
.msg {
  align-self:stretch;
  padding:20px 22px;
  border:1px solid color-mix(in srgb,var(--line) 78%,transparent);

:root[data-theme="dark"] .workspace { background:var(--night-stars-few),var(--night-sky); }
:root[data-theme="dark"] .workspace:has(#thread > .empty-state) { background:var(--night-stars),var(--night-sky); }
:root[data-theme="dark"] .workspace:has(#thread > .empty-state) #ask { border-color:rgba(255,255,255,.12); }
:root[data-theme="dark"] .home-hero::before { content:""; position:absolute; left:50%; top:calc(var(--wm) * .33); width:calc(var(--wm) * 1.25); aspect-ratio:1; translate:-50% -50%; border-radius:50%; background:radial-gradient(circle,rgba(255,240,205,.16) 0%,rgba(255,240,205,.07) 38%,rgba(160,215,235,.04) 55%,transparent 70%); pointer-events:none; animation:home-fade 1.2s ease-out 1.6s both; }
:root[data-theme="dark"] .workspace:has(#thread > .empty-state) .ambient { background:var(--night-twinkle); animation:night-twinkle 4.5s ease-in-out infinite alternate; }
#thread { overflow-x:hidden; }
:root[data-theme="dark"] .empty-state .welcome-wordmark { color:var(--moon); }
:root[data-theme="dark"] .empty-state .welcome-wordmark svg { filter:drop-shadow(0 0 6px rgba(255,238,200,.55)) drop-shadow(0 0 22px rgba(255,232,185,.28)); }
@keyframes night-twinkle { from { opacity:.25; } to { opacity:1; } }
@media(prefers-reduced-transparency:reduce),(prefers-contrast:more),(forced-colors:active) {
  .workspace:has(#thread > .empty-state),:root[data-theme="dark"] .workspace,:root[data-theme="dark"] .workspace:has(#thread > .empty-state) { background:var(--bg); }
  :root[data-theme="dark"] .home-hero::before { content:none; }
  :root[data-theme="dark"] .workspace:has(#thread > .empty-state) .ambient { background:none; animation:none; }
  :root[data-theme="dark"] .empty-state .welcome-wordmark svg { filter:none; }
}
@media (prefers-reduced-motion:reduce) { :root[data-theme="dark"] .workspace:has(#thread > .empty-state) .ambient { animation:none; opacity:.7; } :root[data-theme="dark"] .home-hero::before { animation:none; } }

// The part of a location that says where in the book: a volume and page («ج23، ص383-385»), a number («رقم 12»), or a
// short chapter name; a long location (a whole fatwa question) is left to the line under the text.
function shortPlace(location) {
  const text = String(location || "");
  if (text.length <= 40) return text;  // short already: «سورة البقرة، الآية 255»
  const page = text.match(/\(?\s*(ج\s*\d+[^)]{0,30}ص\s*[\d\-–]+|ص\s*[\d\-–]+)\s*\)?/);
  if (page) return page[1].trim();

async function askStreamed(payload, signal, pending) {
  const body = JSON.stringify(payload);
  const headers = { "Content-Type": "application/json" };
  let r = await fetch("/api/ask_stream", { method: "POST", headers, body, signal });
  if (r.status === 404 || r.status === 405 || !r.body) {  // an older server: the whole reply at once
    r = await fetch("/api/ask", { method: "POST", headers, body, signal });
    if (!r.ok) throw Object.assign(new Error(r.status), { status: r.status });
    return r.json();
  }
  if (!r.ok) throw Object.assign(new Error(r.status), { status: r.status });
  const reader = r.body.getReader(), decoder = new TextDecoder();
  let buffer = "", reply = null;
  const take = (line) => {
    if (!line.trim()) return;
    const item = JSON.parse(line);
    if (item.stage === "queued" && pending?.classList.contains("is-searching")) {
      // every answer slot is busy: the question waits its turn (Queued-stage)
      pending.dataset.live = "1";
      pending.dataset.queued = "1";
      translateSearchStatus(pending, lang);
    } else if (item.stage === "looking" && pending?.classList.contains("is-searching")) {
      // Search-line: what is looked for and in which field's books («أبحث في كتب الفقه: كيف أتوضأ؟»), not every
      // book's name in turn (November 2026)
      delete pending.dataset.queued;
      pending.dataset.live = "1";
      pending.dataset.stage = "1";
      pending._looking = item.data || {};
      translateSearchStatus(pending, lang);
    } else if (item.stage === "source" && pending?.classList.contains("is-searching")) {
      delete pending.dataset.queued;
      pending.dataset.live = "1";
      pending._consulted = (item.data || []).length;  // counted for «بحثتُ في …» above the answer
    } else if (item.stage in STREAM_STAGES && pending?.classList.contains("is-searching")) {
      pending.dataset.live = "1";
      delete pending.dataset.queued;
      pending.dataset.stage = String(STREAM_STAGES[item.stage]);
      translateSearchStatus(pending, lang);
    } else if (item.reply) reply = item.reply;
    else if (item.error) throw Object.assign(new Error(item.error), { status: item.error });
  };
  for (;;) {
    const { done, value } = await reader.read();
    buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
    const lines = buffer.split("\n");
    buffer = lines.pop();
    lines.forEach(take);
    if (done) break;
  }
  take(buffer);
  if (!reply) throw new Error("no reply");
  if (pending?._consulted) reply._consulted = pending._consulted;
  return reply;
}
// Index-answer typing: the checked answer appears as if being typed, in about two seconds at most
function typeAnswer(msg) {
  if (welcomeMotion.matches || !msg.dataset.sourcedAnswer) return;
  const skip = ".answer-actions, .sources, details, button, [hidden], .source-cards";
  const nodes = [];
  msg.querySelectorAll("p.answer, h4.answer-section, li").forEach((box) => {
    if (box.closest(skip)) return;
    const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
    for (let n = walker.nextNode(); n; n = walker.nextNode()) {
      if (n.data.trim() && !n.parentElement.closest("sup")) nodes.push([n, n.data]);
    }
  });
  const total = nodes.reduce((sum, [, text]) => sum + text.length, 0);
  if (!total) return;
  nodes.forEach(([n]) => { n.data = ""; });
  const perFrame = Math.max(3, Math.ceil(total / 120));  // 120 frames, about two seconds
  let node = 0, shown = 0, frames = 0;
  const step = () => {
    let budget = perFrame;
    while (budget > 0 && node < nodes.length) {
      const [n, text] = nodes[node];
      const take = Math.min(budget, text.length - shown);
      shown += take; budget -= take;
      n.data = text.slice(0, shown);
      if (shown >= text.length) { node++; shown = 0; }
    }
    frames++;
    if (node < nodes.length) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

  const t = UI[locale] || UI.en;

    ? (pending.dataset.queued ? t.queued : lookingLine || t.thinking[stage]) : t[phase];

function typeWelcomeKicker() {
  window.clearTimeout(welcomeTypingTimer);
  const node = $("thread").querySelector(".welcome-kicker");
  if (!node) return;
  const typed = node.querySelector(".welcome-kicker-typed");
  const phrase = UI[lang].welcomeKicker;
  if (welcomeMotion.matches) {
    typed.textContent = phrase;
    node.classList.remove("is-typing");
    return;
  }
  const letters = typeof Intl.Segmenter === "function"
    ? Array.from(new Intl.Segmenter(lang, { granularity: "grapheme" }).segment(phrase), (part) => part.segment)
    : Array.from(phrase).reduce((parts, letter) => {
      if (/\p{Mark}/u.test(letter) && parts.length) parts[parts.length - 1] += letter;
      else parts.push(letter);
      return parts;
    }, []);
  typed.textContent = "";
  node.classList.add("is-typing");
  let index = 0;
  const write = () => {
    if (!typed.isConnected) return;
    typed.textContent += letters[index++];
    if (index < letters.length) welcomeTypingTimer = window.setTimeout(write, letters[index] === " " ? 120 : 72);
    else {
      node.classList.remove("is-typing");
      welcomeTypingTimer = null;
    }
  };
  welcomeTypingTimer = window.setTimeout(write, 250);
}

// what comes before and after in the book. «اسأل عنه» sends the same text again as a question to be answered.
function renderQuote(res, context) {
  const t = UI[lang], body = res.quote || { status: "not_found", matches: [] };
  const msg = el("div", "msg quote-reply");
  const add = (parent, tag, text, cls) => { const n = document.createElement(tag); if (cls) n.className = cls; n.textContent = text; parent.appendChild(n); return n; };
  const askAbout = () => {
    const box = msg.querySelector(".verify-answer.ask-row");
    if (box) box.remove();
    nextAsk = { asQuestion: true };
    setQuestionText(context?.question || "");
    $("ask").requestSubmit();
  };
  const askRow = () => {
    const row = add(msg, "div", "", "verify-answer ask-row");
    const b = add(row, "button", t.quoteAsk, "verify-no");
    b.type = "button";
    b.addEventListener("click", askAbout);
  };
  const showResult = () => {
    msg.textContent = "";
    add(msg, "div", t.verifyExact, "verify-verdict").dataset.tone = "exact";
    body.matches.forEach((m) => {
      const card = add(msg, "div", "", "verify-card");
      add(card, "strong", m.source_name);
      const where = [m.location];
      if (m.grade) where.push(t.verifyGrade + ": " + m.grade);
      if (m.status !== "exact") where.push(t.verifyCoverage + ": " + Math.round(m.coverage * 100) + "%");
      add(card, "div", where.join(" \u00b7 "), "where");
      if ((m.also || []).length) add(card, "div", t.verifyAlso + ": " + m.also.join("\u060c "), "where");
      const side = (label, part) => {
        if (!part) return;
        const block = add(card, "div", "", "verify-side");
        add(block, "span", label + " \u00b7 " + part.location, "verify-side-label");
        add(block, "p", part.text);

      side(t.contextBefore, m.before);
      const w = m.window || { lead: "", match: m.excerpt, trail: "" };
      const main = add(card, "p", "", "verify-passage");
      main.dir = "auto";
      main.append((w.cut_lead ? "\u2026" : "") + w.lead);
      add(main, "strong", w.match);
      main.append(w.trail + (w.cut_trail ? "\u2026" : ""));
      side(t.contextAfter, m.after);
    });
    askRow();
  };
  showResult();
  return msg;
}

// Upload: the text of a photo or a file is read on the server (nothing is stored) and put in a box for the visitor to check.
const uploadText = async (file) => {
  const t = UI[lang];
  if (file.size > 8 * 1024 * 1024) throw new Error(t.e_too_large);
  let res;
  try { res = await fetch("/api/extract", { method: "POST", headers: { "Content-Type": file.type || "application/octet-stream" }, body: file }); }
  catch { throw new Error(t.e_failed); }
  if (res.ok) return res.json();
  let code = "";
  try { code = (await res.json()).detail || ""; } catch { /* no body */ }
  if (res.status === 429) code = "busy";
  const [kind, hint] = code.split(":");  // «vision_failed:HTTP 429»: the hint tells the owner what the model service said
  throw new Error((t["e_" + kind] || t.e_failed) + (hint ? " (" + hint + ")" : ""));
};

// 6. Read aloud with the browser's voices or the server's natural voices.
// Muhawir's own words only: quoted ayahs, tafsir and hadith are never read by a computer voice.
function spokenText(res) {
  const parts = [];
  if (res.message) parts.push(res.message);
  // a sentence that cites a verse quotes it between «», {}, ﴿﴾ or "" (English translation): every quotation in
  // it is taken as the verse and replaced by «(آية)», so no synthetic voice ever reads the Quran
  const verseIds = new Set((res.sources || []).filter((s) => s.kind === "quran" || s.kind === "tafsir" || s.kind === "gharib")
    .map((s) => s.passage_id));
  const mark = /[\u0600-\u06FF]/.test(JSON.stringify(res.claims || [])) ? "(آية)" : "(verse)";
  const safe = (text, ids) => {
    let out = text.replace(/﴿[^﴾]*(?:﴾|$)/g, mark).replace(/\{[^}]*(?:\}|$)/g, mark);
    if ((ids || []).some((id) => verseIds.has(id) || String(id).startsWith("q:"))) {
      out = out.replace(/«[^»]*(?:»|$)/g, mark).replace(/"[^"]*(?:"|$)/g, mark).replace(/“[^”]*(?:”|$)/g, mark);
    }
    return out;
  };
  let heading = "";
  for (const c of res.claims || []) {
    if (c.text.startsWith("«")) continue;
    if (c.section && c.section !== heading) { heading = c.section; parts.push(heading + "."); }
    parts.push((c.label ? c.label + ": " : "") + safe(c.text, c.passage_ids));
  }
  if (res.follow_up) parts.push(res.follow_up);
  for (const v of res.views || []) parts.push(`${v.school}: ${safe(v.text, v.passage_ids)}`);
  return parts.join("\n");
}

function voicesReady() {
  const now = speechSynthesis.getVoices();
  if (now.length) return Promise.resolve(now);

    const done = () => resolve(speechSynthesis.getVoices());
    speechSynthesis.addEventListener("voiceschanged", done, { once: true });
    setTimeout(done, 1500);
  });

// a browser voice whose name says it is a woman's or a man's, when the listener chose one (browsers do not say)
const FEMALE_NAME = /female|woman|zira|hoda|salma|zariyah|laila|layla|mariam|maryam|uzma|gul|samantha|ava|emma|aria|jenny|susan|hazel|naayf?a|amina|sana|noura/i;
const MALE_NAME = /\bmale|\bman\b|david|mark|naayf|hamed|shakir|asad|salman|andrew|brian|guy|george|tarik|maged|majed/i;
function pickVoice(voices, speakLang, gender = "") {
  const tag = { ar: "ar-sa", ur: "ur-pk", en: "en-us" }[speakLang] || "en-us";
  const ofLang = voices.filter((v) => v.lang.toLowerCase().replace("_", "-").startsWith(speakLang));
  const wanted = gender === "female" ? FEMALE_NAME : gender === "male" ? MALE_NAME : null;
  const best = (list) => list.find((v) => v.lang.toLowerCase().replace("_", "-") === tag) || list[0] || null;
  return (wanted && best(ofLang.filter((v) => wanted.test(v.name)))) || best(ofLang);
}

// Short pieces, one after another: Chrome stops long utterances after about 15 seconds.
function pieces(text) {
  return text.split(/(?<=[.!?؟。\n])\s*/).map((x) => x.trim()).filter(Boolean);
}

  try { return localStorage.getItem(`muhawir-voice-${speakLang}`) || ""; } catch { return ""; }
}
let activeReadAloud = null;
function stopReadAloud() { if (activeReadAloud) activeReadAloud.stop(); }

// The small buttons under an answer (copy, listen, rate and so on).
function actionIcon(name) {
  const icon = el("span", "action-icon");
  icon.setAttribute("aria-hidden", "true");
  icon.innerHTML = ACTION_ICONS[name];
  return icon;
}

function makeActionButton(label, iconName, className = "", labelKey = iconName) {
  const button = el("button", `action-btn${className ? ` ${className}` : ""}`);
  button.type = "button";
  button.dataset.labelKey = labelKey;
  button.setAttribute("aria-label", label);
  button.title = label;
  button.append(actionIcon(iconName), el("span", "action-label", label));
  return button;
}

// «3 مصادر» / «1 source»: the label of the sources button, the number of sources the answer rests on.
function sourceCountLabel(n) {
  if (lang === "en") return `${n} ${n === 1 ? "source" : "sources"}`;
  if (lang === "ur") return `${n} مصدر`;
  if (n === 1) return "مصدر واحد";
  if (n === 2) return "مصدران";
  return `${n} ${n <= 10 ? "مصادر" : "مصدرًا"}`;
}

function setActionStatus(status, key) {
  status.dataset.statusKey = key;
  status.textContent = UI[lang][key] || "";
}

function applyActionTranslations(message) {
  const t = UI[lang];
  message.querySelectorAll(".status[data-status-key]").forEach((badge) => {
    badge.textContent = t.status[badge.dataset.statusKey] || "";
  });
  message.responseActions.querySelectorAll("[data-label-key]").forEach((control) => {
    const key = control.dataset.labelKey;
    const label = key === "sources"
      ? (control.getAttribute("aria-expanded") === "true" ? t.hideSources : t.showSources)
      : t[key];
    if (!label) return;
    const text = control.querySelector(".action-label");
    if (text) text.textContent = key === "sources" ? control.dataset.count : label;
    control.setAttribute("aria-label", label);
    control.title = label;
  });
  message.responseActions.querySelectorAll("[data-item-key]").forEach((item) => {
    item.textContent = t[item.dataset.itemKey];
  });
  const statusKey = message.actionStatus.dataset.statusKey;
  if (statusKey) message.actionStatus.textContent = t[statusKey] || "";
}

function listenButton(res, status) {
  const rawText = spokenText(res);
  if (!rawText) return null;
  const withoutVerses = rawText.replace(/﴿[^﴾]*(?:﴾|$)/g, "");
  // Urdu is written in the Arabic script: its own letters (ٹ ڈ ڑ ں ھ ہ ے) tell it apart
  const speakLang = /[\u0679\u0688\u0691\u06BA\u06BE\u06C1\u06D2\u06D3]/.test(withoutVerses) ? "ur"
    : /[\u0600-\u06FF]/.test(withoutVerses) ? "ar" : (withoutVerses.trim() ? "en" : lang);
  const text = rawText.replace(/﴿[^﴾]*(?:﴾|$)/g, { ar: "(آية)", ur: "(آیت)" }[speakLang] || "(verse)");
  const group = el("span", "listen-group");
  const row = el("span", "listen-controls");
  const btn = makeActionButton((UI[speakLang] || UI[lang]).listen, "listen");
  const label = btn.querySelector(".action-label");
  const icon = btn.querySelector(".action-icon");
  const choice = el("label", "voice-choice");
  const choiceLabel = el("span", "", UI[lang].voiceChoice);
  choiceLabel.dataset.itemKey = "voiceChoice";
  const select = el("select");
  select.dataset.speakLang = speakLang;
  const named = VOICE_LIST[speakLang] || [];
  if (named.length) {  // real recorded voices by name, women first: «زارية (السعودية) — امرأة»
    for (const v of named) {
      const option = el("option", "", `${v.names[lang] || v.names.en} — ${UI[lang][v.gender === "female" ? "femaleVoice" : "maleVoice"]}`);
      option.value = v.id;
      option.dataset.gender = v.gender;
      select.append(option);
    }
    const stored = storedVoice(speakLang);
    select.value = named.some((v) => v.id === stored) ? stored
      : (named.find((v) => v.gender === selectedSpeechVoice) || named[0]).id;
  } else {
    for (const [value, key] of [["female", "femaleVoice"], ["male", "maleVoice"]]) {
      const option = el("option", "", UI[lang][key]);
      option.value = value;
      option.dataset.itemKey = key;
      option.dataset.gender = value;
      select.append(option);
    }
    select.value = selectedSpeechVoice;
  }
  choice.append(choiceLabel, select);
  select.addEventListener("change", () => {
    selectedSpeechVoice = select.selectedOptions[0]?.dataset.gender || selectedSpeechVoice;
    try {
      localStorage.setItem("muhawir-speech-voice", selectedSpeechVoice);
      if (named.length) localStorage.setItem(`muhawir-voice-${speakLang}`, select.value);
    } catch { /* preference remains available for this page */ }
    document.querySelectorAll(".voice-choice select").forEach((other) => {
      if (other === select) return;
      if (other.dataset.speakLang === speakLang && named.length) other.value = select.value;
      else if ([...other.options].some((o) => o.value === selectedSpeechVoice)) other.value = selectedSpeechVoice;
    });
    stopReadAloud();
  });
  const note = el("small", "listen-note", (UI[speakLang] || UI[lang]).azureNotice);
  note.dataset.itemKey = "azureNotice";
  const reset = () => {
    delete btn.dataset.playing;
    btn.setAttribute("aria-pressed", "false");
    btn.dataset.labelKey = "listen";
    label.textContent = (UI[speakLang] || UI[lang]).listen;
    btn.setAttribute("aria-label", (UI[speakLang] || UI[lang]).listen);
    btn.title = (UI[speakLang] || UI[lang]).listen;
    icon.innerHTML = ACTION_ICONS.listen;
  };
  const setPlaying = () => {
    btn.dataset.playing = "1";
    btn.setAttribute("aria-pressed", "true");
    btn.dataset.labelKey = "stop";
    label.textContent = (UI[speakLang] || UI[lang]).stop;
    btn.setAttribute("aria-label", (UI[speakLang] || UI[lang]).stop);
    btn.title = (UI[speakLang] || UI[lang]).stop;
    icon.innerHTML = ACTION_ICONS.stop;
  };
  const browserFallback = async (playback) => {
    if (playback.fallbackStarted) return;
    playback.fallbackStarted = true;
    if (!("speechSynthesis" in window)) {
      playback.stop();
      status.textContent = UI[speakLang].noVoice;
      delete status.dataset.statusKey;
      return;
    }
    const voice = pickVoice(await voicesReady(), speakLang, select.selectedOptions[0]?.dataset.gender || selectedSpeechVoice);
    if (activeReadAloud !== playback) return;
    if (!voice) {
      playback.stop();
      status.textContent = UI[speakLang].noVoice;
      delete status.dataset.statusKey;
      return;
    }
    status.textContent = "";
    delete status.dataset.statusKey;
    setPlaying();
    const parts = pieces(text);
    parts.forEach((part, i) => {
      const u = new SpeechSynthesisUtterance(part);
      u.lang = voice.lang;
      try { u.voice = voice; } catch { /* the language tag alone still picks it */ }
      if (i === parts.length - 1) u.onend = () => playback.stop();
      u.onerror = () => playback.stop();
      speechSynthesis.speak(u);
    });
  };
  btn.play = async () => {
    stopReadAloud();
    const controller = new AbortController();
    const playback = {
      button: btn, audio: null, url: null, ready: false, fallbackStarted: false,
      stop() {
        controller.abort();
        if ("speechSynthesis" in window) speechSynthesis.cancel();
        if (this.audio) { this.audio.pause(); this.audio.removeAttribute("src"); this.audio.load(); }
        if (this.url) URL.revokeObjectURL(this.url);
        if (activeReadAloud === this) activeReadAloud = null;
        if (["voiceLoading", "voiceTap"].includes(status.dataset.statusKey)) {
          status.textContent = "";
          delete status.dataset.statusKey;
        }
        reset();
      }
    };
    activeReadAloud = playback;
    setPlaying();
    setActionStatus(status, "voiceLoading");
    try {
      if (!document.body.classList.contains("natural-voice")) throw new Error("no natural voice on this server");
      const response = await fetch("/tts", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, voice: select.value, lang: speakLang }),
        signal: controller.signal
      });
      if (!response.ok) throw new Error("Azure speech unavailable");
      const blob = await response.blob();
      if (activeReadAloud !== playback) return;
      playback.url = URL.createObjectURL(blob);
      playback.audio = new Audio(playback.url);
      playback.audio.addEventListener("ended", () => playback.stop(), { once: true });
      playback.audio.addEventListener("error", () => {
        if (activeReadAloud === playback) {
          playback.audio.pause();
          URL.revokeObjectURL(playback.url);
          playback.url = null;
          playback.audio = null;
          browserFallback(playback);
        }
      }, { once: true });
      await playback.audio.play();
      if (activeReadAloud === playback) { status.textContent = ""; delete status.dataset.statusKey; }
    } catch (error) {
      if (activeReadAloud !== playback) return;
      if (error.name === "NotAllowedError" && playback.audio) {
        playback.ready = true;
        reset();
        setActionStatus(status, "voiceTap");
      } else {
        await browserFallback(playback);  // includes 503, timeouts and network failures
      }
    }
  };
  btn.addEventListener("click", () => {
    if (activeReadAloud?.ready && activeReadAloud.button === btn) {
      const playback = activeReadAloud;
      playback.ready = false;
      setPlaying();
      playback.audio.play().then(() => { status.textContent = ""; delete status.dataset.statusKey; })
        .catch(() => browserFallback(playback));
      return;
    }
    if (btn.dataset.playing) { stopReadAloud(); return; }
    btn.play();
  });
  row.append(btn, choice);
  group.append(row, note);
  group.play = btn.play;
  return group;
}

// The recitation of a verse.
// a verse is heard only in a reciter's real voice: Mishary Alafasy's recording of that ayah from everyayah.com,
// played from their server (nothing is copied here); never a synthetic voice
let activeRecitation = null;
function recitationButton(surah, ayah) {
  const t = UI[lang] || UI.ar;
  const btn = el("button", "action-btn recitation", "▶ " + t.recite);
  btn.type = "button";
  const src = `https://everyayah.com/data/Alafasy_128kbps/${String(surah).padStart(3, "0")}${String(ayah).padStart(3, "0")}.mp3`;
  const stop = () => {
    if (activeRecitation) { activeRecitation.audio.pause(); activeRecitation.btn.textContent = "▶ " + t.recite; }
    activeRecitation = null;
  };
  btn.addEventListener("click", () => {
    if (activeRecitation && activeRecitation.btn === btn) { stop(); return; }
    stop();
    if (typeof stopReadAloud === "function") stopReadAloud();
    const audio = new Audio(src);
    activeRecitation = { audio, btn };
    btn.textContent = "⏹ " + t.stop;
    audio.addEventListener("ended", stop, { once: true });
    audio.addEventListener("error", () => { stop(); btn.textContent = t.reciteFailed; }, { once: true });
    audio.play().catch(() => { stop(); btn.textContent = t.reciteFailed; });
  });
  const wrap = el("div", "meta recitation-row");
  wrap.append(btn, el("div", "", t.reciter));
  return wrap;
}

// 7. The answer as plain text for copying and sharing.
function answerText(res, includeSourcePassages = false) {
  const lines = [];
  if (res.message) lines.push(res.message);
  const sourceNumbers = new Map((res.sources || []).map((source, i) => [source.passage_id, i + 1]));
  for (const claim of res.claims || []) {
    const text = `${claim.label ? `${claim.label}: ` : ""}${claim.text}`;
    const refs = [...new Set(claim.passage_ids || [])].map((id) => sourceNumbers.get(id)).filter(Boolean);
    lines.push(`${claim.section ? `${claim.section}: ` : ""}${text}${refs.length ? ` [${refs.join(", ")}]` : ""}`);
  }
  for (const view of res.views || []) {
    const refs = [...new Set(view.passage_ids || [])].map((id) => sourceNumbers.get(id)).filter(Boolean);
    lines.push(`${view.school}: ${view.text}${refs.length ? ` [${refs.join(", ")}]` : ""}`);
  }
  if (res.note) lines.push(res.note);
  if (res.referral && res.referral.title) {
    lines.push("", res.referral.title, res.referral.intro);
    for (const link of res.referral.links || []) lines.push(`- ${link.label}${link.where ? ` (${link.where})` : ""}: ${link.url}`);
  }
  if (res.follow_up) lines.push(res.follow_up);
  if ((res.sources || []).length) {
    lines.push("", UI[lang].sources + ":");
    for (const [i, source] of res.sources.entries()) {
      lines.push(`[${i + 1}] ${source.source_name || source.location}${source.location ? ` · ${source.location}` : ""}`);
      if (includeSourcePassages && source.quote) lines.push(source.quote);
    }
  }
  return lines.join("\n").trim();
}

async function writeClipboard(text) {
  if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); return; }
  const field = el("textarea");
  field.value = text;
  field.setAttribute("readonly", "");
  field.style.position = "fixed";
  field.style.opacity = "0";
  document.body.append(field);
  field.select();
  const copied = document.execCommand("copy");
  field.remove();
  if (!copied) throw new Error("Clipboard unavailable");
}

function rememberable(res) {
  return !["invalid", "declined", "abstained", "unavailable"].includes(res.status);
}

// Rendering an answer: helpers first, then renderAnswer, which builds the whole answer (text, sections, views,
// source cards, buttons) from the server's reply.
// The children's style shows a small picture beside each sentence, chosen from its words. Pictures of things only
// (water, a mosque, the Quran, the crescent): never a person, a prophet or anything of the unseen. They add nothing
// to what the sentence says; the information stays in the sourced text. The first match wins: wudu before prayer.
const KIDS_ICONS = [
  [/وضوء|توضأ|يتوضأ|نتوضأ|اغسل|يغسل|نغسل|الغسل|(^|[\s،])(بال|ال|و)?ماء([\s.،]|$)|wudu|wash|water/i, "💧"],
  [/الكعبة|الحج|يحج|مكة|hajj|kaaba|makkah|mecca/i, "🕋"],
  [/صيام|الصوم|يصوم|نصوم|تصوم|رمضان|الإفطار|السحور|fasting|ramadan/i, "🌙"],
  [/زكاة|صدقة|الفقراء|الفقير|المحتاج|يتصدق|نتصدق|charity|zakat|the poor/i, "🤝"],
  [/الدعاء|دعاء|يدعو|ندعو|ادعُ|ادعوا|supplicat|\bdua\b/i, "🤲"],
  [/صلاة|الصلاة|يصلي|نصلي|تصلي|الصلوات|ركعة|السجود|الركوع|المسجد|pray|mosque/i, "🕌"],
  [/القرآن|قرآن|سورة|آية|الآيات|quran|qur'an|verse|surah/i, "📖"],
  [/(^|[\s،])(ال)?علم([\s.،]|$)|يتعلم|نتعلم|تتعلم|learn|knowledge/i, "📚"],
  [/الوالدين|والديك|والديه|أمك|أبيك|parents|your mother|your father/i, "👨‍👩‍👧"],
  [/رحمة|يرحم|الرحمن|الرحيم|محبة|يحب|نحب|mercy|merciful|love/i, "💛"],
];
function kidsIcon(text) {
  const hit = KIDS_ICONS.find(([re]) => re.test(text));
  return hit ? hit[1] : "⭐";
}

// «المقاطع» is the word the model is given for the retrieved texts; the reader knows them as the sources.
// Only Muhawir's own words are changed: a quote («…») and the source cards stay exactly as written.
const PLAIN_WORDS = [[/(^|[^\p{L}])(و?[بلف]?)المقاطع(?![\p{L}])/gu, "$1$2المصادر"], [/(^|[^\p{L}])(و?[بلف]?)المقطع(?![\p{L}])/gu, "$1$2المصدر"],
                     [/(^|[^\p{L}])(و?[بلف]?)مقاطع(?![\p{L}])/gu, "$1$2مصادر"], [/\bthe passages\b/gi, "the sources"], [/\bthe passage\b/gi, "the source"]];
function plainText(text) {
  if (!text) return text;
  return PLAIN_WORDS.reduce((t, [from, to]) => t.replace(from, to), text);
}
function plainWords(res) {
  res.message = plainText(res.message);
  res.follow_up = plainText(res.follow_up);
  for (const c of res.claims || []) {
    if (c.text && !c.text.startsWith("«")) c.text = plainText(c.text);
    if (c.label) c.label = plainText(c.label);
  }
  return res;
}

function answerBadgeState(response) {
  // Referrals stay red even when general supporting passages accompany them.
  if (response.status === "referred") return { key:"referred", tone:"referred" };
  if (response.status === "answered") {
    const supported = Array.isArray(response.sources) && response.sources.length > 0;
    return { key:supported ? "answered" : "abstained", tone:supported ? "found" : "missing" };
  }
  return { key:response.status, tone:"missing" };
}

// How the understood question differs from what was typed. «same»: only spaces, punctuation, hamza or
// diacritics («ماهي الزكاة» / «ما هي الزكاة؟»): nothing is shown. «added»: every typed word is still there and
// words were added («الزكاة» / «ما هي الزكاة؟»): a quiet line. «changed»: a typed word was replaced («ضيام» /
// «صيام»): a first question asks «هل تقصد…؟ نعم / لا».
function plainLetters(text) {
  return (text || "").replace(/[\u064B-\u065F\u0670\u0640]/g, "").replace(/[أإآٱ]/g, "ا").replace(/ة/g, "ه")
    .replace(/ى/g, "ي").replace(/ؤ/g, "و").replace(/ئ/g, "ي").toLowerCase();
}
// The number of single-letter edits between two words (a typo is one or two of them).
function editDistance(a, b) {
  let row = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const next = [i];
    for (let j = 1; j <= b.length; j++) {
      next[j] = Math.min(row[j] + 1, next[j - 1] + 1, row[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    row = next;
  }
  return row[b.length];
}

// How the understood question differs from the typed one:
//   "same"    no difference in the words;
//   "added"   the typed words are all there (a follow-up made whole), or the question was only put in other words
//             («جواهر سورة الكهف: اذكر الكلمات النادرة» → «ما الكلمات النادرة في سورة الكهف؟»): said, never asked about;
//   "changed" a typed word was mistyped and corrected («ضيام» → «صيام»): the only case that asks «هل تقصد؟».
function rewordKind(typed, understood) {
  if (!understood) return "same";
  const words = (t) => plainLetters(t).split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const typedWords = words(typed);
  const understoodWords = words(understood);
  const joined = understoodWords.join("");
  if (typedWords.join("") === joined) return "same";
  const missing = typedWords.filter((w) => !joined.includes(w));
  if (!missing.length) return "added";
  const mistyped = missing.some((w) => w.length >= 3
    && understoodWords.some((u) => u.length >= 3 && !typedWords.includes(u) && editDistance(w, u) <= Math.max(1, Math.floor(w.length / 4))));
  return mistyped ? "changed" : "added";
}

// Reply-language: the words around a reply (its status line, its buttons) are in the language the reply is written in,
// as its letters tell, whatever the page language: an English question on the Arabic page gets English all through
function replyLangOf(res) {
  const text = [res.message, ...(res.claims || []).map((c) => c.text), res.follow_up].filter(Boolean).join(" ");
  if (/[\u0679\u0688\u0691\u06BA\u06BE\u06C1\u06D2\u06D3]/.test(text)) return "ur";
  if (/[\u0600-\u06FF]/.test(text)) return "ar";
  return /[A-Za-z]{2,}/.test(text) ? "en" : lang;
}

function renderAnswer(res, style, context) {
  if (res.status === "quote") return renderQuote(res, context);
  // No suggested question after an answer (November 2026), also for answers cached or saved before it: nothing is
  // shown, kept in the conversation, or turns the box into «ردّ على مُحاور…»
  if (res.status === "answered") res.follow_up = "";
  plainWords(res);
  const vowelTargets = [];
  const open = style === "extended";
  const replyLang = replyLangOf(res);
  const t = UI[replyLang] || UI[lang];
  const msg = el("div", "msg");
  msg.lang = replyLang;

          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 240000);
          try {
            const send = () => fetch("/api/tashkeel", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ texts: original, passage_ids: (res.sources || []).map(s => s.passage_id) }),
              signal: controller.signal
            });
            let data = null;
            // a long answer is read a few sentences at a time: the server says when some are still unread, and the
            // sentences already read are kept there, so asking again only reads the rest
            for (let round = 0; round < 6; round++) {
              let response = await send();
              if (response.status === 503) {  // busy: one more try after a short wait
                await new Promise((resolve) => setTimeout(resolve, 3000));
                response = await send();
              }
              if (!response.ok) {
                let reason = "";
                try { reason = (await response.json()).detail || ""; } catch {}
                throw Object.assign(new Error("Unavailable"), { reason, code: response.status });
              }
              data = await response.json();
              if (data.complete !== false) break;
              status.textContent = "جارٍ التشكيل… (" + (round + 1) + ")";
            }
            const bare = text => text.replace(/[\u064b-\u0652\u0670]/g, "");
            if (!Array.isArray(data.texts) || data.texts.length !== original.length ||
                data.texts.some((text, i) => typeof text !== "string" || bare(text) !== bare(original[i])))
              throw new Error("Changed text");
            vowelled = data;
          } finally { clearTimeout(timer); }
        }
        vowelTargets.forEach((n, i) => { n.textContent = vowelled.texts[i]; });
        showing = true;
        setVowelLabel("النص الأصلي");
        vowelButton.setAttribute("aria-pressed", "true");
        status.textContent = vowelled.rejected ? "تشكيل آلي؛ أُبقيت أجزاء على أصلها لحماية النص." : "تشكيل آلي مساعد قد يخطئ. النسخ يحتفظ بالأصل.";
      } catch (error) {
        const reason = error?.reason || "";
        status.textContent = /environment unavailable/.test(reason) ? "خدمة التشكيل غير مفعّلة على الخادم؛ النص الأصلي محفوظ."
          : /rate limit/.test(reason) ? "كثرت طلبات التشكيل الآن؛ النص الأصلي محفوظ. حاول بعد دقيقة."
          : /busy/.test(reason) ? "التشكيل مشغول الآن؛ النص الأصلي محفوظ. حاول بعد قليل."
          : error?.code === 422 ? "الجواب أطول من أن يُشكَّل دفعة واحدة؛ النص الأصلي محفوظ."
          : error?.message === "Changed text" ? "اختلف النص بعد التشكيل فأُبقي الأصل حمايةً له."
          : "تعذّر التشكيل؛ النص الأصلي محفوظ. حاول لاحقًا.";
      } finally { vowelButton.disabled = false; }
    };
    vowelButton.addEventListener("click", applyVowels);
    // Fewer-buttons (November 2026): no vowelling button; the styles that need it (children, newcomers) are vowelled
    // automatically below
    // Wait for explicit question confirmation; never re-run for restored history.
    if (["kids", "newcomer"].includes(style) && !context?.restored) {
      if (confirmFirst) msg.startTashkeel = applyVowels;
      else setTimeout(() => { if (msg.isConnected) applyVowels(); }, 0);
    }
  }



  const listen = listenButton(res, status);
  if (listen) { actions.append(listen); msg.listen = listen; }

  const regenerate = makeActionButton(t.regenerate, "regenerate", "", "regenerate");
  regenerate.disabled = !context;
  regenerate.addEventListener("click", () => regenerateAnswer(msg));
  actions.append(regenerate);

  if (res.status === "answered") {  // a rating only counts on the server: no model is asked anything
    const rate = (verdict) => {

  const more = el("details", "more-actions");

  moreSummary.setAttribute("aria-label", t.more);

  const menu = el("div", "more-menu");

  }
  more.append(menu);
  more.addEventListener("toggle", () => {

    }
  });
  more.addEventListener("keydown", (event) => { if (event.key === "Escape") { more.open = false; moreSummary.focus(); } });
  if (menu.childElementCount) actions.append(more);  // an empty menu is not shown

  if (sourceCards.length) {
    const sourcesButton = makeActionButton(panel.hidden ? t.showSources : t.hideSources, "sources", "", "sources");
    const label = sourcesButton.querySelector(".action-label");
    sourcesButton.dataset.count = String(sourceCards.length);

      const expanded = panel.hidden || single;

  ordered.filter(Boolean).forEach((control) => actions.append(control));

  if (!general) {

      msg.append(ask);
      // the answer to a question the user did not mean is not kept for the next one
      forgetRejectedAnswer(context, res);
      saveConversations();
      $("q").focus();
    });
  }
  return msg;
}

// 8. Requests in flight: stopping one, asking again, forgetting an answer the reader rejected.
function forgetRejectedAnswer(context, res) {
  const conversation = context?.conversation;
  if (!conversation) return;
  const userText = String(res.understood || context.question).slice(0, 600);
  const answerText = [res.message, ...(res.claims || []).map((claim) => claim.text)].filter(Boolean).join(" ").slice(0, 600);
  const removePair = (turns) => {
    if (!Array.isArray(turns)) return;
    for (let i = turns.length - 2; i >= 0; i--) {
      if (turns[i].role === "user" && turns[i].text === userText &&
          turns[i + 1].role === "assistant" && turns[i + 1].text === answerText) {
        turns.splice(i, 2);
        break;
      }
    }
  };
  removePair(conversation.turns);
  conversation.log = (conversation.log || []).filter((entry) => entry !== context.entry);
  for (const entry of conversation.log) removePair(entry.history);
  context.entry = null;
}

function syncRegenerateButtons(conversation) {
  const targets = conversation ? [conversation] : conversations;
  for (const item of targets) {
    const latest = item.messages.at(-1);
    for (const message of item.messages) {
      if (message?.regenerateButton) message.regenerateButton.disabled = message !== latest || $("send").disabled;
    }
  }
}

function beginAnswerRequest(details) {
  const request = { ...details, controller: new AbortController(), cancelled: false };
  activeRequest = request;
  $("composerVoice").hidden = true;
  $("send").disabled = true;
  $("send").hidden = true;
  $("stopRequest").hidden = false;
  $("requestNotice").hidden = true;
  // Blur after the DOM/button updates too: Android can otherwise keep the IME's
  // focused-input pan even though the conversation has already been appended.
  if (document.activeElement === $("q")) $("q").blur();
  if (isMobileLayout() && (!window.visualViewport || Math.abs(window.visualViewport.scale - 1) <= .01)) {
    window.scrollTo({ top:0, left:0, behavior:"instant" });
  }
  syncRegenerateButtons();
  return request;
}

function finishAnswerRequest(request) {
  if (activeRequest !== request) return;
  activeRequest = null;
  $("send").disabled = false;
  fitQuestionBox();
  $("stopRequest").hidden = true;
  syncRegenerateButtons();
  request.conversation.updatedAt = Date.now();
  renderHistory();
  if (activeConversation === request.conversation) {
    const last = request.conversation.messages.at(-1);
    if (!request.cancelled && last?.dataset.sourcedAnswer) scrollToAnswerStart(last);
    else scrollDown();
    if (request.kind === "question" && window.matchMedia("(min-width: 861px)").matches) $("q").focus();
  }
}

function stopAnswerRequest() {
  const request = activeRequest;
  if (!request) return;
  request.cancelled = true;
  activeRequest = null;
  request.controller.abort();
  const conversation = request.conversation;
  conversation.messages = conversation.messages.filter((entry) => entry !== request.pending && entry !== request.userMessage);
  request.pending.remove();
  if (request.userMessage) request.userMessage.remove();
  if (request.kind === "regenerate") setActionStatus(request.message.actionStatus, "requestStopped");
  if (!conversation.messages.length) conversation.title = UI[lang].newChat;
  conversation.updatedAt = Date.now();
  $("send").disabled = false;
  $("send").hidden = false;
  $("stopRequest").hidden = true;
  syncRegenerateButtons();
  if (activeConversation === conversation) {
    if (request.kind === "question" && !$("q").value.trim()) setQuestionText(request.question);
    if (!conversation.messages.length) renderConversation(conversation);
    else { updateConversationTitle(); renderHistory(); }
    $("q").focus();
  } else renderHistory();
  // Stopping a new answer leaves the question to edit; stopping a re-written answer leaves the old answer in place,
  // and that button's own status already says so.
  if (request.kind !== "regenerate") {
    const note = $("requestNotice"), said = UI[lang].requestStopped;
    note.textContent = said; note.hidden = false;
    setTimeout(() => { if (note.textContent === said) note.hidden = true; }, 8000);
  }
}

async function regenerateAnswer(message) {
  const context = message.requestContext;
  const conversation = context?.conversation;
  if (!context || !conversation || conversation.messages.at(-1) !== message || $("send").disabled) return;
  const messageIndex = conversation.messages.indexOf(message);
  if (messageIndex < 0) return;
  message.regenerateButton.disabled = true;
  setActionStatus(message.actionStatus, "regenerating");
  const pending = createRiderStatus(context.lang || lang);
  conversation.messages.push(pending);
  if (activeConversation === conversation) { $("thread").append(pending); scrollDown(); }
  const request = beginAnswerRequest({ kind: "regenerate", conversation, pending, message });
  try {
    const res = await askStreamed({ question: context.question, style: context.style, lang: context.lang, history: context.history }, request.controller.signal, pending);
    if (request.cancelled) return;
    await completeRiderStatus(pending, res, context.lang || lang);
    if (request.cancelled) return;
    const replacement = renderAnswer(res, context.style, context);
    conversation.messages[messageIndex] = replacement;
    conversation.messages = conversation.messages.filter((entry) => entry !== pending);
    if (activeConversation === conversation) {
      message.replaceWith(replacement);
      pending.remove();
      typeAnswer(replacement);
    }
    conversation.turns = context.history.slice();
    if (rememberable(res)) {
      remember(conversation, "user", res.understood || context.question);
      remember(conversation, "assistant", [res.message, ...(res.claims || []).map((claim) => claim.text)].filter(Boolean).join(" "));
    }
    conversation.updatedAt = Date.now();
    logAnswer(conversation, context, res);
    if (activeConversation === conversation) scrollDown();
  } catch {
    if (request.cancelled) return;
    conversation.messages = conversation.messages.filter((entry) => entry !== pending);
    if (activeConversation === conversation) pending.remove();
    setActionStatus(message.actionStatus, "error");
  } finally {
    finishAnswerRequest(request);
  }
}

// A short distinctive phrase of a hadith for dorar's search: the Prophet's words when quoted, else the last words.
function searchPhrase(text) {
  const plain = text.replace(/[\u064B-\u0652\u0670\u0640]/g, "");
  const quoted = plain.match(/"([^"]{15,})"/) || plain.match(/«([^»]{15,})»/);
  const words = (quoted ? quoted[1] : plain).replace(/[^\p{L}\s]/gu, " ").split(/\s+/).filter(Boolean);
  return (quoted ? words.slice(0, 7) : words.slice(-7)).join(" ");
}

// 9. The question box and the chat viewport (keeping the last line visible when a phone keyboard opens).
// Reply-chips: the question box says «ردّ على مُحاور…» while Muhawir's last reply in this conversation asks something
function syncPlaceholder() {

function remember(conversation, role, text) {
  if (!text) return;
  conversation.turns.push({ role, text: text.slice(0, 600) });
  while (conversation.turns.length > MAX_HISTORY) conversation.turns.shift();
}

function fitQuestionBox() {
  const field = $("q");
  const hasQuestion = Boolean(field.value.trim());
  $("ask").classList.toggle("has-question", hasQuestion);
  $("composerVoice").hidden = hasQuestion || Boolean(activeRequest);
  $("send").hidden = !hasQuestion || Boolean(activeRequest);
  const style = getComputedStyle(field);
  const minimum = parseFloat(style.minHeight) || 44;
  const borders = (parseFloat(style.borderTopWidth) || 0) + (parseFloat(style.borderBottomWidth) || 0);
  const viewport = window.visualViewport;
  const screenHeight = viewport && Math.abs(viewport.scale - 1) <= .01 ? viewport.height : window.innerHeight;
  const maximum = Math.max(minimum, Math.min(180, screenHeight * .3));
  field.style.maxHeight = `${maximum}px`;
  field.style.height = "0px";
  const required = Math.max(minimum, field.scrollHeight + borders);
  field.style.height = `${Math.min(required, maximum)}px`;
  field.style.overflowY = required > maximum ? "auto" : "hidden";
}

// A mobile keyboard can resize only the visual viewport, leaving 100dvh unchanged.
// Scroll instantly after layout as well, so the pending row is not below the keyboard.
function scrollToAnswerStart(message) {
  const thread = $("thread");
  const align = () => {
    if (!message?.isConnected) return;
    const top = message.getBoundingClientRect().top - thread.getBoundingClientRect().top + thread.scrollTop;
    thread.scrollTo({ top: Math.max(0, top - 8), behavior: "instant" });
  };
  align();
  requestAnimationFrame(align);
}
function scrollDown() {
  const thread = $("thread");
  const pinToBottom = () => { thread.scrollTo({ top: thread.scrollHeight, behavior: "instant" }); };
  pinToBottom();
  requestAnimationFrame(pinToBottom);
}

let chatViewportFrame = null;
function syncChatViewport() {
  if (chatViewportFrame !== null) cancelAnimationFrame(chatViewportFrame);
  chatViewportFrame = requestAnimationFrame(() => {
    chatViewportFrame = null;
    const viewport = window.visualViewport;
    // Pinch zoom should magnify the existing layout, not make the app shrink again.
    if (viewport && Math.abs(viewport.scale - 1) > .01) return;
    const thread = $("thread");
    const followingBottom = thread.scrollHeight - thread.scrollTop - thread.clientHeight <= 64;
    if (isMobileLayout()) {
      const height = viewport ? viewport.height : window.innerHeight;
      if (height > 0) document.documentElement.style.setProperty("--chat-viewport-height", `${height}px`);
    } else {
      document.documentElement.style.removeProperty("--chat-viewport-height");
    }
    fitQuestionBox();
    const visibleRequest = activeRequest && activeRequest.conversation === activeConversation;
    if (followingBottom || visibleRequest) scrollDown();
  });
}
