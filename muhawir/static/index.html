<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>مُحاور</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem("muhawir-theme") === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }</script>
<style>
@font-face {
  font-family:"Muhawir Arabic";
  src:url("/fonts/NotoSansArabic-Regular.ttf") format("truetype");
  font-style:normal;
  font-weight:400;
  font-display:swap
}
@font-face {
  font-family:"Muhawir Arabic";
  src:url("/fonts/NotoSansArabic-Bold.ttf") format("truetype");
  font-style:normal;
  font-weight:700;
  font-display:swap
}

  :root {
  color-scheme:light;
  --bg:#F7F5FE;
  --panel:#FFFFFF;
  --sidebar:#F2F4FF;
  --ink:#0E153F;
  --muted:#4A5590;
  --muted-soft:#6676A5;
  --line:#7583AA;
  --accent:#6150EA;
  --accent-ink:#FFFFFF;
  --accent-soft:#E0D9FB;
  --mint:#2EF2C2;
  --deep:#12183F;
  --indigo:#2D3775;
  --warn-bg:#E0D9FB;
  --warn-ink:#2D3775;
  --card:#FFFFFF;
  --mine:#E0D9FB;
  --shadow:0 10px 34px rgba(18,24,63,.09);
  --focus:#6150EA;
  --glow-mint:rgba(46,242,194,.36);
  --glow-violet:rgba(97,80,234,.29)
}

:root[data-theme="dark"] {
    color-scheme:dark;
    --bg:#171D36;
    --panel:#222A49;
    --sidebar:#1D2544;
    --ink:#F7F8FF;
    --muted:#D9E0F4;
    --muted-soft:#BAC6E7;
    --line:#8E9CC7;
    --accent:#C5BAFF;
    --accent-ink:#171D36;
    --accent-soft:#343B6B;
    --mint:#77DECA;
    --deep:#171D36;
    --indigo:#D9E0F4;
    --warn-bg:#39365F;
    --warn-ink:#F7F8FF;
    --card:#222A49;
    --mine:#343B6B;
    --shadow:0 10px 34px rgba(0,0,0,.25);
    --focus:#C5BAFF;
    --glow-mint:rgba(119,222,202,.24);
    --glow-violet:rgba(160,139,255,.30)
}

  * {
  box-sizing:border-box
}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.75 "Muhawir Arabic",system-ui,Tahoma,sans-serif
}
button,textarea,select {
  font:inherit
}
button {
  color:inherit
}
button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible {
  outline:3px solid var(--focus);
  outline-offset:2px
}

  .app-shell {

}
.sidebar {
  min-width:0;

  padding:22px 16px 14px;
  background:var(--sidebar);
  border-inline-end:1px solid var(--line);

}
.sidebar-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:11px;
  padding:0 6px 22px
}
.brand-lockup {
  min-width:0;
  display:flex;
  align-items:center;
  gap:11px
}
.brand-mark {
  width:42px;
  height:42px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:var(--accent);
  background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 13%,transparent);

}
.brand-mark svg {
  width:24px;
  height:24px
}
.brand-name {
  margin:0;
  font-family:Tahoma,"Segoe UI",sans-serif;
  font-size:21px;
  line-height:1.25;
  font-weight:700;
  letter-spacing:normal
}
.brand-caption {
  margin:3px 0 0;
  color:var(--muted);
  font-size:12px;
  line-height:1.4
}
.icon-button {
  width:40px;
  height:40px;
  display:inline-grid;
  place-items:center;
  flex:0 0 auto;
  border:1px solid transparent;
  border-radius:13px;
  background:transparent;
  cursor:pointer;
  color:var(--muted)
}
.icon-button:hover {
  color:var(--ink);
  background:color-mix(in srgb,var(--accent) 8%,transparent)
}
.theme-toggle {
  border-color:var(--line);
  background:var(--panel);
  color:var(--accent)
}
.theme-toggle svg { width:19px; height:19px }
.theme-toggle .theme-sun { display:none }
:root[data-theme="dark"] .theme-toggle .theme-moon { display:none }
:root[data-theme="dark"] .theme-toggle .theme-sun { display:block }
.icon-button svg {
  width:20px;
  height:20px
}
.sidebar-close {
  display:none
}
.history-toggle {
  display:inline-grid
}
@media(min-width:861px) {
  .app-shell { transition:grid-template-columns .22s ease }
  .app-shell.sidebar-collapsed { grid-template-columns:0 minmax(0,1fr) }
  .app-shell.sidebar-collapsed .sidebar { display:none }
  .app-shell.sidebar-collapsed .workspace { grid-column:2 }
}

  .new-chat {
  width:100%;
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  border:0;
  border-radius:15px;
  background:var(--accent);
  color:var(--accent-ink);
  font-weight:650;
  cursor:pointer;
  box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 18%,transparent);
  transition:transform .16s ease,box-shadow .16s ease
}
.new-chat:hover {
  transform:translateY(-1px);
  box-shadow:0 7px 16px color-mix(in srgb,var(--accent) 21%,transparent)
}
.new-chat svg {
  width:19px;
  height:19px
}
.history-heading {
  margin:28px 8px 10px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em
}
.history-search {
  height:42px;
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--line);
  border-radius:13px;
  padding:0 11px;
  color:var(--muted);
  background:color-mix(in srgb,var(--panel) 70%,transparent)
}
.history-search svg {
  width:17px;
  height:17px;

}
.history-search input {

  border:0;
  outline:0;

  background:transparent;

}
.history-search input::placeholder {
  color:var(--muted);

}
.history-list {
  display:flex;
  flex-direction:column;
  gap:4px;
  overflow:auto;
  margin-top:12px
}
.history-item {
  display:flex;
  align-items:center;
  gap:9px;
  min-height:43px;
  width:100%;
  padding:7px 10px;
  border:1px solid transparent;
  border-radius:12px;
  background:transparent;
  text-align:start;
  cursor:pointer;
  color:var(--muted);
  font-size:13px
}
.history-row {
  display:flex;
  align-items:center;
  gap:2px
}
.history-row .history-item {
  flex:1;
  min-width:0
}
.history-tool {
  flex:0 0 auto;
  width:32px;
  height:32px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:var(--muted);
  font-size:15px;
  cursor:pointer
}
.history-tool:hover,.history-tool:focus-visible {
  color:var(--ink);
  background:color-mix(in srgb,var(--panel) 72%,transparent)
}
.history-tool[aria-pressed="true"] {
  color:var(--accent)
}
.history-delete-all {
  margin:10px 7px 0;
  padding:6px 8px;
  border:0;
  background:transparent;
  color:var(--muted);
  font:inherit;
  font-size:12px;
  text-decoration:underline;
  cursor:pointer
}
.history-item:hover {
  background:color-mix(in srgb,var(--panel) 72%,transparent);
  color:var(--ink)
}
.history-item[aria-current="true"] {
  color:var(--ink);
  background:color-mix(in srgb,var(--panel) 90%,transparent);
  border-color:var(--line);
  box-shadow:0 2px 8px rgba(35,60,48,.035)
}
.history-item svg {
  width:17px;
  height:17px;
  flex:0 0 auto;
  opacity:.72
}
.history-item span {
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}
.history-empty {
  margin:12px 7px;
  color:var(--muted);
  font-size:12px;
  line-height:1.7
}
.sidebar-spacer {
  flex:1;
  min-height:20px
}
.sidebar-note {
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:12px 10px 4px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
  line-height:1.65
}
.sidebar-note svg {
  width:17px;
  height:17px;
  flex:0 0 auto;
  margin-top:2px;
  color:var(--accent)
}

  .workspace {
  position:relative;
  isolation:isolate;
  min-width:0;
  height:var(--chat-viewport-height,100dvh);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--bg)
}
.ambient {
  position:absolute;
  inset:0;
  z-index:-1;
  overflow:hidden;
  pointer-events:none;
  background:radial-gradient(ellipse 60% 45% at 92% 8%,var(--glow-mint),transparent 78%),radial-gradient(ellipse 65% 54% at 5% 65%,var(--glow-violet),transparent 78%)
}
.ambient::before,.ambient::after {
  content:"";
  position:absolute;
  width:min(92vw,860px);
  height:min(65vh,680px);
  border-radius:50%;
  filter:blur(32px);
  opacity:.34;
  transition:opacity .65s ease
}
.ambient::before {
  top:-26%;
  right:-24%;
  background:radial-gradient(ellipse,var(--glow-mint),transparent 72%)
}
.ambient::after {
  bottom:-32%;
  left:-24%;
  background:radial-gradient(ellipse,var(--glow-violet),transparent 72%)
}
.workspace:has(.rider-status.is-searching) .ambient::before {
  opacity:.92;
  will-change:transform;
  animation:ambient-drift-a 8s ease-in-out infinite alternate
}
.workspace:has(.rider-status.is-searching) .ambient::after {
  opacity:.86;
  will-change:transform;
  animation:ambient-drift-b 10s ease-in-out infinite alternate
}
.workspace:has(.rider-status.is-searching) #ask {
  box-shadow:var(--shadow),0 0 34px color-mix(in srgb,var(--accent) 20%,transparent)
}
@keyframes ambient-drift-a {
  from { transform:translate3d(0,0,0) scale(1) }
  to { transform:translate3d(-19vw,19vh,0) scale(1.2) }
}
@keyframes ambient-drift-b {
  from { transform:translate3d(0,0,0) scale(1) }
  to { transform:translate3d(19vw,-17vh,0) scale(1.18) }
}
.topbar {
  flex:0 0 auto;
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:0 clamp(18px,3.4vw,48px);
  border-bottom:1px solid var(--line);
  background:var(--sidebar)
}
.topbar-start,.topbar-tools {
  min-width:0;
  display:flex;
  align-items:center;
  gap:12px
}
.topbar h1 {
  max-width:min(52vw,570px);
  margin:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:16px;
  line-height:1.4;
  font-weight:650
}
.trust-pill {
  display:inline-flex;
  align-items:center;
  gap:7px;
  white-space:nowrap;
  border:1px solid color-mix(in srgb,var(--accent) 14%,transparent);
  border-radius:100px;
  padding:6px 10px;
  color:var(--accent);
  background:color-mix(in srgb,var(--panel) 58%,transparent);
  font-size:11px;
  font-weight:650
}
.trust-pill svg {
  width:15px;
  height:15px
}
.pop-wrap { position:relative; display:inline-block; }
.lang-pop { margin-inline-start:auto; }
.pop-list, .pop-panel { position:absolute; z-index:40; top:calc(100% + 6px); margin:0; padding:4px; list-style:none; background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.14); min-width:150px; }
.lang-pop .pop-list { inset-inline-end:0; }
.pop-list[hidden], .pop-panel[hidden], .appearance-pop .pop-panel[hidden] { display:none !important; }
.pop-item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 11px; border-radius:8px; font-size:14px; color:var(--ink); cursor:pointer; }
.pop-item:hover, .pop-item:focus-visible { background:var(--accent-soft); outline:none; }
.pop-item[aria-selected="true"] { color:var(--accent); font-weight:650; }
.pop-item[aria-selected="true"]::after { content:"\2713"; font-size:12px; }
.pop-item[lang="ur"] { font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Alvi Nastaleeq",inherit; line-height:1.9; }
.verify-go { margin-top:10px; padding:9px 18px; font:inherit; color:#fff; background:var(--accent); border:0; border-radius:10px; cursor:pointer; }
.mic.attach span { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
@media (min-width:720px) { .mic.attach span { position:static; width:auto; height:auto; clip:auto; } }
.verify-verdict { font-weight:700; }
.verify-verdict[data-tone="exact"] { color:var(--status-found,#16a34a); }
.verify-verdict[data-tone="close"] { color:var(--accent); }
.verify-verdict[data-tone="none"] { color:var(--status-missing,#6b7280); }
.verify-card { padding:10px 12px; border:1px solid var(--line); border-radius:10px; }
.verify-card .where { font-size:13px; opacity:.85; margin-top:6px; }
.verify-answer { display:flex; gap:10px; margin-top:10px; }
.verify-no { padding:9px 18px; font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:10px; cursor:pointer; }
.verify-passage { margin:8px 0 0; line-height:2; }
.verify-passage strong { font-weight:800; background:color-mix(in srgb,var(--accent) 16%,transparent); border-radius:4px; padding:0 2px; }
.verify-side { margin-top:8px; font-size:13px; line-height:1.9; opacity:.7; }
.verify-side p { margin:2px 0 0; }
.verify-side-label { font-size:12px; font-weight:700; }
.verify-card q { display:block; margin-top:6px; line-height:1.9; quotes:none; }
.sidebar-preferences { display:flex; flex-direction:column; gap:6px; }
.sidebar-preferences .side-tool, .sidebar-preferences .voice-mode { display:flex; align-items:center; gap:10px; width:100%; min-height:40px; padding:8px 12px; font:inherit; font-size:14px; color:var(--ink); background:transparent; border:1px solid transparent; border-radius:10px; cursor:pointer; }
.sidebar-preferences .side-tool:hover, .sidebar-preferences .voice-mode:hover { background:color-mix(in srgb,var(--accent) 8%,transparent); }
.sidebar-preferences .voice-mode span { position:static; width:auto; height:auto; overflow:visible; clip:auto; }
.sidebar-preferences .voice-mode[aria-pressed="true"] { background:var(--accent-soft); color:var(--accent); }
.sidebar-preferences svg { width:19px; height:19px; flex:none; color:var(--accent); }
.appearance-pop { width:100%; }
.appearance-pop .pop-panel[hidden] { display:none; }
.appearance-pop .pop-panel { inset-inline:0; bottom:calc(100% + 6px); top:auto; display:grid; gap:10px; padding:10px; }
.seg { display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:3px; background:color-mix(in srgb,var(--accent) 7%,transparent); border-radius:10px; }
.seg button { padding:7px 4px; font:inherit; font-size:13px; color:var(--ink); background:transparent; border:0; border-radius:8px; cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--panel); color:var(--accent); font-weight:650; box-shadow:0 1px 3px rgba(0,0,0,.12); }
.dots { display:flex; justify-content:center; gap:12px; }
.dots button { width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer; box-shadow:0 0 0 1px var(--line); }
.dots button[aria-pressed="true"] { border-color:var(--panel); box-shadow:0 0 0 2px var(--accent); }
.appearance-pop .theme-toggle { width:100%; height:auto; display:flex; align-items:center; justify-content:flex-start; gap:10px; padding:8px 10px; font:inherit; font-size:13px; border-radius:10px; }
.lang-wrap {
  display:flex;
  align-items:center
}
.sr-only {
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap
}
.topbar select {
  max-width:100%;
  color:var(--ink);
  background:color-mix(in srgb,var(--panel) 70%,transparent);
  border:1px solid var(--line);
  border-radius:11px;
  padding:7px 9px;
  font-size:12px
}
.synthetic {
  flex:0 0 auto;
  margin:12px auto 0;
  width:min(850px,calc(100% - 40px));
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:color-mix(in srgb,var(--warn-bg) 83%,transparent);
  color:var(--warn-ink);
  font-size:12px;
  line-height:1.5
}

  .conversation-frame {
  position:relative;
  z-index:1;
  width:100%;
  max-width:1000px;
  min-height:0;
  flex:1;
  display:flex;
  flex-direction:column;
  align-self:center;
  padding:0 clamp(18px,4vw,58px)
}
#thread {
  min-height:0;
  flex:1;
  display:flex;
  flex-direction:column;
  gap:18px;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:24px 2px 22px;
  scroll-behavior:smooth
}
.empty-state {
  width:100%;
  margin:auto;
  padding:36px 0 48px;
  text-align:center;
  animation:arrive .55s ease both
}
.kids-list {
  list-style:none;
  margin:4px 0 10px;
  padding:0;
  display:grid;
  gap:10px
}
.kids-list li {
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:10px 12px;
  border-radius:14px;
  background:color-mix(in srgb,var(--accent) 7%,transparent);
  line-height:1.8
}
.kids-icon {
  flex:none;
  font-size:1.35em;
  line-height:1.4
}
.welcome-wordmark {
  width:min(430px,84%);
  margin:0 auto 3px;
  color:var(--accent);
  line-height:0
}
.welcome-wordmark svg {
  display:block;
  width:100%;
  height:auto;
  overflow:visible;
  filter:drop-shadow(0 7px 18px color-mix(in srgb,var(--accent) 18%,transparent))
}
.welcome-kicker {
  display:inline-block;
  position:relative;
  margin:0 auto 25px;
  color:var(--accent);
  font-size:17px;
  font-weight:700;
  letter-spacing:0;
  line-height:1.6;
  white-space:nowrap
}
.welcome-kicker-measure { visibility:hidden }
.welcome-kicker-typed {
  position:absolute;
  inset:0;
  text-align:start
}
.welcome-kicker.is-typing .welcome-kicker-typed::after {
  content:"";
  display:inline-block;
  width:2px;
  height:.95em;
  margin-inline-start:3px;
  vertical-align:-.13em;
  background:currentColor;
  animation:welcome-caret .7s steps(1,end) infinite
}
@keyframes welcome-caret {
  50% { opacity:0 }
}
.prompt-grid {
  max-width:720px;
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:11px;
  text-align:start
}
.suggestion {
  min-height:98px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--panel);
  box-shadow:0 4px 16px rgba(45,70,58,.025);
  cursor:pointer;
  text-align:start;
  transition:border-color .16s ease,transform .16s ease,background .16s ease
}
.suggestion:hover {
  transform:translateY(-2px);
  border-color:color-mix(in srgb,var(--accent) 31%,var(--line));
  background:color-mix(in srgb,var(--panel) 90%,transparent)
}
.suggestion-topic {
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--accent);
  font-size:11px;
  font-weight:700
}
.suggestion-topic:before {
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--accent)
}
.suggestion-text {
  color:var(--ink);
  font-size:12px;
  line-height:1.7
}

  .turn-user {
  align-self:flex-start;
  max-width:min(78%,690px);
  border:1px solid color-mix(in srgb,var(--accent) 8%,transparent);
  border-radius:18px 18px 5px 18px;
  padding:11px 17px;
  white-space:pre-line;
  background:var(--mine);
  color:var(--ink);
  box-shadow:0 3px 12px rgba(44,67,56,.035);
  animation:arrive .25s ease both
}
.msg {
  align-self:stretch;
  padding:20px 22px;
  border:1px solid color-mix(in srgb,var(--line) 78%,transparent);
  border-radius:18px;
  background:var(--panel);

  .turn-user {
    max-width:90%;
    padding:9px 13px;
    border-radius:16px 16px 5px 16px;
    font-size:14px
  }
  .msg {
    padding:15px 14px;
    border-radius:16px;
    font-size:14px
  }
  .answer-heading {
    margin-bottom:9px
  }
  #ask {
    padding:9px;
    border-radius:18px
  }
  .composer-field {
    gap:5px
  }
  textarea {
    min-height:52px;
    padding-inline:8px;
    font-size:16px
  }
  .composer-row {
    gap:8px;
    min-height:44px
  }
  .style-wrap {
    gap:8px;
    font-size:14px
  }
  .style-wrap select {
    max-width:170px;
    padding-inline:8px;
    font-size:14px
  }
  .mic {
    gap:6px;
    padding:6px 9px;
    font-size:14px
  }
  .send {
    width:44px;
    height:44px;
    border-radius:12px
  }
  .stop-request { min-height:44px; padding-inline:10px }
  .disclaimer {
    margin-block:8px 10px;
    font-size:13px
  }
}


.recitation { white-space:nowrap; margin-bottom:4px; }
body:not(.natural-voice) .voice-choice, body:not(.natural-voice) .listen-note { display:none; }
.recitation-row { display:flex; flex-direction:column; align-items:flex-start; gap:2px; }
/* Readability and zoom support */
@media (min-width:621px) {
  .trust-pill { font-size:13px; }
}
@media (max-width:860px) {
  .sidebar { overflow-y:auto; overscroll-behavior:contain; }
}
.brand-caption,
.history-heading,
.history-search input,
.history-item,
.history-empty,
.sidebar-note,
.topbar select,
.synthetic,
.suggestion-topic,
.suggestion-text,
.example-tag,
.answer-brand,
.status,
.cite,
.sources-title,
.card summary,
.card .about,
.card .meta,
.action-btn,
.action-status,
.more-item,
.no-voice,
.style-wrap,
.style-wrap select,
.mic,
.voice-note,
.disclaimer {
  font-size:max(13px,.875em);
}
@media (max-width:620px) {
  .topbar h1 { font-size:16px; }
  .topbar-tools select { font-size:14px; }
  .synthetic { font-size:13px; }
  .suggestion-text { font-size:15px; }
  .turn-user,.msg { font-size:15px; }
  textarea { font-size:16px; }
  .style-wrap,.style-wrap select,.mic { font-size:14px; }
  .disclaimer { font-size:13px; }
}
@media (max-width:420px) {
  .composer-row { flex-wrap:wrap; row-gap:8px; }
  .style-wrap { flex:1 1 100%; min-width:0; justify-content:space-between; }
  .style-wrap select { max-width:min(62vw,210px); }
}

/* Compact source-search scholar animation. */
.msg.pending.rider-status { display:flex; align-items:center; gap:10px; width:max-content; max-width:100%; min-width:0; padding:4px 0; border:0; border-radius:0; background:transparent; box-shadow:none; white-space:normal; }
.scholar-visual { width:48px; height:48px; flex:0 0 48px; background-image:var(--scholar-art); background-size:600% 100%; background-repeat:no-repeat; }
.is-searching .scholar-visual { animation:scholar-pages 1.4s step-end infinite; }
@keyframes scholar-pages { 0%,100% { background-position:0% 0; } 25% { background-position:20% 0; } 50% { background-position:40% 0; } 75% { background-position:60% 0; } }
.is-found .scholar-visual,.is-settled .scholar-visual { animation:scholar-close .55s step-end both; }
@keyframes scholar-close { 0% { background-position:60% 0; } 40% { background-position:80% 0; } 80%,100% { background-position:100% 0; } }
.msg.pending.rider-status { flex-wrap:wrap; }
.rider-status-copy { color:var(--muted); font-size:14px; line-height:1.6; }
.search-outcome { margin:0 0 12px; color:var(--muted); font-size:13px; }
:root { --bg:#fff; --sidebar:#f8f8fc; --line:#dedee9; --shadow:0 3px 14px rgba(18,24,63,.04); }
:root[data-theme="dark"] { --bg:#171d36; --sidebar:#1d2544; --line:#424b6b; }
.ambient,.trust-pill { display:none; }
.topbar { background:var(--bg); border-bottom:0; }
.welcome-wordmark { width:min(260px,65%); }
.welcome-wordmark svg { filter:none; }
.welcome-description { max-width:460px; margin:18px auto 16px; color:var(--muted); font-size:15px; line-height:1.9; text-wrap:pretty; }
.welcome-kicker { white-space:normal; margin-bottom:0; color:var(--ink); }
.msg:not(.pending) { border:0; background:transparent; box-shadow:none; padding-inline:0; }
#ask { display:flex; align-items:flex-end; gap:8px; padding:8px; box-shadow:none; backdrop-filter:none; }
.composer-field { flex:1; min-width:0; border:0; background:transparent; padding:0; }
.composer-field:focus-within { box-shadow:none; }
.composer-row { flex:0 0 auto; flex-wrap:nowrap; gap:6px; padding:0; min-height:44px; }
.mic,.stop-request { width:40px; height:44px; min-height:44px; padding:0; border:0; display:inline-flex; justify-content:center; align-items:center; }
.mic span,.stop-request span { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
.mic[hidden],.stop-request[hidden],.send[hidden] { display:none; }
.voice-note { flex:1 1 100%; }
#ask:has(.voice-note:not([hidden])) { flex-wrap:wrap; }
.style-settings { padding:10px 8px; color:var(--muted); font-size:13px; }
.style-settings summary { cursor:pointer; }
.action-btn[aria-pressed="true"],.action-btn[aria-pressed="true"]:disabled { color:var(--ink); opacity:1; background:var(--sidebar); }
.style-settings .style-wrap { display:flex; flex-direction:column; align-items:stretch; gap:5px; margin-top:12px; font-size:13px; }
.style-settings .style-wrap select { max-width:100%; }
@media(max-width:620px) { .welcome-wordmark { width:min(230px,65%); } .msg.pending.rider-status { width:max-content; padding:4px 0; } .composer-row { flex-wrap:nowrap; } textarea { min-height:44px; padding:7px; } .disclaimer { font-size:12px; } }
@media(prefers-reduced-motion:reduce) { .is-searching .scholar-visual,.is-found .scholar-visual,.is-settled .scholar-visual { animation:none; } .is-found .scholar-visual,.is-settled .scholar-visual { background-position:100% 0; } }

/* Chat content must be visible on its first paint, including during Android IME updates. */
.turn-user,.msg,.empty-state { animation:none; opacity:1; transform:none; }
@media(max-width:860px) {
  html,body { height:100%; overflow:hidden; }
  .app-shell { height:var(--chat-viewport-height,100dvh); min-height:0; overflow:hidden; }
  .workspace { height:100%; }
  #thread > .turn-user,#thread > .msg { flex-shrink:0; }
}
/* The question composer follows wrapped text, with scrolling only for long questions. */
#q { resize:none; overflow-y:hidden; }
:root { --status-found:#15803d; --status-missing:#6b7280; --status-referred:#dc2626; }
:root[data-theme="dark"] { --status-found:#4ade80; --status-missing:#9ca3af; --status-referred:#f87171; }
.status[data-tone="found"]::before { background:var(--status-found); }
.status[data-tone="missing"]::before { background:var(--status-missing); }
.status[data-tone="missing"] { color:var(--status-missing); }
.status[data-tone="referred"]::before { background:var(--status-referred); }

/* Muhawir: quiet parchment and ink; dark mode uses black and charcoal. */
:root {
  --bg:#F6F1E6; --panel:#FFFBF2; --sidebar:#F1EBDC;
  --ink:#25342D; --muted:#536258; --muted-soft:#647166;
  --accent:#30694E; --accent-ink:#FFFFFF; --accent-soft:#E4EDE4;
  --line:#C7D0C1; --card:#FFFBF2; --mine:#E6EDE3;
  --deep:#25342D; --indigo:#30694E; --focus:#30694E;
  --warn-bg:#E4EDE4; --warn-ink:#25342D;
  --shadow:0 3px 18px rgba(30,48,35,.06);
}
:root[data-theme="dark"] {
  --bg:#090A09; --panel:#202420; --sidebar:#171A18;
  --ink:#EDECE5; --muted:#BEC9BE; --muted-soft:#B1C0B4;
  --accent:#A2D2B2; --accent-ink:#102016; --accent-soft:#26362B;
  --line:#4A5A4D; --card:#202420; --mine:#28342B;
  --deep:#090A09; --indigo:#A2D2B2; --focus:#A2D2B2;
  --warn-bg:#26362B; --warn-ink:#EDECE5;
  --shadow:0 3px 18px rgba(0,0,0,.22);
}
body { background:var(--bg); }
.sidebar,.topbar { background:var(--sidebar); }
.topbar { height:60px; border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent); }
.topbar select { min-height:40px; padding:5px 9px; background:var(--panel); }
.welcome-wordmark { position:relative; width:min(200px,55%); margin-bottom:0; color:var(--accent); }
.welcome-book { position:absolute; left:13%; top:4%; display:block; width:25px; height:25px; color:var(--accent); }
.welcome-book svg { width:100%; height:100%; }
.welcome-book .book-left { transform-origin:50% 80%; animation:book-open-left .48s ease-out both; }
.welcome-book .book-right { transform-origin:50% 80%; animation:book-open-right .48s ease-out both; }
.welcome-book .book-page { transform-origin:50% 80%; animation:book-page-turn 1.8s ease-in-out .5s 2; }
@keyframes book-open-left { from { transform:scaleX(.2) } to { transform:scaleX(1) } }
@keyframes book-open-right { from { transform:scaleX(.2) } to { transform:scaleX(1) } }
@keyframes book-page-turn { 0%,100% { transform:scaleX(1) } 45% { transform:scaleX(-.7) } }
.empty-state { padding:12px 0 30px; }
.welcome-description { max-width:430px; margin:4px auto 2px; color:var(--muted); font-size:15px; line-height:1.75; }
.welcome-kicker { margin:0; font-size:14px; font-weight:500; color:var(--muted); }
.conversation-frame { max-width:860px; }
#thread { gap:14px; }
.turn-user { background:var(--mine); border-color:transparent; box-shadow:none; }
.msg:not(.pending) { background:transparent; }
#ask { display:flex; flex-direction:column; align-items:stretch; gap:0; padding:7px 10px 6px; background:var(--panel); border-color:var(--line); border-radius:20px; box-shadow:var(--shadow); }
#ask:focus-within { border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent); }
.composer-field { width:100%; align-self:stretch; }
textarea { min-height:42px; padding:5px 4px; line-height:1.7; text-align:start; }
.composer-row { width:100%; display:flex; align-items:center; justify-content:flex-end; gap:7px; min-height:36px; padding:0; }
.style-wrap { min-width:0; margin-inline-end:auto; gap:4px; color:var(--muted); font-size:12px; font-weight:500; }
.style-wrap select { max-width:140px; min-height:36px; padding:2px 5px; border:0; background:transparent; color:var(--ink); font-size:13px; }
.mic,.stop-request { width:38px; height:38px; min-height:38px; }
.send { width:40px; height:40px; border-radius:12px; }
.disclaimer { margin:7px 0 9px; font-size:11px; }
.card { overflow:visible; background:var(--panel); border-color:var(--line); }
.source-shelf { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr)); align-items:start; gap:8px 12px; margin-top:7px; padding-bottom:9px; border-bottom:2px solid color-mix(in srgb,var(--accent) 28%,var(--line)); }
.source-shelf .card { min-width:0; margin:0; }
.source-shelf .card[open] { grid-column:1/-1; }
.source-panel[hidden], .source-shelf .card[hidden] { display:none; }
.card summary { position:relative; isolation:isolate; min-height:66px; display:flex; align-items:center; justify-content:center; gap:8px; padding:9px 18px; border-radius:8px; background:radial-gradient(circle at 25% 30%,rgba(255,255,255,.11),transparent 45%),repeating-linear-gradient(105deg,transparent 0 3px,rgba(0,0,0,.035) 4px 5px),#365545; color:#F7EBD4; box-shadow:inset 0 0 0 2px #9E8561,inset 0 0 0 6px #365545,inset 0 0 0 7px rgba(224,197,139,.46),0 3px 5px rgba(0,0,0,.12); text-align:center; line-height:1.6; text-shadow:0 1px 1px #17291E,0 -1px rgba(255,244,204,.15); transition:transform .18s ease,box-shadow .18s ease; }

  if (r.status === 404 || r.status === 405 || !r.body) {  // an older server: the whole reply at once

function typeAnswer(msg) {
  if (welcomeMotion.matches || !msg.dataset.sourcedAnswer) return;
  const skip = ".answer-actions, .sources, details, button, [hidden], .source-cards";
  const nodes = [];
  msg.querySelectorAll("p.answer, h4.answer-section, li").forEach((box) => {
    if (box.closest(skip)) return;
    const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
    for (let n = walker.nextNode(); n; n = walker.nextNode()) {
      if (n.data.trim() && !n.parentElement.closest("sup")) nodes.push([n, n.data]);

  if (!total) return;

  const perFrame = Math.max(3, Math.ceil(total / 120));  // 120 frames, about two seconds
  let node = 0, shown = 0, frames = 0;
  const step = () => {
    let budget = perFrame;
    while (budget > 0 && node < nodes.length) {
      const [n, text] = nodes[node];
      const take = Math.min(budget, text.length - shown);
      shown += take; budget -= take;
      n.data = text.slice(0, shown);
      if (shown >= text.length) { node++; shown = 0; }

  };

  typed.textContent = "";
  node.classList.add("is-typing");
  let index = 0;
  const write = () => {
    if (!typed.isConnected) return;
    typed.textContent += letters[index++];
    if (index < letters.length) welcomeTypingTimer = window.setTimeout(write, letters[index] === " " ? 120 : 72);
    else {
      node.classList.remove("is-typing");
      welcomeTypingTimer = null;
    }
  };
  welcomeTypingTimer = window.setTimeout(write, 250);
}

// comes back as {status: "quote"} from the server, with no model: where it is, the passage around it and
// what comes before and after in the book. «اسأل عنه» sends the same text again as a question to be answered.
function renderQuote(res, context) {
  const t = UI[lang], body = res.quote || { status: "not_found", matches: [] };
  const msg = el("div", "msg quote-reply");
  const add = (parent, tag, text, cls) => { const n = document.createElement(tag); if (cls) n.className = cls; n.textContent = text; parent.appendChild(n); return n; };
  const askAbout = () => {
    const box = msg.querySelector(".verify-answer.ask-row");
    if (box) box.remove();
    nextAsk = { asQuestion: true };
    setQuestionText(context?.question || "");
    $("ask").requestSubmit();
  };
  const askRow = () => {
    const row = add(msg, "div", "", "verify-answer ask-row");
    const b = add(row, "button", t.quoteAsk, "verify-no");
    b.type = "button";
    b.addEventListener("click", askAbout);
  };
  const showResult = () => {
    msg.textContent = "";
    add(msg, "div", t.verifyExact, "verify-verdict").dataset.tone = "exact";
    body.matches.forEach((m) => {
      const card = add(msg, "div", "", "verify-card");
      add(card, "strong", m.source_name);
      const where = [m.location];
      if (m.grade) where.push(t.verifyGrade + ": " + m.grade);
      if (m.status !== "exact") where.push(t.verifyCoverage + ": " + Math.round(m.coverage * 100) + "%");
      add(card, "div", where.join(" \u00b7 "), "where");
      if ((m.also || []).length) add(card, "div", t.verifyAlso + ": " + m.also.join("\u060c "), "where");
      const side = (label, part) => {
        if (!part) return;
        const block = add(card, "div", "", "verify-side");
        add(block, "span", label + " \u00b7 " + part.location, "verify-side-label");
        add(block, "p", part.text);
      };
      side(t.contextBefore, m.before);
      const w = m.window || { lead: "", match: m.excerpt, trail: "" };
      const main = add(card, "p", "", "verify-passage");
      main.dir = "auto";
      main.append((w.cut_lead ? "\u2026" : "") + w.lead);
      add(main, "strong", w.match);
      main.append(w.trail + (w.cut_trail ? "\u2026" : ""));
      side(t.contextAfter, m.after);
    });
    askRow();
  };
  showResult();
  return msg;
}

// Upload: the text of a photo or a file is read on the server (nothing is stored) and put in a box for the visitor to check.
const uploadText = async (file) => {
  const t = UI[lang];
  if (file.size > 8 * 1024 * 1024) throw new Error(t.e_too_large);
  let res;
  try { res = await fetch("/api/extract", { method: "POST", headers: { "Content-Type": file.type || "application/octet-stream" }, body: file }); }
  catch { throw new Error(t.e_failed); }
  if (res.ok) return res.json();
  let code = "";
  try { code = (await res.json()).detail || ""; } catch { /* no body */ }
  if (res.status === 429) code = "busy";
  throw new Error(t["e_" + code] || t.e_failed);
};

// 6. Read aloud with the browser's voices or the server's natural voices.
// Muhawir's own words only: quoted ayahs, tafsir and hadith are never read by a computer voice.
function spokenText(res) {
  const parts = [];
  if (res.message) parts.push(res.message);
  // a sentence that cites a verse quotes it between «», {}, ﴿﴾ or "" (English translation): every quotation in
  // it is taken as the verse and replaced by «(آية)», so no synthetic voice ever reads the Quran
  const verseIds = new Set((res.sources || []).filter((s) => s.kind === "quran" || s.kind === "tafsir" || s.kind === "gharib")
    .map((s) => s.passage_id));
  const mark = /[\u0600-\u06FF]/.test(JSON.stringify(res.claims || [])) ? "(آية)" : "(verse)";
  const safe = (text, ids) => {
    let out = text.replace(/﴿[^﴾]*(?:﴾|$)/g, mark).replace(/\{[^}]*(?:\}|$)/g, mark);
    if ((ids || []).some((id) => verseIds.has(id) || String(id).startsWith("q:"))) {
      out = out.replace(/«[^»]*(?:»|$)/g, mark).replace(/"[^"]*(?:"|$)/g, mark).replace(/“[^”]*(?:”|$)/g, mark);
    }
    return out;
  };
  let heading = "";
  for (const c of res.claims || []) {
    if (c.text.startsWith("«")) continue;
    if (c.section && c.section !== heading) { heading = c.section; parts.push(heading + "."); }
    parts.push((c.label ? c.label + ": " : "") + safe(c.text, c.passage_ids));
  }
  if (res.follow_up) parts.push(res.follow_up);
  for (const v of res.views || []) parts.push(`${v.school}: ${safe(v.text, v.passage_ids)}`);
  return parts.join("\n");
}

// Browsers load their voices late (Chrome on first use), so wait for them briefly.
function voicesReady() {
  const now = speechSynthesis.getVoices();
  if (now.length) return Promise.resolve(now);
  return new Promise((resolve) => {
    const done = () => resolve(speechSynthesis.getVoices());
    speechSynthesis.addEventListener("voiceschanged", done, { once: true });
    setTimeout(done, 1500);
  });
}

// a browser voice whose name says it is a woman's or a man's, when the listener chose one (browsers do not say)
const FEMALE_NAME = /female|woman|zira|hoda|salma|zariyah|laila|layla|mariam|maryam|uzma|gul|samantha|ava|emma|aria|jenny|susan|hazel|naayf?a|amina|sana|noura/i;
const MALE_NAME = /\bmale|\bman\b|david|mark|naayf|hamed|shakir|asad|salman|andrew|brian|guy|george|tarik|maged|majed/i;
function pickVoice(voices, speakLang, gender = "") {
  const tag = { ar: "ar-sa", ur: "ur-pk", en: "en-us" }[speakLang] || "en-us";
  const ofLang = voices.filter((v) => v.lang.toLowerCase().replace("_", "-").startsWith(speakLang));
  const wanted = gender === "female" ? FEMALE_NAME : gender === "male" ? MALE_NAME : null;
  const best = (list) => list.find((v) => v.lang.toLowerCase().replace("_", "-") === tag) || list[0] || null;
  return (wanted && best(ofLang.filter((v) => wanted.test(v.name)))) || best(ofLang);
}

function listenButton(res, status) {
  const rawText = spokenText(res);
  if (!rawText) return null;
  const withoutVerses = rawText.replace(/﴿[^﴾]*(?:﴾|$)/g, "");
  // Urdu is written in the Arabic script: its own letters (ٹ ڈ ڑ ں ھ ہ ے) tell it apart
  const speakLang = /[\u0679\u0688\u0691\u06BA\u06BE\u06C1\u06D2\u06D3]/.test(withoutVerses) ? "ur"
    : /[\u0600-\u06FF]/.test(withoutVerses) ? "ar" : (withoutVerses.trim() ? "en" : lang);
  const text = rawText.replace(/﴿[^﴾]*(?:﴾|$)/g, { ar: "(آية)", ur: "(آیت)" }[speakLang] || "(verse)");
  const group = el("span", "listen-group");
  const row = el("span", "listen-controls");
  const btn = makeActionButton((UI[speakLang] || UI[lang]).listen, "listen");
  const label = btn.querySelector(".action-label");

  const choice = el("label", "voice-choice");
  const choiceLabel = el("span", "", UI[lang].voiceChoice);
  choiceLabel.dataset.itemKey = "voiceChoice";
  const select = el("select");
  select.dataset.speakLang = speakLang;
  const named = VOICE_LIST[speakLang] || [];
  if (named.length) {  // real recorded voices by name, women first: «زارية (السعودية) — امرأة»
    for (const v of named) {
      const option = el("option", "", `${v.names[lang] || v.names.en} — ${UI[lang][v.gender === "female" ? "femaleVoice" : "maleVoice"]}`);
      option.value = v.id;
      option.dataset.gender = v.gender;
      select.append(option);
    }
    const stored = storedVoice(speakLang);
    select.value = named.some((v) => v.id === stored) ? stored
      : (named.find((v) => v.gender === selectedSpeechVoice) || named[0]).id;
  } else {
    for (const [value, key] of [["female", "femaleVoice"], ["male", "maleVoice"]]) {
      const option = el("option", "", UI[lang][key]);
      option.value = value;
      option.dataset.itemKey = key;
      option.dataset.gender = value;
      select.append(option);
    }
    select.value = selectedSpeechVoice;
  }
  choice.append(choiceLabel, select);
  select.addEventListener("change", () => {
    selectedSpeechVoice = select.selectedOptions[0]?.dataset.gender || selectedSpeechVoice;
    try {
      localStorage.setItem("muhawir-speech-voice", selectedSpeechVoice);
      if (named.length) localStorage.setItem(`muhawir-voice-${speakLang}`, select.value);
    } catch { /* preference remains available for this page */ }
    document.querySelectorAll(".voice-choice select").forEach((other) => {
      if (other === select) return;
      if (other.dataset.speakLang === speakLang && named.length) other.value = select.value;
      else if ([...other.options].some((o) => o.value === selectedSpeechVoice)) other.value = selectedSpeechVoice;
    });
    stopReadAloud();
  });
  const note = el("small", "listen-note", (UI[speakLang] || UI[lang]).azureNotice);
  note.dataset.itemKey = "azureNotice";
  const reset = () => {
    delete btn.dataset.playing;
    btn.setAttribute("aria-pressed", "false");
    btn.dataset.labelKey = "listen";
    label.textContent = (UI[speakLang] || UI[lang]).listen;
    btn.setAttribute("aria-label", (UI[speakLang] || UI[lang]).listen);
    btn.title = (UI[speakLang] || UI[lang]).listen;
    icon.innerHTML = ACTION_ICONS.listen;
  };
  const setPlaying = () => {
    btn.dataset.playing = "1";
    btn.setAttribute("aria-pressed", "true");
    btn.dataset.labelKey = "stop";
    label.textContent = (UI[speakLang] || UI[lang]).stop;
    btn.setAttribute("aria-label", (UI[speakLang] || UI[lang]).stop);
    btn.title = (UI[speakLang] || UI[lang]).stop;
    icon.innerHTML = ACTION_ICONS.stop;
  };
  const browserFallback = async (playback) => {
    if (playback.fallbackStarted) return;
    playback.fallbackStarted = true;
    if (!("speechSynthesis" in window)) {
      playback.stop();
      status.textContent = UI[speakLang].noVoice;
      delete status.dataset.statusKey;
      return;
    }
    const voice = pickVoice(await voicesReady(), speakLang, select.selectedOptions[0]?.dataset.gender || selectedSpeechVoice);
    if (activeReadAloud !== playback) return;
    if (!voice) {
      playback.stop();
      status.textContent = UI[speakLang].noVoice;
      delete status.dataset.statusKey;
      return;
    }
    status.textContent = "";
    delete status.dataset.statusKey;
    setPlaying();
    const parts = pieces(text);
    parts.forEach((part, i) => {
      const u = new SpeechSynthesisUtterance(part);
      u.lang = voice.lang;
      try { u.voice = voice; } catch { /* the language tag alone still picks it */ }
      if (i === parts.length - 1) u.onend = () => playback.stop();
      u.onerror = () => playback.stop();
      speechSynthesis.speak(u);
    });
  };
  btn.play = async () => {
    stopReadAloud();
    const controller = new AbortController();
    const playback = {
      button: btn, audio: null, url: null, ready: false, fallbackStarted: false,
      stop() {
        controller.abort();
        if ("speechSynthesis" in window) speechSynthesis.cancel();
        if (this.audio) { this.audio.pause(); this.audio.removeAttribute("src"); this.audio.load(); }
        if (this.url) URL.revokeObjectURL(this.url);
        if (activeReadAloud === this) activeReadAloud = null;
        if (["voiceLoading", "voiceTap"].includes(status.dataset.statusKey)) {
          status.textContent = "";
          delete status.dataset.statusKey;
        }
        reset();
      }
    };
    activeReadAloud = playback;
    setPlaying();
    setActionStatus(status, "voiceLoading");
    try {
      if (!document.body.classList.contains("natural-voice")) throw new Error("no natural voice on this server");
      const response = await fetch("/tts", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, voice: select.value, lang: speakLang }),
        signal: controller.signal
      });
      if (!response.ok) throw new Error("Azure speech unavailable");
      const blob = await response.blob();
      if (activeReadAloud !== playback) return;
      playback.url = URL.createObjectURL(blob);
      playback.audio = new Audio(playback.url);
      playback.audio.addEventListener("ended", () => playback.stop(), { once: true });
      playback.audio.addEventListener("error", () => {
        if (activeReadAloud === playback) {
          playback.audio.pause();
          URL.revokeObjectURL(playback.url);
          playback.url = null;
          playback.audio = null;
          browserFallback(playback);
        }
      }, { once: true });
      await playback.audio.play();
      if (activeReadAloud === playback) { status.textContent = ""; delete status.dataset.statusKey; }
    } catch (error) {
      if (activeReadAloud !== playback) return;
      if (error.name === "NotAllowedError" && playback.audio) {
        playback.ready = true;
        reset();
        setActionStatus(status, "voiceTap");
      } else {
        await browserFallback(playback);  // includes 503, timeouts and network failures
      }
    }
  };
  btn.addEventListener("click", () => {
    if (activeReadAloud?.ready && activeReadAloud.button === btn) {
      const playback = activeReadAloud;
      playback.ready = false;
      setPlaying();
      playback.audio.play().then(() => { status.textContent = ""; delete status.dataset.statusKey; })
        .catch(() => browserFallback(playback));
      return;
    }
    if (btn.dataset.playing) { stopReadAloud(); return; }
    btn.play();
  });
  row.append(btn, choice);
  group.append(row, note);
  group.play = btn.play;
  return group;
}

// The recitation of a verse.
// a verse is heard only in a reciter's real voice: Mishary Alafasy's recording of that ayah from everyayah.com,
// played from their server (nothing is copied here); never a synthetic voice
let activeRecitation = null;
function recitationButton(surah, ayah) {
  const t = UI[lang] || UI.ar;

  btn.type = "button";
  const src = `https://everyayah.com/data/Alafasy_128kbps/${String(surah).padStart(3, "0")}${String(ayah).padStart(3, "0")}.mp3`;
  const stop = () => {
    if (activeRecitation) { activeRecitation.audio.pause(); activeRecitation.btn.textContent = "▶ " + t.recite; }
    activeRecitation = null;
  };
  btn.addEventListener("click", () => {

    audio.play().catch(() => { stop(); btn.textContent = t.reciteFailed; });
